<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产结果 · 交互原型 — DoukHub</title>
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --muted:#F5F2EC;
  --text:#1F1B17; --text2:#5C564E; --textm:#A39E96;
  --border:#ECE7DF; --border2:#D9D3C8;
  --accent:#0061A4; --accent-hover:#004F8A; --accent-soft:#E7F0F8;
  --success:#16A34A; --success-soft:#ECFDF3;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --shadow-sm:0 1px 2px rgba(31,27,23,.04);
  --shadow-lg:0 8px 24px rgba(31,27,23,.12);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:var(--font);color:var(--text);padding:28px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px}

/* ===== 卡片 ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-head .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.panel-head h2{font-size:15px;font-weight:700;letter-spacing:.2px}
.panel-head .count{font-size:12.5px;color:var(--textm);font-weight:500}

/* ===== 作品头部 ===== */
.work{display:flex;gap:16px;padding:18px}
.cover{width:150px;aspect-ratio:3/4;border-radius:var(--r);object-fit:cover;flex-shrink:0;cursor:zoom-in}
.winfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.author-row{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F3C9D6,#E7F0F8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text2)}
.aname{font-weight:700;font-size:14.5px}
.asub{font-size:12px;color:var(--textm);display:flex;align-items:center;gap:4px}
.author-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--muted);color:var(--text2)}
.badge.dy{background:#FBEBF1;color:#B0356B}
.btn-share{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1.5px solid rgba(0,97,164,.4);border-radius:999px;cursor:pointer;transition:.15s}
.btn-share:hover{background:#D8E9F6;border-color:var(--accent)}
.desc{font-size:13.5px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;gap:16px;font-size:12.5px;color:var(--textm)}
.stats b{color:var(--text);font-weight:600}

/* ===== 新版工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--border);background:var(--surface)}
.seg{display:flex;background:var(--muted);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--text2);padding:5px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
.seg button .n{font-size:11px;background:rgba(31,27,23,.08);padding:1px 6px;border-radius:999px}
.seg button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.seg button.active .n{background:var(--accent-soft);color:var(--accent)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sel-count{font-size:12.5px;color:var(--textm);font-weight:500;opacity:0;transition:.2s}
.sel-count.show{opacity:1}
.sel-count b{color:var(--accent)}
.iconbtn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s}
.iconbtn:hover{border-color:var(--border2);background:var(--muted)}
.iconbtn svg{width:15px;height:15px}
.btn-dl{display:flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;padding:8px 18px;border-radius:var(--r);cursor:pointer;transition:.2s;border:1px solid transparent;background:var(--muted);color:var(--textm)}
.btn-dl svg{width:14px;height:14px}
.btn-dl.ready{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,97,164,.25)}
.btn-dl.ready:hover{background:var(--accent-hover)}
.btn-dl.ready .pulse{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ===== 勾选进度线 ===== */
.progress{height:3px;background:var(--muted);position:relative}
.progress .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#4DA3FF);transition:width .25s ease;border-radius:0 3px 3px 0}

/* ===== 列表视图 ===== */
.assets{padding:6px 12px 14px}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:var(--r);transition:.12s;position:relative}
.row:hover{background:var(--muted)}
.row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.row.selected{background:var(--accent-soft)}
.thumb{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;cursor:zoom-in;flex-shrink:0}
.thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--muted);color:var(--textm)}
.row .kind{font-size:12.5px;font-weight:600;width:64px;flex-shrink:0}
.row .url{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--textm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ops{display:none;gap:2px}
.row:hover .ops{display:flex}
.ops button,.ops a{width:28px;height:28px;border:none;border-radius:var(--r-sm);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);box-shadow:var(--shadow-sm)}
.ops svg{width:13px;height:13px}

/* ===== 网格视图 ===== */
.assets.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.cell{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:2px solid transparent;background:var(--muted);cursor:pointer;transition:.15s}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .kind{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:14px 6px 5px;text-align:center}
.cell .cb{position:absolute;bottom:26px;right:6px;width:17px;height:17px;accent-color:var(--accent);cursor:pointer;z-index:3}
.cell:hover{border-color:var(--border2)}
.cell.selected{border-color:var(--accent)}
.cell.selected .tick{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;animation:pop .25s ease}
.hint{padding:8px 18px 14px;font-size:12px;color:var(--textm);display:flex;align-items:center;gap:6px}
kbd{font-family:var(--mono);font-size:10.5px;background:var(--muted);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,17,14,.85);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
.lb:target{display:flex}
.lb img{max-width:88vw;max-height:88vh;border-radius:var(--r-lg)}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel">
    <div class="panel-head">
      <span class="dot"></span><h2>资产结果</h2><span class="count">8 个资产 · 1 个作品</span>
    </div>

    <!-- 作品信息 -->
    <div class="work">
      <img class="cover" src="https://picsum.photos/seed/dk1/300/400" alt="cover">
      <div class="winfo">
        <div class="author-row">
          <div class="avatar">姨</div>
          <div><div class="aname">你的姨姨 <span class="asub">2026-08-17</span></div></div>
          <div class="author-right">
            <span class="badge dy">抖音</span>
            <button class="btn-share" title="将此账号录入分享表">＋ 录入分享表</button>
          </div>
        </div>
        <div class="desc">#夏日辣妹穿搭 #户外长裙穿搭 夏天的快乐就是穿漂亮裙子出门晒太阳☀️ 同款链接在评论区～</div>
        <div class="stats"><span>❤ <b>2.4w</b> 赞</span><span>💬 <b>1832</b> 评</span><span>⭐ <b>9806</b> 藏</span><span>↗ <b>3211</b> 转</span></div>

        <!-- 新版工具栏 -->
        <div class="toolbar" style="margin:0 -18px;padding:10px 18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface)">
          <div class="seg" id="seg">
            <button class="active" data-k="all">全部 <span class="n">8</span></button>
            <button data-k="video">视频 <span class="n">1</span></button>
            <button data-k="image">图片 <span class="n">7</span></button>
          </div>
          <div class="toolbar-right">
            <span class="sel-count" id="selCount">已选 <b>0</b> / 8</span>
            <button class="iconbtn" id="viewBtn" title="切换列表/网格视图">
              <svg id="viewIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button class="btn-dl" id="dlBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              下载选中
            </button>
          </div>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
    </div>

    <!-- 资产区（JS 渲染） -->
    <div class="assets" id="assets"></div>
    <div class="hint">💡 单击勾选 · <kbd>双击</kbd> 放大预览 · 悬停右上角出现复制 / 打开 / 单项下载</div>
  </section>
</div>

<div class="lb" id="lb" onclick="this.style.display='none'"><img id="lbImg" src="" alt="preview"></div>

<script>
const ASSETS = [
  {k:'video',  n:'视频 1', url:'https://v.douyin.com/abc123/video/7301...', seed:'v1'},
  {k:'image',  n:'图片 1', url:'https://p3.douyinpic.com/img/7301a...', seed:'i1'},
  {k:'image',  n:'图片 2', url:'https://p3.douyinpic.com/img/7301b...', seed:'i2'},
  {k:'image',  n:'图片 3', url:'https://p3.douyinpic.com/img/7301c...', seed:'i3'},
  {k:'image',  n:'图片 4', url:'https://p3.douyinpic.com/img/7301d...', seed:'i4'},
  {k:'image',  n:'图片 5', url:'https://p3.douyinpic.com/img/7301e...', seed:'i5'},
  {k:'image',  n:'图片 6', url:'https://p3.douyinpic.com/img/7301f...', seed:'i6'},
  {k:'image',  n:'图片 7', url:'https://p3.douyinpic.com/img/7301g...', seed:'i7'},
];
const ICONS={copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
 open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'};
const img=s=>`https://picsum.photos/seed/${s}/200/200`;
let grid=false, filter='all', sel=new Set();

const box=document.getElementById('assets');
function visible(){return ASSETS.filter(a=>filter==='all'||a.k===filter)}
function render(){
  const list=visible();
  if(grid){
    box.className='assets grid';
    box.innerHTML=list.map((a,i)=>`<div class="cell ${sel.has(a.n)?'selected':''}" data-n="${a.n}">
      ${sel.has(a.n)?`<span class="tick">${[...visible()].findIndex(x=>x.n===a.n)+1}</span>`:''}
      <img src="${img(a.seed)}" alt="">
      <span class="kind">${a.n}</span>
      <input type="checkbox" class="cb" ${sel.has(a.n)?'checked':''}>
    </div>`).join('');
    box.querySelectorAll('.cell').forEach(c=>{
      c.onclick=e=>{ if(e.target.classList.contains('cb'))return; toggle(c.dataset.n); };
      c.ondblclick=()=>{ lbImg.src=img(c.dataset.n.split(' ')[1]||'x'); lb.style.display='flex'; };
    });
    box.querySelectorAll('.cb').forEach(cb=>cb.onchange=()=>toggle(cb.parentElement.dataset.n));
  }else{
    box.className='assets';
    box.innerHTML=list.map(a=>`<div class="row ${sel.has(a.n)?'selected':''}" data-n="${a.n}">
      <input type="checkbox" ${sel.has(a.n)?'checked':''}>
      <img class="thumb" src="${img(a.seed)}" alt="">
      <span class="kind">${a.n}</span>
      <span class="url">${a.url}</span>
      <div class="ops">
        <button title="复制链接">${ICONS.copy}</button>
        <a title="打开">${ICONS.open}</a>
        <button title="下载此项">${ICONS.dl}</button>
      </div>
    </div>`).join('');
    box.querySelectorAll('.row').forEach(r=>{
      const cb=r.querySelector('input');
      cb.onchange=()=>toggle(r.dataset.n);
      r.querySelector('.thumb').ondblclick=()=>{ lbImg.src=img(r.dataset.n.split(' ')[1]||'x'); lb.style.display='flex'; };
    });
  }
  update();
}
function toggle(n){ sel.has(n)?sel.delete(n):sel.add(n); render(); }
function update(){
  const total=ASSETS.length;
  document.getElementById('bar').style.width=(sel.size/total*100)+'%';
  const sc=document.getElementById('selCount');
  sc.classList.toggle('show',sel.size>0);
  sc.innerHTML=`已选 <b>${sel.size}</b> / ${total}`;
  const btn=document.getElementById('dlBtn');
  if(sel.size>0){ btn.classList.add('ready'); btn.innerHTML=`<span class="pulse">⬇</span> 下载选中 (${sel.size})`; }
  else{ btn.classList.remove('ready'); btn.innerHTML=`${ICONS.dl} 下载选中`; }
}
document.getElementById('viewBtn').onclick=()=>{
  grid=!grid;
  document.getElementById('viewIco').innerHTML=grid
   ?'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>'
   :'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>';
  render();
};
document.getElementById('seg').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    document.getElementById('seg').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); filter=b.dataset.k; render();
  };
});
render();
</script>
</body>
</html>
