<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产结果工具栏 · 原型2（仅调布局，按钮逻辑不变）— DoukHub</title>
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --muted:#F5F2EC;
  --text:#1F1B17; --text2:#5C564E; --textm:#A39E96;
  --border:#ECE7DF; --border2:#D9D3C8;
  --accent:#0061A4; --accent-hover:#004F8A; --accent-soft:#E7F0F8;
  --success:#16A34A;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --shadow-sm:0 1px 2px rgba(31,27,23,.04);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:var(--font);color:var(--text);padding:28px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:22px}
.note{font-size:13px;color:var(--text2);background:var(--accent-soft);border:1px solid rgba(0,97,164,.25);border-radius:var(--r);padding:10px 14px;line-height:1.6}
.note b{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-tag{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--textm);padding:10px 16px 0}
.panel-body{padding:10px 16px 16px}

/* ====== 旧版工具栏（现状参考） ====== */
.toolbar-old{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;background:var(--muted);border-radius:var(--r)}
/* ====== 新版工具栏：同按钮、同逻辑，仅分区排列 ====== */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 10px;background:var(--muted);border-radius:var(--r)}

/* 左区：资产数 + 选择类操作 */
.tb-left{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
/* 右区：下载主按钮 + 视图切换 */
.tb-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}

/* —— 以下按钮样式与现网一致（仅微调呼吸感），逻辑未动 —— */
.toolbar-count{font-size:12.5px;color:var(--textm);font-weight:600;white-space:nowrap;padding-left:4px}
.toolbar-btn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:500;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
.toolbar-btn:hover{border-color:var(--border2);background:#fff}
.toolbar-btn svg{width:14px;height:14px}
.toolbar-btn.kind-filter{color:var(--accent);border-color:rgba(0,97,164,.35);background:var(--accent-soft);font-weight:600}
.toolbar-btn.kind-filter:hover{background:#DCEAF6}
.toolbar-btn.kind-filter .kind-count{font-weight:700}
.toolbar-btn.aux-filter-btn{color:var(--textm);border-style:dashed}
.toolbar-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.toolbar-btn.primary:hover{background:var(--accent-hover)}
.toolbar-btn.view-toggle{width:30px;padding:0;justify-content:center}
.toolbar-count-selected{font-weight:700;margin-left:1px}
/* 分区竖线：视觉上隔开“选择区”与“动作区” */
.tb-divider{width:1px;height:18px;background:var(--border2);margin:0 2px;flex-shrink:0}

/* ====== 资产列表（保持现有交互：勾选/双击放大） ====== */
.assets{margin-top:10px}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r);transition:.12s}
.row:hover{background:var(--muted)}
.row.selected{background:var(--accent-soft)}
.row input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.thumb{width:46px;height:46px;border-radius:var(--r-sm);object-fit:cover;cursor:zoom-in;flex-shrink:0;background:var(--muted)}
.row .kind{font-size:12.5px;font-weight:600;width:60px;flex-shrink:0;color:var(--text2)}
.row .url{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--textm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ops{display:none;gap:4px}
.row:hover .ops{display:flex}
.ops button,.ops a{width:27px;height:27px;border:none;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.ops svg{width:13px;height:13px}

.lb{position:fixed;inset:0;background:rgba(20,17,14,.85);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
.lb img{max-width:88vw;max-height:88vh;border-radius:var(--r-lg)}
</style>
</head>
<body>
<div class="wrap">
  <div class="note">原型2：<b>所有按钮的功能、点击逻辑、样式体系完全沿用现状</b>，只重排布局——左区「资产数 + 全选 + 类型筛选」，右区「下载选中（主按钮）+ 视图切换」，中间竖线分区。旧版在下方作对照。</div>

  <!-- 新版 -->
  <section class="panel">
    <div class="panel-tag">新版布局（仅调整排列）</div>
    <div class="panel-body">
      <div class="toolbar">
        <div class="tb-left">
          <span class="toolbar-count">8 个资产</span>
          <button type="button" class="toolbar-btn" onclick="alert('全选（逻辑同现网 toggleAllAssets）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> 全选</button>
          <button type="button" class="toolbar-btn kind-filter" onclick="alert('筛选视频（逻辑同现网 selectAssetsByKind）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> 视频<b class="kind-count">1</b></button>
          <button type="button" class="toolbar-btn" onclick="alert('筛选图片（逻辑同现网）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> 图片(7)</button>
          <button type="button" class="toolbar-btn aux-filter-btn" onclick="alert('筛选封面（逻辑同现网）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l4-4 5 5"/><path d="M14 12h.01"/></svg> 封面(2)</button>
        </div>
        <div class="tb-right">
          <span class="tb-divider"></span>
          <button type="button" class="toolbar-btn primary" onclick="alert('下载选中（逻辑同现网 downloadSelectedAssets）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载选中<span class="toolbar-count-selected">3</span></button>
          <button type="button" class="toolbar-btn view-toggle" title="切换列表/网格视图" onclick="alert('视图切换（逻辑同现网 toggleAssetView）')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        </div>
      </div>
      <div class="assets" id="assets"></div>
    </div>
  </section>

  <!-- 旧版对照 -->
  <section class="panel">
    <div class="panel-tag">旧版布局（现状对照）</div>
    <div class="panel-body">
      <div class="toolbar-old">
        <span class="toolbar-count">8 个资产</span>
        <button type="button" class="toolbar-btn">☑ 全选</button>
        <button type="button" class="toolbar-btn kind-filter">视频 1</button>
        <button type="button" class="toolbar-btn">图片(7)</button>
        <button type="button" class="toolbar-btn primary">下载选中 3</button>
        <button type="button" class="toolbar-btn view-toggle">▦</button>
      </div>
    </div>
  </section>
</div>

<div class="lb" id="lb" onclick="this.style.display='none'"><img id="lbImg" src="" alt="preview"></div>

<script>
const ASSETS=[
 {n:'视频 1',seed:'v1',url:'https://v.douyin.com/abc/video/7301...'},
 {n:'图片 1',seed:'i1',url:'https://p3.douyinpic.com/img/7301a...'},
 {n:'图片 2',seed:'i2',url:'https://p3.douyinpic.com/img/7301b...'},
 {n:'图片 3',seed:'i3',url:'https://p3.douyinpic.com/img/7301c...'},
];
const img=s=>`https://picsum.photos/seed/${s}/100/100`;
const box=document.getElementById('assets');
const sel=new Set([1,2,3]);
function render(){
  box.innerHTML=ASSETS.map((a,i)=>`<div class="row ${sel.has(i)?'selected':''}" data-i="${i}">
    <input type="checkbox" ${sel.has(i)?'checked':''}>
    <img class="thumb" src="${img(a.seed)}" alt="">
    <span class="kind">${a.n}</span><span class="url">${a.url}</span>
    <div class="ops"><button title="复制链接">⧉</button><a title="打开">↗</a><button title="下载此项">⬇</button></div>
  </div>`).join('');
  box.querySelectorAll('.row').forEach(r=>{
    const i=+r.dataset.i;
    r.querySelector('input').onchange=e=>{ e.target.checked?sel.add(i):sel.delete(i); r.classList.toggle('selected',sel.has(i)); };
    r.querySelector('.thumb').ondblclick=()=>{ document.getElementById('lbImg').src=img(ASSETS[i].seed); document.getElementById('lb').style.display='flex'; };
  });
}
render();
</script>
</body>
</html>
