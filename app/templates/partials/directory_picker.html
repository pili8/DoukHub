<div id="directory-picker-overlay" class="dh-modal-overlay">
    <div class="dh-modal-box directory-picker-box" role="dialog" aria-modal="true" aria-labelledby="directory-picker-title">
        <div class="dh-modal-header">
            <h3 id="directory-picker-title"><i data-lucide="folder-open"></i> 选择文件夹</h3>
            <button type="button" class="dh-modal-close" onclick="closeDirectoryPicker()"><i data-lucide="x"></i></button>
        </div>
        <div class="dh-modal-body">
            <div class="directory-picker-toolbar">
                <button type="button" id="directory-picker-up" class="btn btn-secondary btn-sm" title="上一级" onclick="directoryPickerUp()"><i data-lucide="arrow-up"></i></button>
                <button type="button" class="btn btn-secondary btn-sm" title="此电脑" onclick="loadDataRootDirectories('', 1)"><i data-lucide="hard-drive"></i></button>
                <input id="directory-picker-location" class="input" placeholder="此电脑 / 输入路径后按 Enter" spellcheck="false">
                <button type="button" id="directory-picker-new" class="btn btn-secondary btn-sm" onclick="toggleCreateDirectory()"><i data-lucide="folder-plus"></i> 新建</button>
            </div>
            <div id="directory-picker-create" class="directory-picker-create" style="display:none;">
                <input id="directory-picker-name" class="input" placeholder="文件夹名称">
                <button type="button" class="btn btn-primary btn-sm" onclick="createDirectory()">创建</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="toggleCreateDirectory(false)">取消</button>
            </div>
            <div id="directory-picker-list" class="directory-picker-list"></div>
            <small id="directory-picker-status"></small>
        </div>
        <div class="dh-modal-actions">
            <button type="button" class="dh-btn dh-btn-ghost" onclick="closeDirectoryPicker()">取消</button>
            <button type="button" class="dh-btn dh-btn-primary" onclick="confirmDirectoryPicker()">选择当前目录</button>
        </div>
    </div>
</div>

<style>
    .directory-picker-box { display:flex; flex-direction:column; width:min(94vw,680px); max-width:680px; max-height:min(90vh,720px); }
    .directory-picker-toolbar { display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:8px; align-items:center; }
    .directory-picker-create { display:flex; gap:8px; margin-top:8px; }
    .directory-picker-create .input { min-width:0; }
    .directory-picker-list { min-height:260px; max-height:min(48vh,430px); overflow:auto; margin-top:10px; border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--bg-input); }
    .directory-item { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; min-height:42px; padding:0 8px; border-bottom:1px solid var(--border-default); }
    .directory-item:last-child { border-bottom:0; }
    .directory-item.selected { background:var(--bg-hover); box-shadow:inset 2px 0 0 var(--accent); }
    .directory-item-main { display:flex; align-items:center; gap:10px; min-width:0; padding:9px 6px; background:transparent; border:0; color:var(--text-primary); font:inherit; text-align:left; cursor:pointer; }
    .directory-item-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .directory-item-open { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:8px; background:transparent; color:var(--text-secondary); cursor:pointer; }
    .directory-item-open:hover, .directory-item-main:hover { background:var(--bg-hover); color:var(--text-primary); }
    .directory-picker-empty { padding:28px 12px; color:var(--text-muted); text-align:center; font-size:13px; }
    #directory-picker-status { display:block; margin-top:8px; color:var(--text-muted); }
    @media (max-width:560px) {
        .directory-picker-box { padding:16px; }
        .directory-picker-list { min-height:220px; }
    }
</style>

<script>
    let directoryPickerPath = '';
    let directoryPickerParent = null;
    let directoryPickerSelected = '';
    let directoryPickerTarget = null;
    let directoryPickerAfterConfirm = null;

    function openDirectoryPicker(inputId, afterConfirm) {
        directoryPickerTarget = document.getElementById(inputId);
        directoryPickerAfterConfirm = afterConfirm || null;
        toggleCreateDirectory(false);
        document.getElementById('directory-picker-overlay').classList.add('dh-show');
        loadDataRootDirectories('', 1);
    }

    function closeDirectoryPicker() {
        document.getElementById('directory-picker-overlay').classList.remove('dh-show');
    }

    function setDirectoryPickerStatus(message) {
        document.getElementById('directory-picker-status').textContent = message || '';
    }

    function renderDirectoryList(directories) {
        const list = document.getElementById('directory-picker-list');
        list.textContent = '';
        if (!directories.length) {
            const empty = document.createElement('div');
            empty.className = 'directory-picker-empty';
            empty.textContent = '这里没有可进入的文件夹';
            list.appendChild(empty);
            return;
        }

        directories.forEach(item => {
            const row = document.createElement('div');
            row.className = 'directory-item' + (item.path === directoryPickerSelected ? ' selected' : '');
            const main = document.createElement('button');
            main.type = 'button';
            main.className = 'directory-item-main';
            main.title = item.path;
            main.innerHTML = '<i data-lucide="folder"></i>';
            const name = document.createElement('span');
            name.className = 'directory-item-name';
            name.textContent = item.name;
            main.appendChild(name);
            main.onclick = () => selectDirectoryPickerItem(item.path, row);

            const open = document.createElement('button');
            open.type = 'button';
            open.className = 'directory-item-open';
            open.title = '进入';
            open.setAttribute('aria-label', '进入 ' + item.name);
            open.innerHTML = '<i data-lucide="chevron-right"></i>';
            open.onclick = () => loadDataRootDirectories(item.path);
            row.append(main, open);
            list.appendChild(row);
        });
        if (window.lucide) lucide.createIcons();
    }

    async function loadDataRootDirectories(path, computer = 0) {
        const locationInput = document.getElementById('directory-picker-location');
        document.getElementById('directory-picker-list').innerHTML =
            '<div class="directory-picker-empty">正在加载...</div>';
        const query = new URLSearchParams({ path, computer });
        const data = await apiCall(`/api/data-migration/directories?${query}`);
        if (!data.success) {
            document.getElementById('directory-picker-list').innerHTML =
                '<div class="directory-picker-empty">目录读取失败</div>';
            setDirectoryPickerStatus(data.message || '目录读取失败');
            return;
        }

        directoryPickerPath = data.path;
        directoryPickerParent = data.parent;
        directoryPickerSelected = data.path;
        locationInput.value = data.path || '此电脑';
        document.getElementById('directory-picker-up').disabled = !data.parent;
        renderDirectoryList(data.directories || []);
        setDirectoryPickerStatus('当前目录：' + (data.path || '此电脑'));
    }

    function selectDirectoryPickerItem(path, row) {
        directoryPickerSelected = path;
        document.getElementById('directory-picker-location').value = path;
        document.querySelectorAll('.directory-item.selected').forEach(el => el.classList.remove('selected'));
        row.classList.add('selected');
        setDirectoryPickerStatus('已选择：' + path);
    }

    function directoryPickerUp() {
        if (directoryPickerParent) loadDataRootDirectories(directoryPickerParent);
    }

    function toggleCreateDirectory(force) {
        const row = document.getElementById('directory-picker-create');
        const show = force === undefined ? row.style.display === 'none' : force;
        row.style.display = show ? 'flex' : 'none';
        if (show) document.getElementById('directory-picker-name').focus();
        else document.getElementById('directory-picker-name').value = '';
    }

    async function createDirectory() {
        const name = document.getElementById('directory-picker-name').value.trim();
        if (!name) { setDirectoryPickerStatus('请输入文件夹名称'); return; }
        const data = await apiCall('/api/data-migration/directories/create', 'POST', {
            parent: directoryPickerPath, name
        });
        if (!data.success) { setDirectoryPickerStatus(data.message || '创建失败'); return; }
        toggleCreateDirectory(false);
        loadDataRootDirectories(directoryPickerPath);
    }

    function confirmDirectoryPicker() {
        const selected = directoryPickerSelected || directoryPickerPath;
        if (!selected || !directoryPickerTarget) return;
        directoryPickerTarget.value = selected;
        closeDirectoryPicker();
        if (directoryPickerAfterConfirm) directoryPickerAfterConfirm(selected);
    }

    document.getElementById('directory-picker-location').addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        const value = event.target.value.trim();
        if (!value || value === '此电脑') loadDataRootDirectories('', 1);
        else loadDataRootDirectories(value);
    });
    document.getElementById('directory-picker-name').addEventListener('keydown', event => {
        if (event.key === 'Enter') createDirectory();
    });
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && document.getElementById('directory-picker-overlay').classList.contains('dh-show')) {
            closeDirectoryPicker();
        }
    });
</script>
