<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}DoukHub{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#0061A4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1C1E" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/icon-192.png">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DoukHub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/static/js/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/vendor/phosphor/regular/style.css">
    <link id="theme-css" rel="stylesheet" href="/static/css/style.css?v=54">
    <script>
      // 明暗模式:localStorage 优先,否则跟随系统,首屏设定避免闪烁
      (function() {
        var saved = localStorage.getItem('doukhub-mode');
        if (!saved) saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="rocket"></i>
                <span>DoukHub</span>
            </div>
            <div class="sidebar-nav">
                <a href="/status" title="状态" class="{% if page == 'status' %}active{% endif %}">
                    <i data-lucide="gauge"></i><span>状态</span>
                </a>

                <!-- 账号父级:点击进入状态页,箭头展开/收起子项 -->
                <div class="nav-group{% if page in ('sync_overview','sync_import','sync_resolve','sync_account','sync_refresh') %} expanded{% endif %}">
                    <a href="/sync/overview" title="账号" class="nav-group-toggle{% if page == 'sync_overview' %} active{% endif %}">
                        <i data-lucide="users"></i><span>账号</span>
                        <i data-lucide="chevron-right" class="nav-arrow" onclick="toggleNavGroup(event, this)" title="展开/收起"></i>
                    </a>
                    <div class="nav-submenu">
                        <a href="/sync/import" title="导入分享表" class="{% if page == 'sync_import' %}active{% endif %}">
                            <i data-lucide="download"></i><span>导入分享表</span>
                        </a>
                        <a href="/sync/resolve" title="解析分享表" class="{% if page == 'sync_resolve' %}active{% endif %}">
                            <i data-lucide="key-round"></i><span>解析分享表</span>
                        </a>
                        <a href="/sync/account" title="生成账号表" class="{% if page == 'sync_account' %}active{% endif %}">
                            <i data-lucide="users"></i><span>生成账号表</span>
                        </a>
                        <a href="/sync/refresh" title="更新账号表" class="{% if page == 'sync_refresh' %}active{% endif %}">
                            <i data-lucide="rotate-cw"></i><span>更新账号表</span>
                        </a>
                    </div>
                </div>

                <!-- 采集父级:手风琴式展开/收起子项 -->
                <div class="nav-group{% if page in ('collect_overview','collect_account','collect_detail','schedule') %} expanded{% endif %}">
                    <a href="/collect/overview" title="采集" class="nav-group-toggle{% if page == 'collect_overview' %} active{% endif %}">
                        <i data-lucide="download"></i><span>采集</span>
                        <i data-lucide="chevron-right" class="nav-arrow" onclick="toggleNavGroup(event, this)" title="展开/收起"></i>
                    </a>
                    <div class="nav-submenu">
                        <a href="/collect/detail" title="单作品采集" class="{% if page == 'collect_detail' %}active{% endif %}">
                            <i data-lucide="link"></i><span>单作品采集</span>
                        </a>
                        <a href="/collect" title="增量采集" class="{% if page == 'collect_account' %}active{% endif %}">
                            <i data-lucide="download"></i><span>增量采集</span>
                        </a>
                        <a href="/schedule" title="定时任务" class="{% if page == 'schedule' %}active{% endif %}">
                            <i data-lucide="calendar-clock"></i><span>定时任务</span>
                        </a>
                    </div>
                </div>

                <!-- 数据父级:手风琴式展开/收起子项 -->
                <div class="nav-group{% if page in ('database','table','sync_cloud','backup','dedup') %} expanded{% endif %}">
                    <a href="/database" title="数据" class="nav-group-toggle{% if page == 'database' %} active{% endif %}">
                        <i data-lucide="database"></i><span>数据</span>
                        <i data-lucide="chevron-right" class="nav-arrow" onclick="toggleNavGroup(event, this)" title="展开/收起"></i>
                    </a>
                    <div class="nav-submenu">
                        <a href="/table" title="表浏览" class="{% if page == 'table' %}active{% endif %}">
                            <i data-lucide="table-2"></i><span>表浏览</span>
                        </a>
                        <a href="/backup" title="数据备份" class="{% if page == 'backup' %}active{% endif %}">
                            <i data-lucide="database-backup"></i><span>数据备份</span>
                        </a>
                        <a href="/dedup" title="文件查重" class="{% if page == 'dedup' %}active{% endif %}">
                            <i data-lucide="file-search"></i><span>文件查重</span>
                        </a>
                    </div>
                </div>
                <a href="/settings" title="设置" class="{% if page == 'settings' %}active{% endif %}">
                    <i data-lucide="settings"></i><span>设置</span>
                </a>
            </div>
            <!-- 采集进度条：固定在侧边栏底部、按钮组上方；折叠态缩为图标，悬停向右伸出详情 -->
            <!-- 外层 .gpc-slot 是定位锚点：折叠态展开时 absolute 以此为基准，位置不跑偏 -->
            <!-- 注意：不加 title 属性 —— 原生 tooltip 会盖住悬停展开的内容 -->
            <div class="gpc-slot">
                <div id="global-collect-progress" class="global-progress-chip" style="display:none;" onclick="openTaskPanel()">
                    <!-- .gpc-main 是纵向堆叠容器：第一行（图标+百分比+项数）、第二行（任务名）。
                         为什么要第二行：侧栏内容区只有 ~136px，第一行剩下的 60px 放不下任务名
                         （「另 sync_v2 +1」需 75px）→ 与其截断成半截词，不如让它独占一行。 -->
                    <div class="gpc-main">
                        <div class="gpc-head">
                            <i data-lucide="activity" class="gpc-icon"></i>
                            <span id="global-collect-label" class="gpc-label">采集 0%</span>
                            <span id="global-collect-extra" class="gpc-extra" style="display:none;"></span>
                        </div>
                        <div id="global-collect-sub" class="gpc-sub" style="display:none;"></div>
                    </div>
                    <div class="gpc-bar"><div id="global-collect-bar"></div></div>
                </div>
            </div>
            <!-- 顺序：折叠态自上而下 = 展开态自左至右，两态一一对应。
                 这样过渡动画才是「原地扇开」，而不是图标互相交叉乱飞 -->
            <div class="sidebar-footer">
              <!-- 磁盘状态：常驻图标，剩余空间告急时转红 + 角标；点击查看详情 -->
              <button id="disk-badge" class="footer-btn footer-btn--disk" onclick="openDiskPanel()" title="磁盘空间">
                <i data-lucide="hard-drive"></i>
                <span id="disk-badge-dot" class="footer-badge" style="display:none;">!</span>
              </button>
              <button id="mode-toggle" class="footer-btn" onclick="toggleMode()" title="切换明/暗">
                <i data-lucide="moon"></i>
              </button>
              <button id="task-badge" class="footer-btn" onclick="openTaskPanel()" title="后台任务">
                <i data-lucide="list-checks"></i>
                <span id="task-badge-count" class="footer-badge">0</span>
              </button>
            </div>
            <button id="sidebar-collapse-btn" class="sidebar-collapse-edge" onclick="toggleSidebar()" title="折叠侧边栏">
                <i data-lucide="chevrons-left"></i>
            </button>
        </nav>
        <main class="main" id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- 移动端:汉堡按钮 + 抽屉遮罩(位于 main-content 之外,常驻不被局部刷新覆盖) -->
    <button class="hamburger-btn" id="sidebar-hamburger" type="button" aria-label="打开菜单" title="打开菜单">
        <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-mask" id="sidebar-mask"></div>

    <div id="toast" class="toast"></div>


<div id="migration-overlay" class="dh-modal-overlay" data-no-outside-close>
    <div class="dh-modal-box" style="max-width:440px;">
        <div class="dh-modal-header">
            <h3><i data-lucide="hard-drive"></i> <span id="migration-title">应用数据迁移</span></h3>
        </div>
        <div class="dh-modal-body">
            <p id="migration-message">准备中...</p>
            <div style="height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;margin:14px 0;">
                <div id="migration-bar" style="height:100%;width:0%;background:var(--accent);transition:width .4s;"></div>
            </div>
            <p id="migration-detail" style="font-size:12px;color:var(--text-muted);word-break:break-all;"></p>
        </div>
        <div class="dh-modal-actions">
            <button id="migration-close" class="dh-btn" style="display:none;" onclick="closeMigrationOverlay()">关闭</button>
            <button id="migration-restart" class="dh-btn dh-btn-danger" style="display:none;" onclick="restartAfterMigration()">
                立即重启
            </button>
        </div>
    </div>
</div>

    <!-- 通用确认弹窗(禁用浏览器原生 confirm/alert/prompt) -->
    <div id="dh-confirm-overlay" class="dh-modal-overlay">
        <div class="dh-modal-box">
            <div class="dh-modal-header">
                <h3><i data-lucide="help-circle"></i> <span id="dh-confirm-title">确认</span></h3>
                <button class="dh-modal-close" onclick="dhConfirmResolve(false)"><i data-lucide="x"></i></button>
            </div>
            <div id="dh-confirm-message" class="dh-modal-body"></div>
            <input id="dh-confirm-input" type="text" style="display:none;width:100%;box-sizing:border-box;margin-top:12px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-input);color:var(--text-primary);font-size:13px;">
            <div class="dh-modal-actions">
                <button class="dh-btn dh-btn-ghost" onclick="dhConfirmResolve(false)">取消</button>
                <button id="dh-confirm-ok" class="dh-btn dh-btn-danger" onclick="dhConfirmResolve(true)">确定</button>
            </div>
        </div>
    </div>

    <!-- 后台任务面板 -->
    <div id="task-panel-overlay" class="dh-modal-overlay">
        <div class="dh-modal-box" style="max-width:760px;">
            <div class="dh-modal-header">
                <h3><i data-lucide="list-checks"></i> <span>后台任务</span></h3>
                <button class="dh-modal-close" onclick="closeTaskPanel()"><i data-lucide="x"></i></button>
            </div>
            <div id="task-panel-body" class="dh-modal-body" style="max-height:72vh;overflow-y:auto;"><div class="task-tabs"><button class="task-tab active" data-tab="active" onclick="switchTaskTab('active')">进行中</button><button class="task-tab" data-tab="history" onclick="switchTaskTab('history')">历史</button><button class="task-tab" data-tab="failures" onclick="switchTaskTab('failures')" id="task-tab-failures">失败<span class="task-tab-dot" id="task-tab-failures-dot" style="display:none;"></span></button></div><div id="task-tab-content"></div></div>
            <div class="dh-modal-actions">
                <button class="dh-btn dh-btn-ghost" onclick="closeTaskPanel()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 磁盘空间面板：点击侧栏 footer 的磁盘图标打开 -->
    <div id="disk-panel-overlay" class="dh-modal-overlay">
        <div class="dh-modal-box" style="max-width:520px;">
            <div class="dh-modal-header">
                <h3><i data-lucide="hard-drive"></i> <span>磁盘空间</span></h3>
                <button class="dh-modal-close" onclick="closeDiskPanel()"><i data-lucide="x"></i></button>
            </div>
            <div id="disk-panel-body" class="dh-modal-body" style="max-height:60vh;overflow-y:auto;">
                <div class="empty-state"><div class="empty-state-title">正在读取…</div></div>
            </div>
            <div class="dh-modal-actions">
                <button class="dh-btn dh-btn-ghost" onclick="closeDiskPanel()">关闭</button>
            </div>
        </div>
    </div>

    <style>
    /* 通用确认弹窗(全局共享,使用通用 CSS 变量,4 主题通吃) */
    .dh-modal-overlay {
        display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        /* 层级要压在移动端抽屉之上（抽屉 30003 / 遮罩 30001），否则会被遮罩盖住：
           实测在抽屉里点「后台任务」，面板确实打开了，却开在遮罩底下 —— 又暗又点不动 */
        background: rgba(10, 11, 15, 0.7); z-index: 31000;
        align-items: center; justify-content: center;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .dh-modal-overlay.dh-show { display: flex !important; }
    /* 确认框永远压在其它浮层之上：它可能从任务面板 / 方案编辑弹窗里弹出来，
       而各 overlay 的 z-index 相同、DOM 顺序里它排在前面 → 默认会被后写的面板盖住。
       （实测：面板开着时弹确认框，点遮罩关掉的是面板，确认框根本没露面） */
    #dh-confirm-overlay { z-index: 40000; }
    .list-clip-bar { list-style:none; text-align:center; padding:10px 0; }
    .list-clip-bar .list-clip-btn { font-size:12px; }

    .dh-modal-box {
        background: var(--bg-muted);
        border-radius: var(--radius-xl);
        padding: 24px; width: 90%; max-width: 420px;
        border: 1px solid var(--border-default);
        box-shadow: var(--shadow-xl);
        animation: dh-modal-in 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* 方案设置弹窗:更宽的两栏布局（内联定义以确保覆盖 420px 默认宽） */
    .dh-modal-box-preset {
        max-width: 800px !important;
        width: min(92vw, 800px) !important;
        background: var(--surface-raised);
        display: flex; flex-direction: column;
        max-height: 88vh; padding: 20px;
    }
    @keyframes dh-modal-in {
        from { transform: translateY(12px) scale(0.96); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .dh-modal-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px; padding-bottom: 12px;
        border-bottom: 1px solid var(--border-default);
    }
    .dh-modal-header h3 {
        margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary);
        display: flex; align-items: center; gap: 8px;
    }
    .dh-modal-header h3 i { color: var(--accent); font-size: 18px; }
    .dh-modal-header h3 svg[data-lucide] { width: 18px; height: 18px; color: var(--accent); }
    .dh-modal-close {
        background: none; border: none; font-size: 16px; cursor: pointer;
        color: var(--text-muted); padding: 4px; border-radius: var(--radius-xs);
        width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    }
    .dh-modal-close svg[data-lucide] { width: 16px; height: 16px; }
    .dh-modal-close:hover { background: var(--danger-light); color: var(--danger-text); }
    .dh-modal-body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; word-break: break-all; }
    .task-tabs {
        display: flex; gap: 6px; margin-bottom: 12px;
        background: var(--bg-input);
        border-radius: var(--radius-sm); padding: 3px;
    }
    .task-tab {
        flex: 1; padding: 7px 0; border: none; border-radius: var(--radius-xs);
        background: transparent; color: var(--text-muted);
        font-size: 13px; font-weight: 500; cursor: pointer;
        transition: all var(--transition-fast);
    }
    .task-tab:hover { color: var(--text-primary); }
    .task-tab.active { background: var(--accent); color: var(--text-on-accent); }
    /* 「失败」标签上的未读小红点：有未读失败时显示，点开该标签即消失。
       用 danger 而非 warning —— 这里的圆点表达"有未处理事项"，是调用注意力的信号 */
    .task-tab { position: relative; }
    .task-tab-dot {
        position: absolute; top: 6px; right: 12px;
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--dh-danger);
    }
    /* 「失败」标签页内容 */
    .sched-failure-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 10px; font-size: 12px; color: var(--dh-text-secondary);
    }
    /* 「清空记录」是文字链接，本体只有 19px 高 → 用负 margin + padding 撑出 32px 热区，
       视觉位置不变但点得中（触控目标不足是移动端最常见的可用性缺陷） */
    .sched-failure-clear {
        color: var(--dh-text-secondary); cursor: pointer; text-decoration: underline;
        display: inline-flex; align-items: center;
        min-height: 32px; padding: 0 8px; margin: -6px -8px;
    }
    .sched-failure-clear:hover { color: var(--dh-accent); }
    .sched-failure {
        border: 1px solid var(--dh-border); border-radius: var(--radius-sm);
        padding: 10px; margin-bottom: 8px;
    }
    .sched-failure-head {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 8px; margin-bottom: 4px;
    }
    .sched-failure-name { font-size: 13px; font-weight: 600; color: var(--dh-text); }
    /* 时间戳：这是"任务什么时候挂的"这类功能信息，不是装饰文字，
       不能用 muted（浅色下 muted 只有 2.38:1，实测必挂）。secondary 浅 6.49 / 深 9.38 双过线 */
    .sched-failure-time { font-size: 12px; color: var(--dh-text-secondary); white-space: nowrap; }
    /* 错误详情用 danger 语义色。⚠️ 深浅两套主题各有 --dh-danger，
       浅色 #C2410C 自带足够对比度，深色 #FF8A7A 也亮于底 —— 与 style.css 的既有写法保持一致 */
    .sched-failure-detail {
        font-size: 12px; word-break: break-all;
        color: var(--dh-danger, var(--danger-text, #C2410C));
    }
    .dh-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .dh-btn {
        padding: 8px 18px; border: none; border-radius: var(--radius-sm);
        font-size: 13px; font-weight: 600; cursor: pointer;
        transition: all var(--transition-fast);
    }
    .dh-btn-ghost { background: var(--surface-overlay); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .dh-btn-ghost:hover { background: var(--menu-hover); }
    .dh-btn-primary { background: var(--accent); color: var(--text-on-accent); }
    .dh-btn-primary:hover { opacity: 0.85; }
    .dh-btn-danger { background: var(--danger); color: var(--text-on-accent); }
    .dh-btn-danger:hover { background: var(--danger-light); color: var(--danger-text); }
    .dh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== 侧边栏折叠 ===== */
    .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; transition: width 0.2s ease; }
    .sidebar.sb-collapsed { width: 64px !important; overflow: visible; z-index: 10; border-right: none; }
    /* 折叠态:隐藏文字,只留图标 */
    .sb-collapsed .sidebar-brand > span,
    .sb-collapsed .sidebar-nav a span { display: none; }
    /* 折叠态:品牌区竖排,logo 在上、折叠按钮在下(展开入口) */
    .sb-collapsed .sidebar-brand {
        flex-direction: column; gap: 10px;
        padding: 20px 0 14px;
        justify-content: center; align-items: center;
    }
    .sb-collapsed .sidebar-brand > i { font-size: 24px; }
    .sb-collapsed .sidebar-brand > svg[data-lucide] { width: 24px; height: 24px; }
    .sb-collapsed .sidebar-nav a { justify-content: center; padding: 0; gap: 0; }
    .sb-collapsed .sidebar-nav a::before { left: auto; right: 0; }
    .sb-collapsed .sidebar-collapse-btn {
        display: flex; margin-left: 0;
        width: 28px; height: 28px; font-size: 14px;
    }
    /* 侧栏顶栏保护:拖窄时文字收成省略号,折叠按钮不被挤压/遮挡 */
    .sidebar-brand { overflow: hidden; }
    .sidebar-brand > span { flex-shrink: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sidebar-brand .sidebar-collapse-btn { flex-shrink: 0; }
    .sidebar-collapse-btn {
        width: 32px; height: 32px; margin-left: auto; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: none; border-radius: var(--radius-sm);
        color: var(--text-muted); cursor: pointer; font-size: 16px;
        transition: all var(--transition-fast);
    }
    .sidebar-collapse-btn:hover { background: var(--bg-hover); color: var(--accent); }
    .sidebar-collapse-btn svg[data-lucide] { width: 16px; height: 16px; }
    .sb-collapsed .sidebar-collapse-btn svg[data-lucide] { width: 14px; height: 14px; }
    /* 折叠按钮:侧栏右边缘竖线 */
    .sidebar-collapse-edge {
        position: absolute;
        right: 0; top: 50%;
        transform: translateY(-50%);
        width: 15px; height: 60px;
        border: 1px solid var(--md-outline-variant);
        border-right: none;
        border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        background: var(--md-surface-container-low);
        color: var(--text-muted);
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        z-index: 50; padding: 0;
        transition: all var(--transition-fast);
    }
    .sidebar-collapse-edge:hover { color: var(--accent); background: var(--bg-hover); }
    .sidebar-collapse-edge svg[data-lucide] { width: 14px; height: 14px; }

    .sidebar-brand > svg[data-lucide] {
        width: 28px; height: 28px;
        color: var(--md-primary);
    }

    /* ===== 侧边栏导航项(统一四套主题:40px 扁平) ===== */
    .sidebar-nav a {
        display: flex; align-items: center; gap: 12px;
        padding: 0 16px; height: 40px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px; font-weight: 500;
        line-height: 1.25;
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
        position: relative;
        overflow: hidden;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .sidebar-nav a i {
        font-size: 20px; flex-shrink: 0;
        transition: transform var(--transition-fast), color var(--transition-fast);
    }
    .sidebar-nav a svg[data-lucide] { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar-nav a:hover i { transform: scale(1.1); color: var(--accent); }
    .sidebar-nav a:hover svg[data-lucide] { transform: scale(1.1); color: var(--accent); }
    .sidebar-nav a.active {
        background: var(--accent-active);
        color: var(--text-on-accent);
        font-weight: 600;
    }
    .sidebar-nav a.active i { color: var(--text-on-accent); }
    .sidebar-nav a.active svg[data-lucide] { color: var(--text-on-accent); }
    .sidebar-nav a.active::before {
        content: ""; position: absolute;
        left: 0; top: 50%; transform: translateY(-50%);
        width: 3px; height: 60%;
        background: var(--text-on-accent);
        border-radius: 0 3px 3px 0;
        box-shadow: var(--glow-primary);
    }

    /* ===== 嵌套子菜单(手风琴式) ===== */
    .nav-group .nav-group-toggle {
        display: flex; align-items: center; gap: 12px;
        padding: 0 16px; height: 40px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px; font-weight: 500;
        border-radius: var(--radius-sm);
        margin-bottom: 8px;
        position: relative;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .nav-group .nav-group-toggle i:first-child { font-size: 20px; flex-shrink: 0; }
    .nav-group .nav-group-toggle svg[data-lucide]:first-child { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-group .nav-arrow {
        margin-left: auto; font-size: 14px; transition: transform 0.2s ease;
        opacity: 0.6;
        width: 14px; height: 14px; padding: 5px; cursor: pointer;
    }
    .nav-group.expanded .nav-arrow { transform: rotate(90deg); }
    .nav-group .nav-group-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-group .nav-group-toggle.active {
        background: var(--accent-active); color: var(--text-on-accent); font-weight: 600;
    }
    .nav-group .nav-group-toggle.active i { color: var(--text-on-accent); }
    .nav-group .nav-group-toggle.active svg[data-lucide] { color: var(--text-on-accent); }
    .nav-group .nav-submenu {
        max-height: 0; overflow: hidden;
        transition: max-height 0.25s ease-out;
    }
    .nav-group.expanded .nav-submenu { max-height: 400px; }
    .nav-group .nav-submenu a {
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px 0 40px; height: 36px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 12px; font-weight: 500;
        border-radius: var(--radius-sm);
        margin-bottom: 1px;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .nav-group .nav-submenu a i { font-size: 16px; flex-shrink: 0; }
    .nav-group .nav-submenu a svg[data-lucide] { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-group .nav-submenu a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-group .nav-submenu a.active {
        background: var(--accent-active); color: var(--text-on-accent); font-weight: 600;
    }
    .nav-group .nav-submenu a.active i { color: var(--text-on-accent); }
    .nav-group .nav-submenu a.active svg[data-lucide] { color: var(--text-on-accent); }
    /* ===== 折叠态悬浮菜单（flyout 子菜单 + tooltip 统一视觉） ===== */
    .sb-collapsed .nav-group { position: relative; }
    .sb-collapsed .nav-submenu {
        display: none !important;
        position: absolute;
        left: 100%;
        top: 0;
        min-width: 176px;
        max-height: none !important;
        overflow: visible;
        background: var(--md-surface-container-high);
        border: 1px solid var(--md-outline-variant);
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.08);
        padding: 6px;
        z-index: 300;
        animation: sidebar-pop 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes sidebar-pop {
        from { opacity: 0; transform: translateX(-4px); }
        to { opacity: 1; transform: translateX(0); }
    }
    .sb-collapsed .nav-group:hover .nav-submenu { display: block !important; }
    .sb-collapsed .nav-submenu::before {
        content: '';
        position: absolute;
        left: -7px;
        top: 18px;
        border: 7px solid transparent;
        border-right-color: var(--md-outline-variant);
    }
    .sb-collapsed .nav-submenu::after {
        content: '';
        position: absolute;
        left: -5px;
        top: 19px;
        border: 5px solid transparent;
        border-right-color: var(--md-surface-container-high);
    }
    .sb-collapsed .nav-arrow { display: none; }
    .sb-collapsed .nav-group-toggle { justify-content: center; padding: 0; gap: 0; }
    .sb-collapsed .nav-submenu a {
        display: flex; align-items: center; gap: 10px;
        padding: 0 12px; height: 38px;
        justify-content: flex-start;
        border-radius: 8px;
        color: var(--text-secondary);
        font-size: 13px;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .sb-collapsed .nav-submenu a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sb-collapsed .nav-submenu a:hover svg[data-lucide] { color: var(--accent); }
    .sb-collapsed .nav-submenu a span { display: inline; }

    /* 无子菜单项 tooltip（与 flyout 统一视觉） */
    .sb-collapsed .sidebar-nav > a { overflow: visible; }
    .sb-collapsed .sidebar-nav > a::after {
        content: attr(title);
        position: absolute;
        left: calc(100% + 8px);
        top: 50%;
        transform: translateY(-50%) translateX(-4px);
        background: var(--md-surface-container-high);
        color: var(--text-primary);
        border: 1px solid var(--md-outline-variant);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.16);
        padding: 8px 14px;
        font-size: 13px; font-weight: 500;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease;
        z-index: 300;
    }
    .sb-collapsed .sidebar-nav > a:hover::after {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
    }
    /* ===== 侧边栏底部按钮（磁盘状态 + 明暗切换 + 后台任务） ===== */
    /* 展开态：磁盘与明暗靠左成组，后台任务推到最右 ——
       从主内容区回侧栏时后台按钮最近，比三个按钮均匀铺开更好点。
       （原用 order 让后台排最后，但 order 只改绘制顺序、改不了「成组 vs 分散」） */
    .sidebar-footer {
        display: flex; flex-direction: row; align-items: center; gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--md-outline-variant);
    }
    .sidebar-footer > #task-badge { margin-left: auto; }
    /* 折叠态是纵向排列：column 下 margin-left:auto 落在交叉轴上，会把按钮顶到右沿 → 重置 */
    .sb-collapsed .sidebar-footer > #task-badge { margin-left: 0; }
    .footer-btn {
        position: relative;
        display: flex; align-items: center; justify-content: center;
        width: 36px; height: 36px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-sm);
        background: var(--bg-input);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition-fast);
        box-sizing: border-box;
    }
    .footer-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover); }
    .footer-btn svg[data-lucide] { width: 16px; height: 16px; }
    .footer-btn i { font-size: 16px; }
    .footer-btn .footer-badge {
        position: absolute;
        top: -6px; right: -6px;
        background: var(--accent); color: var(--text-on-accent);
        font-size: 10px; font-weight: 700; min-width: 16px; height: 16px;
        border-radius: 8px; display: flex; align-items: center; justify-content: center;
        padding: 0 4px; line-height: 1;
    }
    /* 折叠态：四个控件（采集 / 后台 / 明暗 / 磁盘）纵向排一列，间距统一
       （采集图标与后台按钮点开的是同一个面板，不再强行贴成 0 间距） */
    .sb-collapsed .sidebar-footer {
        flex-direction: column; align-items: center;
        gap: 6px; padding: 6px 0 10px;
        border-top: none;
    }
    /* 折叠态隐藏分隔线：图标与按钮组已是一列，再加一条横线会把「同一组」割裂开 */
    .sb-collapsed .footer-btn .footer-badge {
        width: 8px; height: 8px; min-width: 8px;
        font-size: 0; padding: 0; border-radius: 4px;
        top: 0; right: 0;
    }

/* ===== 移动端抽屉导航(≤768px,与桌面折叠态互不污染) ===== */
    .hamburger-btn, .sidebar-mask { display: none; }
    @media (max-width: 768px) {
      /* 汉堡按钮:固定左上角,仅小屏显示,常驻不被局部刷新覆盖 */
      .hamburger-btn {
        display: flex; position: fixed; top: 12px; left: 12px; z-index: 30002;
        width: 44px; height: 44px; align-items: center; justify-content: center;
        background: var(--md-surface-container);
        border: 1px solid var(--md-outline-variant);
        border-radius: 12px; color: var(--md-on-surface);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .hamburger-btn svg[data-lucide] { width: 22px; height: 22px; }
      /* 遮罩 */
      .sidebar-mask {
        display: block; position: fixed; inset: 0; z-index: 30001;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      body.sidebar-open .sidebar-mask { opacity: 1; visibility: visible; }
      /* 侧边栏转为抽屉:固定定位,默认左移隐藏 */
      .sidebar {
        position: fixed !important; top: 0 !important; left: 0; bottom: 0;
        height: 100vh; width: var(--sidebar-w-mobile) !important;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 30003;
        box-shadow: none;
      }
      body.sidebar-open .sidebar { transform: translateX(0); box-shadow: var(--shadow-xl); }
      /* 抽屉模式下隐藏桌面端折叠按钮,避免状态污染 */
      .sidebar-collapse-edge { display: none !important; }
      /* 触控目标≥44px:导航项及子菜单 */
      .sidebar-nav a, .nav-group .nav-group-toggle { height: 48px; }
      .nav-group .nav-submenu a { height: 44px; padding-left: 44px; }
      .nav-arrow { width: 20px; height: 20px; padding: 10px; }
      .nav-arrow svg[data-lucide] { width: 18px; height: 18px; }
      /* 窄屏进度条高度见文件末尾的移动端补丁（须在主规则之后才生效） */
    }
    @media (min-width: 769px) {
      body.sidebar-open .sidebar { position: sticky; top: 0; transform: none; }
    }

    /* ===== 采集进度条：侧边栏底部固定区块（按钮组上方）===== */
    /* 展开态：撑满侧边栏宽度，与导航项左右对齐；折叠态：缩为图标 + 悬停向右伸出详情 */
    /* 定位锚点：折叠态悬停展开用 absolute，以此为包含块 → 始终贴在图标右侧同一高度 */
    .gpc-slot { position: relative; flex-shrink: 0; }
    .global-progress-chip {
        position: relative;
        display: none; align-items: center; gap: 8px;
        margin: 10px 12px 2px;
        /* 白卡 + 实描边：与侧栏内其它卡片同一语言。
           （原先是米色内陷面 + 透明边框，在暖白侧栏上几乎看不出边界，显得"糊"）
           底色统一走 --dh-surface，侧栏白底 → 卡片也是白的，靠描边 + 极淡投影分层 */
        background: var(--dh-surface);
        border: 1px solid var(--dh-border);
        border-radius: var(--dh-radius-sm);
        /* 左右 padding 与 .gpc-head 的 gap 都收紧 1~3px：
           实测内容区 136px，而「采集 67%｜另 sync_v2 +1」需要约 151px。
           这几像素是从内边距里省出来的，不必加宽卡片或改侧栏。 */
        padding: 0 8px;
        /* width 必须写成 calc 而不是 auto：auto ↔ 具体值不可插值，
           折叠时宽度会「啪」地跳变。calc/px 都是长度 → 能平滑过渡到 36px */
        width: calc(100% - 24px);
        height: 40px; box-sizing: border-box;
        font-size: 12.5px; font-weight: 600; color: var(--dh-text);
        cursor: pointer;
        user-select: none; -webkit-user-select: none;
        overflow: hidden;
        box-shadow: var(--dh-shadow-sm);
        /* 时长与 FLIP 的 240ms 对齐：栏宽、卡片尺寸、图标位移三者同时到位 */
        transition: background .15s, border-color .15s, box-shadow .15s,
                    width .24s cubic-bezier(.2,.9,.25,1),
                    height .24s cubic-bezier(.2,.9,.25,1),
                    margin .24s cubic-bezier(.2,.9,.25,1),
                    padding .24s cubic-bezier(.2,.9,.25,1),
                    gap .24s cubic-bezier(.2,.9,.25,1);
    }
    /* 尺寸变化中：内容快速淡出，避免文字被挤压变形 */
    .global-progress-chip.is-folding .gpc-head,
    .global-progress-chip.is-folding .gpc-sub,
    .global-progress-chip.is-folding .gpc-bar {
        opacity: 0;
        transition: opacity .1s linear;
    }
    /* 悬停：描边加深 + 抬起，暗示可点击 */
    .global-progress-chip:hover {
        background: var(--dh-surface);
        border-color: var(--dh-border-strong);
        box-shadow: var(--dh-shadow-lg);
    }
    /* 纵向堆叠容器：第一行（图标+百分比+项数）、第二行（同时进行的任务名）。
       flex:1 1 auto + min-width:0 —— 卡片是 flex 容器，不加这两条会被内容撑宽 */
    .global-progress-chip .gpc-main {
        flex: 1 1 auto; min-width: 0;
        display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    /* 头部行：图标 + 主标签 + 「另 N 项」 */
    .global-progress-chip .gpc-head {
        display: flex; align-items: center; gap: 6px;
        width: 100%; min-width: 0;
    }
    /* 第二行：其它正在跑的任务名。
       为什么单占一行：第一行剩余的 60px 放不下「sync_v2、文件查重」（需约 100px），
       硬挤只会截成半截词；独占一行后可用的宽度翻倍，仍放不下才走省略号 + title。
       色彩用 secondary 而非 muted —— 这是功能性信息（还有谁在跑），muted 对比度不达标 */
    .global-progress-chip .gpc-sub {
        font-size: 11px; font-weight: 500; line-height: 1.3;
        color: var(--dh-text-secondary);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        transition: opacity .16s linear;
    }
    /* 出现第二行时卡片长高（40 → 50）；折叠态/peek 由各自规则覆盖回 36 */
    .global-progress-chip.has-extras { height: 50px; }
    /* 图标：呼吸闪烁，状态由 is-paused 切换 */
    .global-progress-chip .gpc-icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--dh-accent); animation: gpc-pulse 1.6s ease-in-out infinite; }
    .global-progress-chip.is-paused .gpc-icon { color: var(--dh-warning); animation: none; }
    .global-progress-chip.is-paused .gpc-bar > div { background: var(--dh-warning); }
    @keyframes gpc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .38; } }
    /* 文字：主标签 + 「另 N 项」后缀 */
    .global-progress-chip .gpc-label { white-space: nowrap; letter-spacing: .2px; transition: opacity .16s linear; }
    /* 「另 N 项」是功能性信息（提示还有其他任务在跑），不是装饰文字 → 用 secondary 保证 ≥4.5:1。
       分隔线改用极淡的 --dh-border（原是 border-strong，在浅底上一条深灰竖线显得突兀）。
       窄侧栏里带任务名必然被截断 → 单行省略号，完整名称在原生 title 里（悬停可见） */
    .global-progress-chip .gpc-extra {
        white-space: nowrap; font-size: 11px; font-weight: 500;
        color: var(--dh-text-secondary); padding-left: 6px;
        margin-left: auto; transition: opacity .16s linear;
        border-left: 1px solid var(--dh-border);
        overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1;
    }
    /* 进度线：贴卡片下沿，左右各内缩圆角半径 ——
       贯通到底会把 chip 的左下/右下圆角填成方角（3× 截图实测），
       内缩后线与圆角各自完整，视觉更干净 */
    .global-progress-chip .gpc-bar {
        position: absolute; left: 6px; right: 6px; bottom: 0;
        height: 3px; background: transparent;
        overflow: hidden; pointer-events: none; transition: opacity .16s linear;
    }
    .global-progress-chip .gpc-bar > div {
        width: 0%; height: 100%; background: var(--dh-accent);
        transition: width .5s;
    }

    /* ===== 侧边栏折叠态：采集条缩为一个图标，悬停向右伸出详情 ===== */
    /* 折叠态图标与 footer 的三个按钮同形同色（白底 + 描边 + 6px 圆角），
       连上采集图标共四个控件，在 64px 侧栏里构成整齐一列 */
    .sb-collapsed .global-progress-chip {
        width: 36px; height: 36px; padding: 0; gap: 0; margin: 0;
        justify-content: center; border-radius: var(--radius-sm);
        background: var(--bg-input);
        border-color: var(--border-default);
        box-shadow: none;
    }
    /* ⚠️ .gpc-head 在主规则里是 width:100%（展开态要占满整行），
       折叠态不重置就会把图标顶到 36px 圆点的左沿 ——
       实测图标中心 cx=24，而下面三个按钮都是 32，肉眼就是"没对齐"（差 8px）。
       重置为自适应宽 + 居中，图标才与按钮同心。 */
    .sb-collapsed .global-progress-chip .gpc-head { width: auto; gap: 0; justify-content: center; }
    /* 折叠态悬停：与相邻 footer 按钮的 hover 反馈保持同一语言 */
    .sb-collapsed .global-progress-chip:hover {
        background: var(--bg-hover);
        border-color: var(--accent);
    }
    /* 折叠态小球：文字与进度线收起。
       必须用 display:none —— visibility 仍占布局空间，40px 宽的图标会被撑歪、无法居中。
       展开的顺滑感改由 chip 的 left/width 过渡 + 图标尺寸过渡提供，实测足够连贯。 */
    .sb-collapsed .global-progress-chip .gpc-label,
    .sb-collapsed .global-progress-chip .gpc-extra,
    .sb-collapsed .global-progress-chip .gpc-sub,
    .sb-collapsed .global-progress-chip .gpc-bar {
        display: none;
    }
    /* 折叠态压回 36×36：覆盖展开态的 height:50px（has-extras）。
       同一元素上两个类选择器特异性相同，靠"后写胜出"—— 这条必须在主规则之后 */
    .sb-collapsed .global-progress-chip.has-extras { height: 36px; }
    /* .gpc-main 在展开态是 flex:1 1 auto（撑满剩余宽），折叠态要收成自适应宽，
       否则 36px 圆点里它仍会占满、图标被推到左沿（与 .gpc-head 同理） */
    .sb-collapsed .global-progress-chip .gpc-main { flex: 0 0 auto; }
    /* 图标尺寸取 16px = .footer-btn 的图标尺寸，四个控件才是同一套视觉 */
    .sb-collapsed .global-progress-chip .gpc-icon {
        width: 16px; height: 16px; color: var(--text-secondary);
        animation: gpc-pulse 1.4s ease-in-out infinite;
        transition: width .3s cubic-bezier(.2,.9,.25,1), height .3s cubic-bezier(.2,.9,.25,1);

    .sb-collapsed .global-progress-chip:hover .gpc-icon { color: var(--accent); }
    /* ✅ 闪烁已从根上消除：peek 时 chip 的 left 保持 0（原地不动）、只向右展宽，

       视觉上就是「图标展开成详情」，而不是「图标飞走、另冒出一个胶囊」 */
    /* 关键：slot 在折叠态必须有固定占位高度 —— 否则 chip 转 absolute 后 slot 高度归零，

        position: absolute; left: 0; top: 0; right: auto;

           否则「另 N 项」有/无会让胶囊忽长忽短，悬停时宽度会跳。

        flex: 0 0 auto; box-sizing: border-box;

    .sb-collapsed .global-progress-chip.is-peek .gpc-bar { display: block; }
    /* peek 是"展开成完整卡片"，把折叠态为居中图标而收窄的两层（main / head）恢复成撑满 + 两端对齐：
       标签靠左、「另 N 项」用 margin-left:auto 靠右，视觉才不挤成一团 */
    .sb-collapsed .global-progress-chip.is-peek .gpc-main { flex: 1 1 auto; }
    .sb-collapsed .global-progress-chip.is-peek .gpc-head {

       保持 36px 高度与图标等高更整齐（第二行只在侧栏展开态出现） */
    /* 图标尺寸随展开一起过渡（16 → 14），避免展开瞬间图标"咯噔"一下 */
    .sb-collapsed .global-progress-chip.is-peek .gpc-icon { width: 14px; height: 14px; color: var(--dh-accent); }

    /* ===== 磁盘状态按钮 ===== */

    /* 窄屏（抽屉模式）补充：触控高度抬到 36px 底线。

    @media (max-width: 768px) {
      /* 必须用 min-height 而不是 height：height 会盖掉 .has-extras 的 50px
         （两者特异性相同、媒体查询在后），第二行任务名会被 overflow:hidden 裁掉。
         这里只要保证触控底线 36px，高度仍由内容语义决定（40 / 有第二行时 50）。 */

      /* 窄屏（135px 卡片）第一行放不下「另 N 项」，会被截成「另 2…」——

      .sidebar .global-progress-chip.has-extras .gpc-extra { display: none; }

    }

    <script>
        // ===== 通用确认弹窗(替代浏览器 confirm) =====
        // 用法: if (await confirmDialog('确定删除吗？')) { ... }
        // 返回 Promise<boolean>:确定 true,取消/关闭 false
        let _dhConfirmCb = null;
        function dhConfirmResolve(val) {
            document.getElementById('dh-confirm-overlay').classList.remove('dh-show');
            if (_dhConfirmCb) { _dhConfirmCb(val); _dhConfirmCb = null; }
        }
        function confirmDialog(message, opts = {}) {
            const title = opts.title || '确认';
            const confirmText = opts.confirmText || '确定';
            const danger = opts.danger !== false; // 默认红色"确定"按钮(删除类操作)
            const requireText = opts.requireText || ''; // 输入指定文字后才可点确定
            document.getElementById('dh-confirm-title').textContent = title;
            document.getElementById('dh-confirm-message').textContent = message;
            const okBtn = document.getElementById('dh-confirm-ok');
            okBtn.textContent = confirmText;
            okBtn.className = 'dh-btn ' + (danger ? 'dh-btn-danger' : 'dh-btn-primary');
            const inputEl = document.getElementById('dh-confirm-input');
            inputEl.style.display = requireText ? 'block' : 'none';
            inputEl.value = '';
            okBtn.disabled = !!requireText;
            inputEl.oninput = () => { okBtn.disabled = inputEl.value.trim() !== requireText; };
            document.getElementById('dh-confirm-overlay').classList.add('dh-show');
            (requireText ? inputEl : okBtn).focus();
            return new Promise(resolve => { _dhConfirmCb = resolve; });
        }
        // 确认框的 Esc / 点遮罩关闭交给下面的「通用浮层关闭」统一处理，
        // 这里不再单独监听 —— 否则一次 Esc 会先把确认框关掉、再顺手把它下面的面板也关掉
    </script>

    <script>
        // ===== 通用浮层关闭：点遮罩空白处 / 按 Esc = 等同于点右上角 ✕ =====
        // 不逐个弹窗写处理：框内有 ✕ 按钮就能关；表单类、进行中的阻塞弹窗加
        // data-no-outside-close 属性豁免（防止误触丢掉已填内容或打断进度）。
        // 为什么是"点 ✕ 按钮"而不是直接调关闭函数：关闭函数散落在各页 script 里、
        // 命名不统一，✕ 按钮才是唯一权威入口 —— 点它 = 走它。
        var _dhDownOn = null;
        function _dhCloseBtnOf(el) {
            if (!el || !el.classList) return null;
            if (!el.classList.contains('dh-modal-overlay') && !el.classList.contains('modal-overlay')) return null;
            if (getComputedStyle(el).display === 'none') return null;    // 没在展示
            if (el.hasAttribute('data-no-outside-close')) return null;   // 显式豁免
            return el.querySelector('.dh-modal-close, .modal-close');
        }
        // 取最上层浮层：各 overlay 的 z-index 相同，DOM 顺序不可靠
        //（确认框写在任务面板之前，却要盖在它上面）→ 用视口中心的命中测试判定
        function _dhTopOverlay() {
            var hits = document.elementsFromPoint(window.innerWidth / 2, window.innerHeight / 2) || [];
            for (var i = 0; i < hits.length; i++) {
                var ov = hits[i].closest && hits[i].closest('.dh-modal-overlay, .modal-overlay');
                if (ov) return ov;
            }
            var all = document.querySelectorAll('.dh-modal-overlay, .modal-overlay');
            for (var j = all.length - 1; j >= 0; j--) {
                if (getComputedStyle(all[j]).display !== 'none') return all[j];
            }
            return null;
        }
        document.addEventListener('mousedown', function (e) { _dhDownOn = e.target; }, true);
        document.addEventListener('click', function (e) {
            // 按下与松开都要落在遮罩本身上，否则"在框内拖选文字、松手到框外"会被误判成点遮罩
            var btn = (e.target === _dhDownOn) ? _dhCloseBtnOf(e.target) : null;
            if (btn) btn.click();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            var btn = _dhCloseBtnOf(_dhTopOverlay());
            if (btn) btn.click();
        });
    </script>

    <script>
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast-' + type;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        async function apiCall(url, method = 'GET', body = null) {
            const opts = { method };
            if (body) {
                if (body instanceof FormData) {
                    opts.body = body;
                } else {
                    opts.headers = { 'Content-Type': 'application/json' };
                    opts.body = JSON.stringify(body);
                }
            }
            const resp = await fetch(url, opts);
            return resp.json();
        }
        // ===== 长列表折叠：默认只显示前 limit 行，超过时追加「展开全部 / 收起」 =====
        function clipList(container, opts) {
            opts = opts || {};
            var limit = opts.limit || 20;
            var rows = [];
            for (var i = 0; i < container.children.length; i++) {
                var el = container.children[i];
                if (!el.classList || el.classList.contains('list-clip-bar')) continue;
                if (opts.rows && opts.rows.indexOf(el) < 0) continue;
                if (opts.rowSelector && !el.matches(opts.rowSelector)) continue;
                rows.push(el);
            }
            var total = rows.length;
            var state = { expanded: false };
            var handle = {
                total: total,
                isExpanded: function() { return state.expanded; },
                toggle: function() {
                    if (total <= limit) return state.expanded;
                    state.expanded = !state.expanded;
                    apply();
                    if (opts.onToggle) opts.onToggle(state.expanded);
                    return state.expanded;
                }
            };
            if (total <= limit) return handle;

            var bar = makeClipBar(container);
            function apply() {
                rows.forEach(function(row, idx) {
                    row.style.display = (state.expanded || idx < limit) ? '' : 'none';
                });
                var btn = bar.querySelector('.list-clip-btn');
                if (btn) btn.textContent = state.expanded ? '收起' : '展开全部（共 ' + total + ' 条）';
            }
            bar.querySelector('.list-clip-btn').addEventListener('click', function() {
                state.expanded = !state.expanded;
                apply();
                if (opts.onToggle) opts.onToggle(state.expanded);
            });
            apply();
            return handle;
        }

        function makeClipBar(container) {
            var inner = '<button type="button" class="btn btn-secondary btn-sm list-clip-btn"></button>';
            if (container.tagName === 'TBODY') {
                var firstRow = container.querySelector('tr');
                var cols = (firstRow && firstRow.cells) ? firstRow.cells.length : 4;
                var tr = document.createElement('tr');
                tr.className = 'list-clip-bar';
                tr.innerHTML = '<td colspan="' + cols + '" style="text-align:center;padding:10px 0;border:none;">' + inner + '</td>';
                container.appendChild(tr);
                return tr;
            }
            var item = document.createElement(container.tagName === 'UL' || container.tagName === 'OL' ? 'li' : 'div');
            item.className = 'list-clip-bar';
            item.innerHTML = inner;
            container.appendChild(item);
            return item;
        }

        // ===== 主题:仅 Material 单主题(多主题已废弃) =====
        // 明暗模式切换:独立于系统设置,存 localStorage
        function toggleMode() {
            var cur = document.documentElement.getAttribute('data-theme') || 'light';
            var next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('doukhub-mode', next);
            updateModeToggle(next);
        }
        function updateModeToggle(mode) {
            var btn = document.getElementById('mode-toggle');
            if (!btn) return;
            btn.innerHTML = '<i data-lucide="' + (mode === 'dark' ? 'sun' : 'moon') + '"></i>';
            if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
            btn.title = mode === 'dark' ? '切换到亮色模式' : '切换到暗色模式';
        }
        updateModeToggle(document.documentElement.getAttribute('data-theme') || 'light');

        // ===== 侧边栏折叠(仅一个折叠/展开按钮,桌面端) =====
        // 底部四个控件（采集 / 磁盘 / 明暗 / 后台）折叠态是纵向一列、展开态是横向一行。
        // flex-direction 不可插值 → 用 FLIP 补间位置：切换前后各量一次矩形，
        // 把元素瞬时挪回旧位置（Invert），下一帧释放为 0（Play），浏览器自然补间。
        // 全程只动 transform、不触发布局 → 与 .sidebar 自身的 width 过渡可以并行不打架。
        var _SB_MOTION_IDS = ['global-collect-progress', 'disk-badge', 'mode-toggle', 'task-badge'];
        var _SB_MOTION_MS = 240;
        var _SB_EASE = 'cubic-bezier(.2,.9,.25,1)';

        var _sbFlipTimer = null;
        function _sbFlip(apply) {
            var nodes = [];
            _SB_MOTION_IDS.forEach(function (id) {
                var el = document.getElementById(id);
                // getClientRects() 为空 = display:none（没有采集任务时的卡片）→ 跳过
                if (el && el.getClientRects().length) nodes.push(el);
            });
            if (!nodes.length) { apply(); return; }
            var first = nodes.map(function (el) { return el.getBoundingClientRect(); });
            apply();
            void document.body.offsetHeight;   // 强制同步布局，保证下面量到的是新位置
            var shifts = [];
            nodes.forEach(function (el, i) {
                var last = el.getBoundingClientRect();
                var dx = first[i].left - last.left;
                var dy = first[i].top - last.top;
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) shifts.push({ el: el, dx: dx, dy: dy });
            });
            if (!shifts.length) return;
            shifts.forEach(function (s) {
                s.el.style.transition = 'none';   // 先瞬时挪回旧位置，这一步绝不能带过渡
                s.el.style.transform = 'translate(' + s.dx + 'px,' + s.dy + 'px)';
            });
            requestAnimationFrame(function () {
                shifts.forEach(function (s) {
                    s.el.style.transition = 'transform ' + _SB_MOTION_MS + 'ms ' + _SB_EASE;
                    s.el.style.transform = 'translate(0,0)';
                });
            });
            // 结束后必须清掉内联样式：内联 transition 优先级高于样式表，
            // 留着会长期压住卡片自身的 hover / peek 过渡
            clearTimeout(_sbFlipTimer);
            _sbFlipTimer = setTimeout(function () {
                shifts.forEach(function (s) { s.el.style.transition = ''; s.el.style.transform = ''; });
            }, _SB_MOTION_MS + 60);
        }

        function toggleSidebar() {
            const sb = document.querySelector('.sidebar');
            // 卡片若正处于悬停展开（peek），先收掉 —— 否则 FLIP 量到的是 200px 的展开矩形
            const chip = document.getElementById('global-collect-progress');
            if (chip) chip.classList.remove('is-peek');
            var collapsed;
            _sbFlip(function () { collapsed = sb.classList.toggle('sb-collapsed'); });
            localStorage.setItem('doukhub-sidebar-collapsed', collapsed ? '1' : '0');
            updateCollapseBtn(collapsed);
            // 「另 N 项」文案随侧栏宽窄切换（窄=只报数量 / 宽=报任务名），
            // 不能等下一次轮询 —— 折叠后要有 2.5s 才更新，视觉上像漏了一拍。
            // ⚠️ 必须在 FLIP 之后调用：它会改卡片文案
            if (typeof updateGlobalCollectProgress === 'function' && _lastTasks) {
                updateGlobalCollectProgress(_lastTasks);
            }
        }
        function updateCollapseBtn(collapsed) {
            const btn = document.getElementById('sidebar-collapse-btn');
            if (!btn) return;
            btn.innerHTML = '<i data-lucide="' + (collapsed ? 'chevrons-right' : 'chevrons-left') + '"></i>';
            btn.title = collapsed ? '展开侧边栏' : '折叠侧边栏';
            if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
        }
        // 恢复上次折叠状态
        var _sbCollapsed = localStorage.getItem('doukhub-sidebar-collapsed') === '1';
        if (_sbCollapsed) document.querySelector('.sidebar').classList.add('sb-collapsed');
        updateCollapseBtn(_sbCollapsed);

        // ===== 移动端抽屉导航(≤768px;body.sidebar-open 独立于 sb-collapsed,互不污染) =====
        function setSidebarDrawer(open) {
            document.body.classList.toggle('sidebar-open', !!open);
        }
        function toggleSidebarDrawer() {
            setSidebarDrawer(!document.body.classList.contains('sidebar-open'));
        }
        // 桌面端(>768px)强制关闭抽屉,避免残留状态影响桌面布局
        const _mqMobile = window.matchMedia('(max-width: 768px)');
        function _syncSidebarDrawer() {
            if (!_mqMobile.matches) setSidebarDrawer(false);
        }
        if (_mqMobile.addEventListener) _mqMobile.addEventListener('change', _syncSidebarDrawer);
        else if (_mqMobile.addListener) _mqMobile.addListener(_syncSidebarDrawer); // 旧浏览器退路
        // 绑定汉堡与遮罩(常驻元素,仅绑定一次,不会被局部刷新冲掉)
        const _hamburgerBtn = document.getElementById('sidebar-hamburger');
        const _sidebarMask = document.getElementById('sidebar-mask');
        if (_hamburgerBtn) _hamburgerBtn.addEventListener('click', toggleSidebarDrawer);
        if (_sidebarMask) _sidebarMask.addEventListener('click', () => setSidebarDrawer(false));
        // ESC 关闭抽屉:与全站其它浮层(确认框/任务面板/目录选择器)保持一致。
        // 用捕获阶段:在其它浮层的冒泡处理器改动 DOM 之前先读状态,
        // 若此刻已有更上层浮层打开(.dh-show)就放行,让那层的 ESC 逻辑处理,抽屉保持不动。
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            if (!document.body.classList.contains('sidebar-open')) return;
            if (document.querySelector('.dh-show')) return;
            setSidebarDrawer(false);
        }, true);

        // ===== 嵌套子菜单:手风琴式展开/收起 =====
        function toggleNavGroup(e, el) {
            e.preventDefault();
            e.stopPropagation();
            var group = el.closest('.nav-group');
            if (group) group.classList.toggle('expanded');
        }

        async function restartSystem() {
            if (!await confirmDialog('服务将重启，正在进行的任务会中断。', { title: '重启确认', confirmText: '重启', danger: false })) return;
            showToast('正在重启...', 'info');
            await apiCall('/api/system/restart', 'POST');
            setTimeout(() => location.reload(), 3000);
        }
        async function exitSystem() {
            if (!await confirmDialog('退出后 DoukHub 将停止运行，可随时重新启动。', { title: '退出确认', confirmText: '退出', danger: false })) return;
            showToast('正在退出...', 'info');
            await apiCall('/api/system/exit', 'POST');
            setTimeout(() => {
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:16px;color:var(--text-muted);">DoukHub 已退出，可以关闭此窗口</div>';
            }, 1500);
        }

                // ===== SPA Router: 局部刷新,避免整页重载 =====
        // 思路:fetch 整页 → DOMParser 抽取 #main-content + #page-scripts → 局部替换 → 重执行脚本
        // 已加载的外部脚本(src)不会重复执行,避免库重复初始化导致事件监听器累积
        var _loadedScripts = new Set();
        var _spaLoadGen = 0; // 竞态保护:丢弃过期的 SPA 请求
        async function loadPage(url, pushState = true) {
            const gen = ++_spaLoadGen;
            try {
                // 导航前清理:在 DOM 被替换前销毁当前页面的资源(Grid实例、事件监听等)
                if (typeof window._spaCleanup === 'function') {
                    try { window._spaCleanup(); } catch(e) { console.warn('SPA cleanup failed', e); }
                    window._spaCleanup = null;
                }
                // 立即更新导航高亮,给用户即时反馈
                updateActiveNav(url);
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                if (gen !== _spaLoadGen) return; // 已被更新的请求取代
                const html = await resp.text();
                if (gen !== _spaLoadGen) return;
                const doc = new DOMParser().parseFromString(html, 'text/html');

                const newScripts = doc.getElementById('page-scripts');

                await rebindScripts(main);
                // 替换页面脚本块并重执行

                // 先更新 URL 再执行页面脚本,保证脚本内 location.search 读到的是目标地址
                if (pushState) history.pushState({ url }, '', url);
                if (newScripts && ps) {
                    ps.innerHTML = newScripts.innerHTML;
                    await rebindScripts(ps);
                }
                // 仅扫描新插入的 main-content 子树,不扫描整个 document
                if (window._doukhubRefreshIcons) window._doukhubRefreshIcons(main);
                if (window._doukhubRefreshTTDStatus) window._doukhubRefreshTTDStatus();

                window.scrollTo(0, 0);
            } catch (e) {
                if (gen !== _spaLoadGen) return; // 静默丢弃过期的错误

        // 外部脚本(src)仅首次加载,后续 SPA 切换跳过(全局对象已存在,无需重新执行)
        function isExecutableScript(script) {
            const type = (script.getAttribute('type') || '').trim().toLowerCase();
            return !type || [
                'application/ecmascript',
                'application/javascript',
                'module',
                'text/ecmascript',
                'text/javascript',
            ].includes(type);

        async function rebindScripts(container) {
            // 收集所有脚本后一次性处理,减少 DOM 重排次数
            const scripts = Array.from(container.querySelectorAll('script'))
                .filter(isExecutableScript);
            const inlineScripts = [];
            const externalScripts = [];
            for (const old of scripts) {
                if (old.src) externalScripts.push(old);
                else inlineScripts.push(old);
            }
            // 先处理外部脚本(需要 await 加载),确保内联脚本能引用其定义的函数
            for (const old of externalScripts) {
                if (old.dataset.reload === 'true') {
                    const s = document.createElement('script');
                    s.src = old.src;
                    old.replaceWith(s);
                    await new Promise(resolve => {
                        s.onload = resolve;
                        s.onerror = resolve;
                    });
                    continue;
                }
                if (_loadedScripts.has(old.src)) {
                    old.remove();
                    continue;
                }
                _loadedScripts.add(old.src);
                const s = document.createElement('script');
                await new Promise(resolve => {
                    s.onload = resolve;
                    s.onerror = resolve;
                    s.src = old.src;
                    old.replaceWith(s);
                });
            }
            // 再批量处理内联脚本:此时外部脚本已加载完成,内联脚本可以安全引用其中的函数
            for (const old of inlineScripts) {
                const s = document.createElement('script');
                s.textContent = old.textContent;
                old.replaceWith(s);
            }

        // ===== 采集进度条：侧边栏固定展示 + 折叠态悬停向右展开详情 =====

            const statusColor = statusColors[t.status] || 'var(--text-muted)';
            const statusLabel = TASK_STATUS_LABEL[t.status] || t.status;
            const typeLabel = TASK_TYPE_LABEL[t.type] || t.type;
            const logHtml = (t.log || []).slice(-5).map(function (l) {
                const cls = l.level === 'ok' ? 'log-ok' : (l.level === 'error' ? 'log-err' : 'log-info');
                return '<div class="' + cls + '">' + l.message + '</div>';
            }).join('');
            const canCancel = t.status === 'pending' || t.status === 'running' || t.status === 'paused';
            const cancelBtn = canCancel ? ' · <a onclick="cancelTask(\'' + t.task_id + '\')" style="color:var(--danger);cursor:pointer;text-decoration:underline;font-size:11px;">取消</a>' : '';
            const isBatch = t.type === 'collection_batch';
            let batchOps = '';
            if (isBatch) {
                if (t.status === 'running') batchOps = ' · <a onclick="pauseTask(\'' + t.task_id + '\')" style="color:var(--accent);cursor:pointer;text-decoration:underline;font-size:11px;">暂停</a>';
                else if (t.status === 'paused') batchOps = ' · <a onclick="resumeTask(\'' + t.task_id + '\')" style="color:var(--accent);cursor:pointer;text-decoration:underline;font-size:11px;">继续</a>';
            }
            return '<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                '<b style="font-size:13px;">' + typeLabel + '</b>' +
                '<span style="font-size:11px;font-weight:600;color:' + statusColor + ';">' + statusLabel + '</span>' + batchOps + cancelBtn +
                '</div>' +
                '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">总 ' + t.total + ' · 成功 ' + t.success + ' · 失败 ' + t.failed + (t.skipped ? ' · 跳过 ' + t.skipped : '') + '</div>' +
                '<div style="height:4px;background:var(--bg-hover);border-radius:2px;overflow:hidden;margin-bottom:6px;"><div style="width:' + pct + '%;height:100%;background:var(--accent);transition:width .3s;"></div></div>' +
                (logHtml ? '<div class="log-panel" style="max-height:80px;padding:6px 8px;font-size:11px;line-height:1.5;">' + logHtml + '</div>' : '') +
                '</div>';
        }
        function renderActiveTasks(tasks) {
            const body = document.getElementById('task-tab-content');
            if (!body) return;
            const active = tasks.filter(function (t) { return t.status === 'pending' || t.status === 'running' || t.status === 'cancelling'; });
            const html = active.length
                ? active.map(_taskCardHtml).join('')
                : '<div class="empty-state compact"><i data-lucide="inbox"></i><div class="es-title">暂无进行中的任务</div><div class="es-desc">采集任务开始后会在这里实时显示</div></div>';
            if (body.innerHTML !== html) { body.innerHTML = html; if (window._doukhubRefreshIcons) window._doukhubRefreshIcons(body); }
        }
        var _historyOffset = 0;
        var _historyList = [];
        var _historyHasMore = false;
        function renderHistoryTasks() {
            loadHistory(true);
        }
        async function loadHistory(reset) {
            const body = document.getElementById('task-tab-content');
            if (!body) return;
            if (reset) {
                _historyOffset = 0;
                _historyList = [];
                body.innerHTML = '<div class="empty-state compact"><i data-lucide="loader-circle"></i><div class="es-title">加载中...</div></div>';
            }
            try {
                const data = await apiCall('/api/tasks/history?limit=20&offset=' + _historyOffset, 'GET');
                const list = data.history || [];
                _historyList = _historyList.concat(list);
                _historyHasMore = !!data.has_more;
                _historyOffset += list.length;
                drawHistoryList(body);
            } catch (e) {
                body.innerHTML = '<div class="empty-state compact"><i data-lucide="triangle-alert"></i><div class="es-title">加载失败</div><div class="es-desc">' + (e && e.message ? e.message : '请稍后重试') + '</div></div>';
            }
        }
        function drawHistoryList(body) {
            if (!_historyList.length) {
                body.innerHTML = '<div class="empty-state compact"><i data-lucide="history"></i><div class="es-title">暂无历史记录</div><div class="es-desc">采集完成的任务会归档在这里</div></div>';
                return;
            }
            const statusColors = { pending: 'var(--dh-warning)', running: 'var(--dh-accent)', done: 'var(--dh-success)', failed: 'var(--dh-danger)', cancelled: 'var(--dh-text-muted)' };
            body.innerHTML = _historyList.map(function (h, idx) {
                const uid = idx;
                const statusColor = statusColors[h.status] || 'var(--text-muted)';
                const statusLabel = TASK_STATUS_LABEL[h.status] || h.status;
                const typeLabel = TASK_TYPE_LABEL[h.task_type] || h.task_type;
                const when = h.finished_at || h.created_at || '';
                let logHtml = '';
                try {
                    const logs = JSON.parse(h.log_json || '[]');
                    logHtml = logs.map(function (l) {
                        const cls = l.level === 'ok' ? 'log-ok' : (l.level === 'error' ? 'log-err' : 'log-info');
                        return '<div class="' + cls + '">' + l.message + '</div>';
                    }).join('');
                } catch (e) {}
                return '<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                    '<b style="font-size:13px;">' + typeLabel + '</b>' +
                    '<span style="font-size:11px;font-weight:600;color:' + statusColor + ';">' + statusLabel + '</span>' +
                    '</div>' +
                    '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">总 ' + (h.total || 0) + ' · 成功 ' + (h.success || 0) + ' · 失败 ' + (h.failed || 0) + (h.skipped ? ' · 跳过 ' + h.skipped : '') + (when ? ' · ' + when : '') + '</div>' +
                    (logHtml ? '<a onclick="toggleHistoryLog(' + uid + ', this)" style="font-size:11px;color:var(--accent);cursor:pointer;">展开日志</a>' +
                    '<div id="hist-log-' + uid + '" class="log-panel" style="display:none;margin-top:6px;max-height:200px;padding:6px 8px;font-size:11px;line-height:1.5;">' + logHtml + '</div>' : '') +
                    '</div>';
            }).join('') +
            (_historyHasMore ? '<div style="text-align:center;padding:8px;"><button class="btn btn-secondary btn-sm" onclick="loadHistory(false)">加载更多</button></div>' : '');
        }
        function toggleHistoryLog(uid, btn) {
            const box = document.getElementById('hist-log-' + uid);
            if (!box) return;
            const open = box.style.display !== 'none';
            box.style.display = open ? 'none' : 'block';
            btn.textContent = open ? '展开日志' : '收起日志';
        }
        async function cancelTask(taskId) {
            let resp;
            if (taskId.startsWith('batch_')) {
                resp = await apiCall('/api/collection/batches/' + batchId(taskId) + '/cancel', 'POST');
            } else {
                resp = await apiCall('/api/tasks/' + taskId + '/cancel', 'POST');
            }
            if (!resp || resp.success === false) showToast((resp && resp.message) || '取消失败', 'error');
            pollTasks();
        }
        function batchId(taskId) { return taskId.replace(/^batch_/, ''); }
        async function pauseTask(taskId) {
            const resp = await apiCall('/api/collection/batches/' + batchId(taskId) + '/pause', 'POST');
            if (!resp || resp.success === false) showToast((resp && resp.message) || '暂停失败', 'error');
            pollTasks();
        }
        async function resumeTask(taskId) {
            const resp = await apiCall('/api/collection/batches/' + batchId(taskId) + '/resume', 'POST');
            if (!resp || resp.success === false) showToast((resp && resp.message) || '继续失败', 'error');
            pollTasks();
        }

        async function refreshTTDStatus() {
            const badges = document.querySelectorAll('[data-ttd-status="true"]');
            if (!badges.length) return;
            try {
                const data = await apiCall('/api/services/status', 'GET');
                const ttd = (data.services || []).find(s => s.name === 'TikTokDownloader');
                const running = Boolean(ttd && ttd.running);
                badges.forEach(badge => {
                    badge.className = 'workflow-status ' + (running ? 'success' : 'failed');
                    badge.textContent = 'TTD 服务' + (running ? '运行中' : '未运行');
                });
            } catch (e) {
                badges.forEach(badge => {
                    badge.className = 'workflow-status failed';
                    badge.textContent = 'TTD 服务状态未知';
                });
            }
        }
        window._doukhubRefreshTTDStatus = refreshTTDStatus;
        document.addEventListener('DOMContentLoaded', refreshTTDStatus);

        // 启动轮询(2.5s 一次,本地接口开销极小)
        // 页面不可见时暂停轮询,减少与 SPA 切换的资源竞争
        if (!_taskPollTimer) {
            _taskPollTimer = setInterval(() => {
                if (document.hidden) return; // 标签页不可见时跳过
                pollTasks();
            }, 2500);
            pollTasks();
        }
        // 磁盘轮询独立计时：剩余空间变化很慢，2.5s 一次纯属浪费，改为 60s
        if (!window._diskPollTimer) {
            window._diskPollTimer = setInterval(() => {
                if (document.hidden) return;
                pollDisk();
            }, 60000);
            pollDisk();
        }
        // 定时任务失败轮询：与磁盘同频（60s）。失败是低频事件，且接口查的是 sync_history，
        // 没必要跟着 2.5s 的任务轮询一起刷。
        if (!window._scheduleFailurePollTimer) {
            window._scheduleFailurePollTimer = setInterval(() => {
                if (document.hidden) return;
                pollScheduleFailures();
            }, 60000);
            pollScheduleFailures();
        }
        // 页面恢复可见时立即轮询一次
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { pollTasks(); pollScheduleFailures(); }
        });
    </script>
    <div id="page-scripts" style="display:none">{% block scripts %}{% endblock %}</div>
    <script src="/static/js/account-works.js?v=2"></script>
    <script>
        // 注册首屏已加载的外部脚本,防止 SPA 首次切换时重复执行
        document.querySelectorAll('script[src]').forEach(function(s) {
            _loadedScripts.add(s.src);
        });
    </script>
    <script>
        function refreshIcons(container) {
            if (window.lucide?.createIcons) {
                // 如果指定了容器,仅扫描该子树;否则扫描整个 document
                if (container) window.lucide.createIcons({ root: container, nameAttr: 'data-lucide' });
                else window.lucide.createIcons();
            }
        }
        document.addEventListener('DOMContentLoaded', () => refreshIcons());
        window._doukhubRefreshIcons = refreshIcons;
    </script>
<script>
let migrationPoller = null;

function showMigrationOverlay(state) {
    const overlay = document.getElementById('migration-overlay');
    overlay.classList.add('dh-show');
    const title = document.getElementById('migration-title');
    const message = document.getElementById('migration-message');
    const bar = document.getElementById('migration-bar');
    const detail = document.getElementById('migration-detail');
    const restart = document.getElementById('migration-restart');
    const close = document.getElementById('migration-close');
    title.textContent = state.status === 'ready' ? '迁移完成'
        : (state.status === 'failed' ? '迁移失败' : '应用数据迁移中');
    message.textContent = state.status === 'ready'
        ? '数据已复制并通过校验。请立即重启 DoukHub。'
        : (state.current || '正在复制...');
    bar.style.width = `${state.progress || 0}%`;
    detail.textContent = state.error
        ? `失败：${state.error}`
        : `目标目录：${state.target || ''}`;
    restart.style.display = state.status === 'ready' ? 'inline-flex' : 'none';
    close.style.display = state.status === 'failed' ? 'inline-flex' : 'none';
}

function closeMigrationOverlay() {
    if (migrationPoller) { clearInterval(migrationPoller); migrationPoller = null; }
    document.getElementById('migration-overlay').classList.remove('dh-show');
}

async function refreshMigrationOverlay() {
    try {
        const response = await fetch('/api/data-migration/status');
        const state = await response.json();
        if (['preparing', 'copying', 'verifying', 'ready', 'failed'].includes(state.status)) {
            showMigrationOverlay(state);
            if ((state.status === 'ready' || state.status === 'failed') && migrationPoller) {
                clearInterval(migrationPoller);
                migrationPoller = null;
            }
        } else {
            document.getElementById('migration-overlay').classList.remove('dh-show');
        }
    } catch (error) {
        if (migrationPoller) {
            clearInterval(migrationPoller);
            migrationPoller = null;
        }
    }
}

async function restartAfterMigration() {
    const button = document.getElementById('migration-restart');
    button.disabled = true;
    button.textContent = '正在重启...';
    await fetch('/api/system/restart', { method: 'POST' });
}

refreshMigrationOverlay();
migrationPoller = setInterval(refreshMigrationOverlay, 1000);
</script>

</body>
</html>
