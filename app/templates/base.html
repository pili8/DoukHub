<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}DoukHub{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#0061A4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1A1C1E" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DoukHub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/static/js/lucide.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <link id="theme-css" rel="stylesheet" href="/static/css/style.css?v=47">
    <script>
      // 明暗模式:localStorage 优先,否则跟随系统,首屏设定避免闪烁
      (function() {
        var saved = localStorage.getItem('doukhub-mode');
        if (!saved) saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="rocket"></i>
                <span>DoukHub</span>
                <button id="sidebar-collapse-btn" onclick="toggleSidebar()" title="折叠/展开侧边栏" class="sidebar-collapse-btn">
                    <i data-lucide="panel-left-close"></i>
                </button>
            </div>
            <div class="sidebar-nav">
                <a href="/status" title="状态" class="{% if page == 'status' %}active{% endif %}">
                    <i data-lucide="gauge"></i><span>状态</span>
                </a>

                <!-- 账号父级:点击进入状态页,箭头展开/收起子项 -->
                <div class="nav-group{% if page in ('sync_overview','sync_import','sync_resolve','sync_account','sync_refresh') %} expanded{% endif %}">
                    <a href="/sync/overview" title="账号" class="nav-group-toggle{% if page == 'sync_overview' %} active{% endif %}">
                        <i data-lucide="users"></i><span>账号</span>
                        <i data-lucide="chevron-right" class="nav-arrow" onclick="toggleNavGroup(event, this)" title="展开/收起"></i>
                    </a>
                    <div class="nav-submenu">
                        <a href="/sync/import" title="导入分享表" class="{% if page == 'sync_import' %}active{% endif %}">
                            <i data-lucide="download"></i><span>导入分享表</span>
                        </a>
                        <a href="/sync/resolve" title="解析分享表" class="{% if page == 'sync_resolve' %}active{% endif %}">
                            <i data-lucide="key-round"></i><span>解析分享表</span>
                        </a>
                        <a href="/sync/account" title="生成账号表" class="{% if page == 'sync_account' %}active{% endif %}">
                            <i data-lucide="users"></i><span>生成账号表</span>
                        </a>
                        <a href="/sync/refresh" title="更新账号表" class="{% if page == 'sync_refresh' %}active{% endif %}">
                            <i data-lucide="rotate-cw"></i><span>更新账号表</span>
                        </a>
                    </div>
                </div>

                <!-- 采集父级:手风琴式展开/收起子项 -->
                <div class="nav-group{% if page in ('collect_overview','collect_account','collect_detail') %} expanded{% endif %}">
                    <a href="/collect/overview" title="采集" class="nav-group-toggle{% if page == 'collect_overview' %} active{% endif %}">
                        <i data-lucide="download"></i><span>采集</span>
                        <i data-lucide="chevron-right" class="nav-arrow" onclick="toggleNavGroup(event, this)" title="展开/收起"></i>
                    </a>
                    <div class="nav-submenu">
                        <a href="/collect/detail" title="单作品采集" class="{% if page == 'collect_detail' %}active{% endif %}">
                            <i data-lucide="link"></i><span>单作品采集</span>
                        </a>
                        <a href="/collect" title="日常增量采集" class="{% if page == 'collect_account' %}active{% endif %}">
                            <i data-lucide="download"></i><span>日常增量采集</span>
                        </a>
                    </div>
                </div>

                <!-- 数据父级:手风琴式展开/收起子项 -->
                <div class="nav-group{% if page in ('database','table','sync_cloud') %} expanded{% endif %}">
                    <a href="/database" title="数据" class="nav-group-toggle{% if page == 'database' %} active{% endif %}">
                        <i data-lucide="database"></i><span>数据</span>
                        <i data-lucide="chevron-right" class="nav-arrow" onclick="toggleNavGroup(event, this)" title="展开/收起"></i>
                    </a>
                    <div class="nav-submenu">
                        <a href="/table" title="表浏览" class="{% if page == 'table' %}active{% endif %}">
                            <i data-lucide="table-2"></i><span>表浏览</span>
                        </a>
                    </div>
                </div>
                <a href="/settings" title="设置" class="{% if page == 'settings' %}active{% endif %}">
                    <i data-lucide="settings"></i><span>设置</span>
                </a>
            </div>
            <div class="sidebar-footer">
            <div class="sidebar-footer">
              <div style="display:flex;gap:6px;">
                <button id="mode-toggle" onclick="toggleMode()" title="切换明/暗" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;font-size:16px;transition:all var(--transition-fast);">
                    <i data-lucide="moon"></i>
                </button>
                <button id="task-badge" onclick="openTaskPanel()" title="后台任务" style="width:32px;height:32px;display:none;align-items:center;justify-content:center;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;font-size:16px;transition:all var(--transition-fast);position:relative;">
                    <i data-lucide="list-checks"></i>
                    <span id="task-badge-count" style="position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--text-on-accent,#fff);font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;"></span>
                </button>
              </div>
            </div>
        </nav>
        <main class="main" id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- 移动端:汉堡按钮 + 抽屉遮罩(位于 main-content 之外,常驻不被局部刷新覆盖) -->
    <button class="hamburger-btn" id="sidebar-hamburger" type="button" aria-label="打开菜单" title="打开菜单">
        <i data-lucide="menu"></i>
    </button>
    <div class="sidebar-mask" id="sidebar-mask"></div>

    <div id="toast" class="toast"></div>

    <!-- 通用确认弹窗(禁用浏览器原生 confirm/alert/prompt) -->
    <div id="dh-confirm-overlay" class="dh-modal-overlay">
        <div class="dh-modal-box">
            <div class="dh-modal-header">
                <h3><i data-lucide="help-circle"></i> <span id="dh-confirm-title">确认</span></h3>
                <button class="dh-modal-close" onclick="dhConfirmResolve(false)"><i data-lucide="x"></i></button>
            </div>
            <div id="dh-confirm-message" class="dh-modal-body"></div>
            <input id="dh-confirm-input" type="text" style="display:none;width:100%;box-sizing:border-box;margin-top:12px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-input);color:var(--text-primary);font-size:13px;">
            <div class="dh-modal-actions">
                <button class="dh-btn dh-btn-ghost" onclick="dhConfirmResolve(false)">取消</button>
                <button id="dh-confirm-ok" class="dh-btn dh-btn-danger" onclick="dhConfirmResolve(true)">确定</button>
            </div>
        </div>
    </div>

    <!-- 后台任务面板 -->
    <div id="task-panel-overlay" class="dh-modal-overlay">
        <div class="dh-modal-box" style="max-width:760px;">
            <div class="dh-modal-header">
                <h3><i data-lucide="list-checks"></i> <span>后台任务</span></h3>
                <button class="dh-modal-close" onclick="closeTaskPanel()"><i data-lucide="x"></i></button>
            </div>
            <div id="task-panel-body" class="dh-modal-body" style="max-height:72vh;overflow-y:auto;"></div>
            <div class="dh-modal-actions">
                <button class="dh-btn dh-btn-ghost" onclick="closeTaskPanel()">关闭</button>
            </div>
        </div>
    </div>

    <style>
    /* 通用确认弹窗(全局共享,使用通用 CSS 变量,4 主题通吃) */
    .dh-modal-overlay {
        display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(10, 11, 15, 0.7); z-index: 20000;
        align-items: center; justify-content: center;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .dh-modal-overlay.dh-show { display: flex !important; }
    .dh-modal-box {
        background: var(--bg-muted);
        border-radius: var(--radius-xl);
        padding: 24px; width: 90%; max-width: 420px;
        border: 1px solid var(--border-default);
        box-shadow: var(--shadow-xl);
        animation: dh-modal-in 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes dh-modal-in {
        from { transform: translateY(12px) scale(0.96); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .dh-modal-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px; padding-bottom: 12px;
        border-bottom: 1px solid var(--border-default);
    }
    .dh-modal-header h3 {
        margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary);
        display: flex; align-items: center; gap: 8px;
    }
    .dh-modal-header h3 i { color: var(--accent); font-size: 18px; }
    .dh-modal-header h3 svg[data-lucide] { width: 18px; height: 18px; color: var(--accent); }
    .dh-modal-close {
        background: none; border: none; font-size: 16px; cursor: pointer;
        color: var(--text-muted); padding: 4px; border-radius: var(--radius-xs);
        width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    }
    .dh-modal-close svg[data-lucide] { width: 16px; height: 16px; }
    .dh-modal-close:hover { background: var(--danger-light); color: var(--danger-text); }
    .dh-modal-body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; word-break: break-all; }
    .dh-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .dh-btn {
        padding: 8px 18px; border: none; border-radius: var(--radius-sm);
        font-size: 13px; font-weight: 600; cursor: pointer;
        transition: all var(--transition-fast);
    }
    .dh-btn-ghost { background: var(--surface-overlay); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .dh-btn-ghost:hover { background: var(--menu-hover); }
    .dh-btn-primary { background: var(--accent); color: var(--text-on-accent); }
    .dh-btn-primary:hover { opacity: 0.85; }
    .dh-btn-danger { background: var(--danger); color: var(--text-on-accent); }
    .dh-btn-danger:hover { background: var(--danger-light); color: var(--danger-text); }
    .dh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== 侧边栏折叠 ===== */
    .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; transition: width 0.2s ease; }
    .sidebar.sb-collapsed { width: 64px !important; }
    /* 折叠态:隐藏文字,只留图标 */
    .sb-collapsed .sidebar-brand > span,
    .sb-collapsed .sidebar-nav a span { display: none; }
    /* 折叠态:品牌区竖排,logo 在上、折叠按钮在下(展开入口) */
    .sb-collapsed .sidebar-brand {
        flex-direction: column; gap: 10px;
        padding: 20px 0 14px;
        justify-content: center; align-items: center;
    }
    .sb-collapsed .sidebar-brand > i { font-size: 24px; }
    .sb-collapsed .sidebar-brand > svg[data-lucide] { width: 24px; height: 24px; }
    .sb-collapsed .sidebar-nav a { justify-content: center; padding: 0; gap: 0; }
    .sb-collapsed .sidebar-footer { padding: 8px 0; border-top: none; }
    .sb-collapsed .sidebar-nav a::before { left: auto; right: 0; }
    .sb-collapsed .sidebar-collapse-btn {
        display: flex; margin-left: 0;
        width: 28px; height: 28px; font-size: 14px;
    }
    /* 侧栏顶栏保护:拖窄时文字收成省略号,折叠按钮不被挤压/遮挡 */
    .sidebar-brand { overflow: hidden; }
    .sidebar-brand > span { flex-shrink: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .sidebar-brand .sidebar-collapse-btn { flex-shrink: 0; }
    .sidebar-collapse-btn {
        width: 32px; height: 32px; margin-left: auto; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: none; border-radius: var(--radius-sm);
        color: var(--text-muted); cursor: pointer; font-size: 16px;
        transition: all var(--transition-fast);
    }
    .sidebar-collapse-btn:hover { background: var(--bg-hover); color: var(--accent); }
    .sidebar-collapse-btn svg[data-lucide] { width: 16px; height: 16px; }
    .sb-collapsed .sidebar-collapse-btn svg[data-lucide] { width: 14px; height: 14px; }

    .sidebar-brand > svg[data-lucide] {
        width: 28px; height: 28px;
        color: var(--md-primary, var(--accent));
    }

    /* ===== 侧边栏导航项(统一四套主题:40px 扁平) ===== */
    .sidebar-nav a {
        display: flex; align-items: center; gap: 12px;
        padding: 0 16px; height: 40px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px; font-weight: 500;
        line-height: 1.25;
        border-radius: var(--radius-sm);
        margin-bottom: 2px;
        position: relative;
        overflow: hidden;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .sidebar-nav a i {
        font-size: 20px; flex-shrink: 0;
        transition: transform var(--transition-fast), color var(--transition-fast);
    }
    .sidebar-nav a svg[data-lucide] { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sidebar-nav a:hover i { transform: scale(1.1); color: var(--accent); }
    .sidebar-nav a:hover svg[data-lucide] { transform: scale(1.1); color: var(--accent); }
    .sidebar-nav a.active {
        background: var(--accent-active);
        color: var(--text-on-accent, #fff);
        font-weight: 600;
    }
    .sidebar-nav a.active i { color: var(--text-on-accent, #fff); }
    .sidebar-nav a.active svg[data-lucide] { color: var(--text-on-accent, #fff); }
    .sidebar-nav a.active::before {
        content: ""; position: absolute;
        left: 0; top: 50%; transform: translateY(-50%);
        width: 3px; height: 60%;
        background: var(--text-on-accent, #fff);
        border-radius: 0 3px 3px 0;
        box-shadow: var(--glow-primary, none);
    }

    /* ===== 嵌套子菜单(手风琴式) ===== */
    .nav-group .nav-group-toggle {
        display: flex; align-items: center; gap: 12px;
        padding: 0 16px; height: 40px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 13px; font-weight: 500;
        border-radius: var(--radius-sm);
        margin-bottom: 2px;
        position: relative;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .nav-group .nav-group-toggle i:first-child { font-size: 20px; flex-shrink: 0; }
    .nav-group .nav-group-toggle svg[data-lucide]:first-child { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-group .nav-arrow {
        margin-left: auto; font-size: 14px; transition: transform 0.2s ease;
        opacity: 0.6;
        width: 14px; height: 14px; padding: 5px; cursor: pointer;
    }
    .nav-group.expanded .nav-arrow { transform: rotate(90deg); }
    .nav-group .nav-group-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-group .nav-group-toggle.active {
        background: var(--accent-active); color: var(--text-on-accent, #fff); font-weight: 600;
    }
    .nav-group .nav-group-toggle.active i { color: var(--text-on-accent, #fff); }
    .nav-group .nav-group-toggle.active svg[data-lucide] { color: var(--text-on-accent, #fff); }
    .nav-group .nav-submenu {
        max-height: 0; overflow: hidden;
        transition: max-height 0.25s ease-out;
    }
    .nav-group.expanded .nav-submenu { max-height: 320px; }
    .nav-group .nav-submenu a {
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px 0 40px; height: 36px;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 12px; font-weight: 500;
        border-radius: var(--radius-sm);
        margin-bottom: 1px;
        transition: background var(--transition-fast), color var(--transition-fast);
    }
    .nav-group .nav-submenu a i { font-size: 16px; flex-shrink: 0; }
    .nav-group .nav-submenu a svg[data-lucide] { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-group .nav-submenu a:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-group .nav-submenu a.active {
        background: var(--accent-active); color: var(--text-on-accent, #fff); font-weight: 600;
    }
    .nav-group .nav-submenu a.active i { color: var(--text-on-accent, #fff); }
    .nav-group .nav-submenu a.active svg[data-lucide] { color: var(--text-on-accent, #fff); }
    /* 折叠态:隐藏子菜单,箭头隐藏 */
    .sb-collapsed .nav-submenu { display: none !important; }
    .sb-collapsed .nav-arrow { display: none; }
    .sb-collapsed .nav-group-toggle { justify-content: center; padding: 0; gap: 0; }
    #mode-toggle svg[data-lucide],
    #task-badge svg[data-lucide] { width: 16px; height: 16px; }

/* ===== 移动端抽屉导航(≤768px,与桌面折叠态互不污染) ===== */
    .hamburger-btn, .sidebar-mask { display: none; }
    @media (max-width: 768px) {
      /* 汉堡按钮:固定左上角,仅小屏显示,常驻不被局部刷新覆盖 */
      .hamburger-btn {
        display: flex; position: fixed; top: 12px; left: 12px; z-index: 30002;
        width: 44px; height: 44px; align-items: center; justify-content: center;
        background: var(--md-surface-container, var(--bg-muted));
        border: 1px solid var(--md-outline-variant, var(--border-default));
        border-radius: 12px; color: var(--md-on-surface, var(--text-primary));
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .hamburger-btn svg[data-lucide] { width: 22px; height: 22px; }
      /* 遮罩 */
      .sidebar-mask {
        display: block; position: fixed; inset: 0; z-index: 30001;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      body.sidebar-open .sidebar-mask { opacity: 1; visibility: visible; }
      /* 侧边栏转为抽屉:固定定位,默认左移隐藏 */
      .sidebar {
        position: fixed !important; top: 0 !important; left: 0; bottom: 0;
        height: 100vh; width: var(--sidebar-w-mobile) !important;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 30003;
        box-shadow: none;
      }
      body.sidebar-open .sidebar { transform: translateX(0); box-shadow: var(--shadow-xl, 0 8px 30px rgba(0,0,0,0.3)); }
      /* 抽屉模式下隐藏桌面端折叠按钮,避免状态污染 */
      .sidebar-collapse-btn { display: none !important; }
      /* 触控目标≥44px:导航项及子菜单 */
      .sidebar-nav a, .nav-group .nav-group-toggle { height: 48px; }
      .nav-group .nav-submenu a { height: 44px; padding-left: 44px; }
      .nav-arrow { width: 20px; height: 20px; padding: 10px; }
      .nav-arrow svg[data-lucide] { width: 18px; height: 18px; }
    }
    @media (min-width: 769px) {
      body.sidebar-open .sidebar { position: sticky; top: 0; transform: none; }
    }
    </style>

    <script>
        // ===== 通用确认弹窗(替代浏览器 confirm) =====
        // 用法: if (await confirmDialog('确定删除吗？')) { ... }
        // 返回 Promise<boolean>:确定 true,取消/关闭 false
        let _dhConfirmCb = null;
        function dhConfirmResolve(val) {
            document.getElementById('dh-confirm-overlay').classList.remove('dh-show');
            if (_dhConfirmCb) { _dhConfirmCb(val); _dhConfirmCb = null; }
        }
        function confirmDialog(message, opts = {}) {
            const title = opts.title || '确认';
            const confirmText = opts.confirmText || '确定';
            const danger = opts.danger !== false; // 默认红色"确定"按钮(删除类操作)
            const requireText = opts.requireText || ''; // 输入指定文字后才可点确定
            document.getElementById('dh-confirm-title').textContent = title;
            document.getElementById('dh-confirm-message').textContent = message;
            const okBtn = document.getElementById('dh-confirm-ok');
            okBtn.textContent = confirmText;
            okBtn.className = 'dh-btn ' + (danger ? 'dh-btn-danger' : 'dh-btn-primary');
            const inputEl = document.getElementById('dh-confirm-input');
            inputEl.style.display = requireText ? 'block' : 'none';
            inputEl.value = '';
            okBtn.disabled = !!requireText;
            inputEl.oninput = () => { okBtn.disabled = inputEl.value.trim() !== requireText; };
            document.getElementById('dh-confirm-overlay').classList.add('dh-show');
            (requireText ? inputEl : okBtn).focus();
            return new Promise(resolve => { _dhConfirmCb = resolve; });
        }
        // Esc 关闭
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('dh-confirm-overlay').classList.contains('dh-show')) {
                dhConfirmResolve(false);
            }
        });
    </script>

    <script>
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast-' + type;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        async function apiCall(url, method = 'GET', body = null) {
            const opts = { method };
            if (body) {
                if (body instanceof FormData) {
                    opts.body = body;
                } else {
                    opts.headers = { 'Content-Type': 'application/json' };
                    opts.body = JSON.stringify(body);
                }
            }
            const resp = await fetch(url, opts);
            return resp.json();
        }
        // ===== 主题:仅 Material 单主题(多主题已废弃) =====
        // 明暗模式切换:独立于系统设置,存 localStorage
        function toggleMode() {
            var cur = document.documentElement.getAttribute('data-theme') || 'light';
            var next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('doukhub-mode', next);
            updateModeToggle(next);
        }
        function updateModeToggle(mode) {
            var btn = document.getElementById('mode-toggle');
            if (!btn) return;
            btn.innerHTML = '<i data-lucide="' + (mode === 'dark' ? 'sun' : 'moon') + '"></i>';
            if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
            btn.title = mode === 'dark' ? '当前暗色 — 点击切到亮色' : '当前亮色 — 点击切到暗色';
        }
        updateModeToggle(document.documentElement.getAttribute('data-theme') || 'light');

        // ===== 侧边栏折叠(仅一个折叠/展开按钮,桌面端) =====
        function toggleSidebar() {
            const sb = document.querySelector('.sidebar');
            const collapsed = sb.classList.toggle('sb-collapsed');
            localStorage.setItem('doukhub-sidebar-collapsed', collapsed ? '1' : '0');
        }
        // 恢复上次折叠状态
        if (localStorage.getItem('doukhub-sidebar-collapsed') === '1') {
            document.querySelector('.sidebar').classList.add('sb-collapsed');
        }

        // ===== 移动端抽屉导航(≤768px;body.sidebar-open 独立于 sb-collapsed,互不污染) =====
        function setSidebarDrawer(open) {
            document.body.classList.toggle('sidebar-open', !!open);
        }
        function toggleSidebarDrawer() {
            setSidebarDrawer(!document.body.classList.contains('sidebar-open'));
        }
        // 桌面端(>768px)强制关闭抽屉,避免残留状态影响桌面布局
        const _mqMobile = window.matchMedia('(max-width: 768px)');
        function _syncSidebarDrawer() {
            if (!_mqMobile.matches) setSidebarDrawer(false);
        }
        if (_mqMobile.addEventListener) _mqMobile.addEventListener('change', _syncSidebarDrawer);
        else if (_mqMobile.addListener) _mqMobile.addListener(_syncSidebarDrawer); // 旧浏览器退路
        // 绑定汉堡与遮罩(常驻元素,仅绑定一次,不会被局部刷新冲掉)
        const _hamburgerBtn = document.getElementById('sidebar-hamburger');
        const _sidebarMask = document.getElementById('sidebar-mask');
        if (_hamburgerBtn) _hamburgerBtn.addEventListener('click', toggleSidebarDrawer);
        if (_sidebarMask) _sidebarMask.addEventListener('click', () => setSidebarDrawer(false));

        // ===== 嵌套子菜单:手风琴式展开/收起 =====
        function toggleNavGroup(e, el) {
            e.preventDefault();
            e.stopPropagation();
            var group = el.closest('.nav-group');
            if (group) group.classList.toggle('expanded');
        }

        async function restartSystem() {
            if (!await confirmDialog('服务将重启，正在进行的任务会中断。', { title: '重启确认', confirmText: '重启', danger: false })) return;
            showToast('正在重启...', 'info');
            await apiCall('/api/system/restart', 'POST');
            setTimeout(() => location.reload(), 3000);
        }
        async function exitSystem() {
            if (!await confirmDialog('退出后 DoukHub 将停止运行，可随时重新启动。', { title: '退出确认', confirmText: '退出', danger: false })) return;
            showToast('正在退出...', 'info');
            await apiCall('/api/system/exit', 'POST');
            setTimeout(() => {
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:16px;color:var(--text-muted);">DoukHub 已退出，可以关闭此窗口</div>';
            }, 1500);
        }

                // ===== SPA Router: 局部刷新,避免整页重载 =====
        // 思路:fetch 整页 → DOMParser 抽取 #main-content + #page-scripts → 局部替换 → 重执行脚本
        // 已加载的外部脚本(src)不会重复执行,避免库重复初始化导致事件监听器累积
        var _loadedScripts = new Set();
        var _spaLoadGen = 0; // 竞态保护:丢弃过期的 SPA 请求
        async function loadPage(url, pushState = true) {
            const gen = ++_spaLoadGen;
            try {
                // 导航前清理:在 DOM 被替换前销毁当前页面的资源(Grid实例、事件监听等)
                if (typeof window._spaCleanup === 'function') {
                    try { window._spaCleanup(); } catch(e) { console.warn('SPA cleanup failed', e); }
                    window._spaCleanup = null;
                }
                // 立即更新导航高亮,给用户即时反馈
                updateActiveNav(url);
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                if (gen !== _spaLoadGen) return; // 已被更新的请求取代
                const html = await resp.text();
                if (gen !== _spaLoadGen) return;
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const newMain = doc.getElementById('main-content');
                if (!newMain) { window.location.href = url; return; } // 非 SPA 友好响应,回退整页
                const main = document.getElementById('main-content');
                // 先提取脚本再设置 innerHTML,避免 querySelectorAll 在大 DOM 上重复扫描
                const newScripts = doc.getElementById('page-scripts');
                main.innerHTML = newMain.innerHTML;
                // 仅对新插入的 main-content 区域重执行脚本
                await rebindScripts(main);
                // 替换页面脚本块并重执行
                const ps = document.getElementById('page-scripts');
                if (newScripts && ps) {
                    ps.innerHTML = newScripts.innerHTML;
                    await rebindScripts(ps);
                }
                // 仅扫描新插入的 main-content 子树,不扫描整个 document
                if (window._doukhubRefreshIcons) window._doukhubRefreshIcons(main);
                if (window._doukhubRefreshTTDStatus) window._doukhubRefreshTTDStatus();
                document.title = doc.title;
                if (pushState) history.pushState({ url }, '', url);
                window.scrollTo(0, 0);
            } catch (e) {
                if (gen !== _spaLoadGen) return; // 静默丢弃过期的错误
                console.error('SPA loadPage 失败,回退整页:', e);
                window.location.href = url;
            }
        }
        // innerHTML 替换后浏览器不会执行其中的 <script>,需手动重建标签触发执行
        // 外部脚本(src)仅首次加载,后续 SPA 切换跳过(全局对象已存在,无需重新执行)
        function isExecutableScript(script) {
            const type = (script.getAttribute('type') || '').trim().toLowerCase();
            return !type || [
                'application/ecmascript',
                'application/javascript',
                'module',
                'text/ecmascript',
                'text/javascript',
            ].includes(type);
        }

        async function rebindScripts(container) {
            // 收集所有脚本后一次性处理,减少 DOM 重排次数
            const scripts = Array.from(container.querySelectorAll('script'))
                .filter(isExecutableScript);
            const inlineScripts = [];
            const externalScripts = [];
            for (const old of scripts) {
                if (old.src) externalScripts.push(old);
                else inlineScripts.push(old);
            }
            // 先处理外部脚本(需要 await 加载),确保内联脚本能引用其定义的函数
            for (const old of externalScripts) {
                if (old.dataset.reload === 'true') {
                    const s = document.createElement('script');
                    s.src = old.src;
                    old.replaceWith(s);
                    await new Promise(resolve => {
                        s.onload = resolve;
                        s.onerror = resolve;
                    });
                    continue;
                }
                if (_loadedScripts.has(old.src)) {
                    old.remove();
                    continue;
                }
                _loadedScripts.add(old.src);
                const s = document.createElement('script');
                await new Promise(resolve => {
                    s.onload = resolve;
                    s.onerror = resolve;
                    s.src = old.src;
                    old.replaceWith(s);
                });
            }
            // 再批量处理内联脚本:此时外部脚本已加载完成,内联脚本可以安全引用其中的函数
            for (const old of inlineScripts) {
                const s = document.createElement('script');
                s.textContent = old.textContent;
                old.replaceWith(s);
            }
        }
        function updateActiveNav(url) {
            document.querySelectorAll('.sidebar-nav a').forEach(a => {
                const href = a.getAttribute('href');
                if (a.classList.contains('nav-group-toggle')) {
                    a.classList.toggle('active', href === url);
                    return;
                }
                a.classList.toggle('active', href === url);
            });
            document.querySelectorAll('.nav-group').forEach(group => {
                const parent = group.querySelector('.nav-group-toggle');
                const child = Array.from(group.querySelectorAll('.nav-submenu a'));
                group.classList.toggle(
                    'expanded',
                    parent?.getAttribute('href') === url ||
                        child.some(a => a.getAttribute('href') === url)
                );
            });
        }
        // 拦截内部链接:仅同源 GET 跳转,排除修饰键/外链/锚点/新窗口
        document.addEventListener('click', e => {
            const a = e.target.closest('a');
            if (!a || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
            const href = a.getAttribute('href');
            if (!href) return;
            if (href.startsWith('#') || href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
            if (a.target === '_blank' || a.hasAttribute('download')) return;
            e.preventDefault();
            setSidebarDrawer(false); // 移动端抽屉:导航后自动收起
            loadPage(href);
        });
        window.addEventListener('popstate', () => { setSidebarDrawer(false); loadPage(location.pathname + location.search, false); });

        // ===== 后台任务:全局轮询 + 徽标 + 面板 =====
        // base 脚本不随 SPA 切换重载,定时器持续;F5 后重建
        var _taskPanelOpen = false;
        var _taskPollTimer = null;
        var _lastTasks = [];
        var TASK_TYPE_LABEL = {update_collection: '解析账号标识', sync_account: '生成账号表', refresh_accounts: '刷新账号资料', cloud_sync: '云端同步', cloud_sync_full: '全盘同步'};
        var TASK_STATUS_LABEL = {pending: '排队', running: '运行', done: '完成', failed: '失败', cancelled: '已取消'};

        async function pollTasks() {
            try {
                const data = await apiCall('/api/tasks', 'GET');
                _lastTasks = data.tasks || [];
                updateTaskBadge(_lastTasks);
                if (_taskPanelOpen) renderTaskPanel(_lastTasks);
                // 通知 sync 页(如果开着)刷新进度
                if (typeof onTasksUpdate === 'function') onTasksUpdate(_lastTasks);
            } catch (e) { /* 静默,下次重试 */ }
        }
        function updateTaskBadge(tasks) {
            const active = tasks.filter(t => t.status === 'pending' || t.status === 'running');
            const badge = document.getElementById('task-badge');
            const count = document.getElementById('task-badge-count');
            if (!badge || !count) return;
            if (active.length > 0) {
                badge.style.display = 'flex';
                count.textContent = active.length;
            } else {
                badge.style.display = 'none';
            }
        }
        function openTaskPanel() {
            _taskPanelOpen = true;
            document.getElementById('task-panel-overlay').classList.add('dh-show');
            renderTaskPanel(_lastTasks);
        }
        function closeTaskPanel() {
            _taskPanelOpen = false;
            document.getElementById('task-panel-overlay').classList.remove('dh-show');
        }
        function renderTaskPanel(tasks) {
            const body = document.getElementById('task-panel-body');
            if (!body) return;
            if (!tasks.length) {
                body.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:24px;font-size:13px;">暂无任务</div>';
                return;
            }
            body.innerHTML = tasks.map(t => {
                const done = t.success + t.failed + t.skipped;
                const pct = t.total > 0 ? Math.round(done / t.total * 100) : 0;
                const statusLabel = TASK_STATUS_LABEL[t.status] || t.status;
                const typeLabel = TASK_TYPE_LABEL[t.type] || t.type;
                const logHtml = (t.log || []).slice(-5).map(l => {
                    const cls = l.level === 'ok' ? 'log-ok' : (l.level === 'error' ? 'log-err' : 'log-info');
                    return '<div class="' + cls + '">' + l.message + '</div>';
                }).join('');
                const canCancel = t.status === 'pending' || t.status === 'running';
                const cancelBtn = canCancel ? ' · <a onclick="cancelTask(\'' + t.task_id + '\')" style="color:var(--danger);cursor:pointer;text-decoration:underline;font-size:11px;">取消</a>' : '';
                return '<div style="border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
                    '<b style="font-size:13px;">' + typeLabel + '</b>' +
                    '<span style="font-size:11px;color:var(--text-muted);">' + statusLabel + cancelBtn + '</span>' +
                    '</div>' +
                    '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">总 ' + t.total + ' · 成功 ' + t.success + ' · 失败 ' + t.failed + (t.skipped ? ' · 跳过 ' + t.skipped : '') + '</div>' +
                    '<div style="height:4px;background:var(--bg-hover);border-radius:2px;overflow:hidden;margin-bottom:6px;"><div style="width:' + pct + '%;height:100%;background:var(--accent);transition:width .3s;"></div></div>' +
                    (logHtml ? '<div style="font-family:var(--font-mono);font-size:11px;line-height:1.5;max-height:80px;overflow-y:auto;background:#0f172a;color:#cbd5e1;padding:6px 8px;border-radius:var(--radius-xs);">' + logHtml + '</div>' : '') +
                    '</div>';
            }).join('');
        }
        async function cancelTask(taskId) {
            await apiCall('/api/tasks/' + taskId + '/cancel', 'POST');
            pollTasks();
        }

        async function refreshTTDStatus() {
            const badges = document.querySelectorAll('[data-ttd-status="true"]');
            if (!badges.length) return;
            try {
                const data = await apiCall('/api/services/status', 'GET');
                const ttd = (data.services || []).find(s => s.name === 'TikTokDownloader');
                const running = Boolean(ttd && ttd.running);
                badges.forEach(badge => {
                    badge.className = 'workflow-status ' + (running ? 'success' : 'failed');
                    badge.textContent = 'TTD 服务' + (running ? '运行中' : '未运行');
                });
            } catch (e) {
                badges.forEach(badge => {
                    badge.className = 'workflow-status failed';
                    badge.textContent = 'TTD 服务状态未知';
                });
            }
        }
        window._doukhubRefreshTTDStatus = refreshTTDStatus;
        document.addEventListener('DOMContentLoaded', refreshTTDStatus);

        // 启动轮询(2.5s 一次,本地接口开销极小)
        // 页面不可见时暂停轮询,减少与 SPA 切换的资源竞争
        if (!_taskPollTimer) {
            _taskPollTimer = setInterval(() => {
                if (document.hidden) return; // 标签页不可见时跳过
                pollTasks();
            }, 2500);
            pollTasks();
        }
        // 页面恢复可见时立即轮询一次
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) pollTasks();
        });
    </script>
    <div id="page-scripts" style="display:none">{% block scripts %}{% endblock %}</div>
    <script>
        // 注册首屏已加载的外部脚本,防止 SPA 首次切换时重复执行
        document.querySelectorAll('script[src]').forEach(function(s) {
            _loadedScripts.add(s.src);
        });
    </script>
    <script>
        function refreshIcons(container) {
            if (window.lucide?.createIcons) {
                // 如果指定了容器,仅扫描该子树;否则扫描整个 document
                if (container) window.lucide.createIcons({ root: container, nameAttr: 'data-lucide' });
                else window.lucide.createIcons();
            }
        }
        document.addEventListener('DOMContentLoaded', () => refreshIcons());
        window._doukhubRefreshIcons = refreshIcons;
    </script>
</body>
</html>
