<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DoukHub{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script>
      // Anti-FOUC: load theme CSS before first paint
      (function() {
        var themes = {
          obsidian:'/static/css/theme-obsidian.css',
          slate:   '/static/css/theme-slate.css',
          material:'/static/css/theme-material.css',
          glass:   '/static/css/theme-glass.css'
        };
        var saved = localStorage.getItem('doukhub-theme') || 'obsidian';
        if (!themes[saved]) saved = 'obsidian';
        document.write('<link id="theme-css" rel="stylesheet" href="' + themes[saved] + '">');
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
</head>
<body>
    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-brand">
                <i class="ph-bold ph-rocket-launch"></i>
                <span>DoukHub</span>
                <button id="sidebar-collapse-btn" onclick="toggleSidebar()" title="折叠/展开侧边栏" class="sidebar-collapse-btn">
                    <i class="ph ph-sidebar-simple"></i>
                </button>
            </div>
            <div class="sidebar-nav">
                <a href="/status" class="{% if page == 'status' %}active{% endif %}">
                    <i class="ph ph-gauge"></i> 状态
                </a>
                <a href="/sync" class="{% if page == 'sync' %}active{% endif %}">
                    <i class="ph ph-arrows-clockwise"></i> 同步
                </a>
                <a href="/collect" class="{% if page == 'collect' %}active{% endif %}">
                    <i class="ph ph-download-simple"></i> 采集
                </a>
                <a href="/history" class="{% if page == 'history' %}active{% endif %}">
                    <i class="ph ph-clock-counter-clockwise"></i> 记录
                </a>
                <a href="/database" class="{% if page == 'database' %}active{% endif %}">
                    <i class="ph ph-database"></i> 数据
                </a>
                <a href="/table" class="{% if page == 'table' %}active{% endif %}">
                    <i class="ph ph-table"></i> 表浏览
                </a>
                <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">
                    <i class="ph ph-gear"></i> 设置
                </a>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <span class="sidebar-version" style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.05em;">v2.0</span>
                    <select id="theme-select" onchange="switchTheme(this.value)" style="font-size:11px;padding:3px 8px;border:1px solid var(--border-default);border-radius:6px;background:var(--bg-input);color:var(--text-secondary);cursor:pointer;outline:none;font-family:inherit;">
                        <option value="obsidian">Obsidian</option>
                        <option value="slate">Slate</option>
                        <option value="material">Material</option>
                        <option value="glass">Glass</option>
                    </select>
                </div>
            </div>
        </nav>
        <div id="sidebar-resizer" class="sidebar-resizer"></div>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- 通用确认弹窗(禁用浏览器原生 confirm/alert/prompt) -->
    <div id="dh-confirm-overlay" class="dh-modal-overlay">
        <div class="dh-modal-box">
            <div class="dh-modal-header">
                <h3><i class="ph ph-question"></i> <span id="dh-confirm-title">确认</span></h3>
                <button class="dh-modal-close" onclick="dhConfirmResolve(false)"><i class="ph ph-x"></i></button>
            </div>
            <div id="dh-confirm-message" class="dh-modal-body"></div>
            <input id="dh-confirm-input" type="text" style="display:none;width:100%;box-sizing:border-box;margin-top:12px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--bg-input);color:var(--text-primary);font-size:13px;">
            <div class="dh-modal-actions">
                <button class="dh-btn dh-btn-ghost" onclick="dhConfirmResolve(false)">取消</button>
                <button id="dh-confirm-ok" class="dh-btn dh-btn-danger" onclick="dhConfirmResolve(true)">确定</button>
            </div>
        </div>
    </div>

    <style>
    /* 通用确认弹窗(全局共享,使用通用 CSS 变量,4 主题通吃) */
    .dh-modal-overlay {
        display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(10, 11, 15, 0.7); z-index: 20000;
        align-items: center; justify-content: center;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .dh-modal-overlay.dh-show { display: flex !important; }
    .dh-modal-box {
        background: var(--bg-muted);
        border-radius: var(--radius-xl);
        padding: 24px; width: 90%; max-width: 420px;
        border: 1px solid var(--border-default);
        box-shadow: var(--shadow-xl);
        animation: dh-modal-in 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes dh-modal-in {
        from { transform: translateY(12px) scale(0.96); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .dh-modal-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 12px; padding-bottom: 12px;
        border-bottom: 1px solid var(--border-default);
    }
    .dh-modal-header h3 {
        margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary);
        display: flex; align-items: center; gap: 8px;
    }
    .dh-modal-header h3 i { color: var(--accent); font-size: 18px; }
    .dh-modal-close {
        background: none; border: none; font-size: 16px; cursor: pointer;
        color: var(--text-muted); padding: 4px; border-radius: var(--radius-xs);
        width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    }
    .dh-modal-close:hover { background: var(--danger-light); color: var(--danger-text); }
    .dh-modal-body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; word-break: break-all; }
    .dh-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .dh-btn {
        padding: 8px 18px; border: none; border-radius: var(--radius-sm);
        font-size: 13px; font-weight: 600; cursor: pointer;
        transition: all var(--transition-fast);
    }
    .dh-btn-ghost { background: var(--surface-overlay); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .dh-btn-ghost:hover { background: var(--menu-hover); }
    .dh-btn-primary { background: var(--accent); color: var(--text-on-accent); }
    .dh-btn-primary:hover { opacity: 0.85; }
    .dh-btn-danger { background: var(--danger); color: var(--text-on-accent); }
    .dh-btn-danger:hover { background: var(--danger-light); color: var(--danger-text); }
    .dh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== 侧边栏折叠 + 拖动调宽 ===== */
    .sidebar { position: relative; transition: width 0.2s ease; }
    .sidebar.sb-collapsed { width: 64px !important; }
    .sb-collapsed .sidebar-brand { padding: 24px 12px 16px; justify-content: center; }
    .sb-collapsed .sidebar-brand > span,
    .sb-collapsed .sidebar-nav a span,
    .sb-collapsed .sidebar-version,
    .sb-collapsed #theme-select { display: none; }
    .sb-collapsed .sidebar-nav a { justify-content: center; padding: 0; gap: 0; }
    .sb-collapsed .sidebar-footer { padding: 8px; border-top: none; }
    .sb-collapsed .sidebar-nav a::before { left: auto; right: 0; }
    /* 折叠时悬停/钉住:整个侧边栏浮层展开 */
    .sidebar.sb-collapsed.sb-flyout,
    .sidebar.sb-collapsed.sb-pinned {
        position: fixed; top: 0; left: 0; z-index: 2000;
        width: var(--sidebar-w) !important;
        box-shadow: var(--shadow-xl);
    }
    .sidebar.sb-collapsed.sb-flyout .sidebar-nav a,
    .sidebar.sb-collapsed.sb-pinned .sidebar-nav a {
        justify-content: flex-start; padding: 0 16px; gap: 12px;
    }
    .sidebar.sb-collapsed.sb-flyout .sidebar-brand,
    .sidebar.sb-collapsed.sb-pinned .sidebar-brand {
        justify-content: flex-start; padding: 24px 20px 16px;
    }
    .sidebar.sb-collapsed.sb-flyout .sidebar-brand > span,
    .sidebar.sb-collapsed.sb-pinned .sidebar-brand > span,
    .sidebar.sb-collapsed.sb-flyout .sidebar-version,
    .sidebar.sb-collapsed.sb-pinned .sidebar-version { display: inline; }
    .sidebar.sb-collapsed.sb-flyout .sidebar-nav a span,
    .sidebar.sb-collapsed.sb-pinned .sidebar-nav a span { display: inline; }
    .sidebar.sb-collapsed.sb-flyout #theme-select,
    .sidebar.sb-collapsed.sb-pinned #theme-select { display: inline-block; }
    .sidebar.sb-collapsed.sb-flyout .sidebar-footer > div,
    .sidebar.sb-collapsed.sb-pinned .sidebar-footer > div { display: flex !important; }
    .sidebar-collapse-btn {
        width: 32px; height: 32px; margin-left: auto; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: none; border-radius: var(--radius-sm);
        color: var(--text-muted); cursor: pointer; font-size: 16px;
        transition: all var(--transition-fast);
    }
    .sb-collapsed .sidebar-collapse-btn { margin-left: 0; }
    .sidebar-collapse-btn:hover { background: var(--bg-hover); color: var(--accent); }
    .sidebar-resizer {
        position: fixed; top: 0; left: var(--sidebar-w);
        width: 4px; height: 100vh; cursor: ew-resize;
        z-index: 1000; transition: background 0.15s;
    }
    .sidebar-resizer:hover, .sidebar-resizer.dragging { background: var(--accent); opacity: 0.4; }
    .sb-collapsed ~ .sidebar-resizer { display: none; }
    .sb-collapsed.sb-flyout ~ .sidebar-resizer,
    .sb-collapsed.sb-pinned ~ .sidebar-resizer { display: block; }
    </style>

    <script>
        // ===== 通用确认弹窗(替代浏览器 confirm) =====
        // 用法: if (await confirmDialog('确定删除吗？')) { ... }
        // 返回 Promise<boolean>:确定 true,取消/关闭 false
        let _dhConfirmCb = null;
        function dhConfirmResolve(val) {
            document.getElementById('dh-confirm-overlay').classList.remove('dh-show');
            if (_dhConfirmCb) { _dhConfirmCb(val); _dhConfirmCb = null; }
        }
        function confirmDialog(message, opts = {}) {
            const title = opts.title || '确认';
            const confirmText = opts.confirmText || '确定';
            const danger = opts.danger !== false; // 默认红色"确定"按钮(删除类操作)
            const requireText = opts.requireText || ''; // 输入指定文字后才可点确定
            document.getElementById('dh-confirm-title').textContent = title;
            document.getElementById('dh-confirm-message').textContent = message;
            const okBtn = document.getElementById('dh-confirm-ok');
            okBtn.textContent = confirmText;
            okBtn.className = 'dh-btn ' + (danger ? 'dh-btn-danger' : 'dh-btn-primary');
            const inputEl = document.getElementById('dh-confirm-input');
            inputEl.style.display = requireText ? 'block' : 'none';
            inputEl.value = '';
            okBtn.disabled = !!requireText;
            inputEl.oninput = () => { okBtn.disabled = inputEl.value.trim() !== requireText; };
            document.getElementById('dh-confirm-overlay').classList.add('dh-show');
            (requireText ? inputEl : okBtn).focus();
            return new Promise(resolve => { _dhConfirmCb = resolve; });
        }
        // Esc 关闭
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && document.getElementById('dh-confirm-overlay').classList.contains('dh-show')) {
                dhConfirmResolve(false);
            }
        });
    </script>

    <script>
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast toast-' + type;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        async function apiCall(url, method = 'GET', body = null) {
            const opts = { method };
            if (body) {
                if (body instanceof FormData) {
                    opts.body = body;
                } else {
                    opts.headers = { 'Content-Type': 'application/json' };
                    opts.body = JSON.stringify(body);
                }
            }
            const resp = await fetch(url, opts);
            return resp.json();
        }
        // ===== Theme Switcher =====
        var THEMES = {
          obsidian:'/static/css/theme-obsidian.css',
          slate:   '/static/css/theme-slate.css',
          material:'/static/css/theme-material.css',
          glass:   '/static/css/theme-glass.css'
        };
        function initThemeSelect() {
          var saved = localStorage.getItem('doukhub-theme') || 'obsidian';
          var sel = document.getElementById('theme-select');
          if (sel) sel.value = saved;
        }
        function switchTheme(name) {
          if (!THEMES[name]) return;
          var link = document.getElementById('theme-css');
          if (link) link.href = THEMES[name];
          localStorage.setItem('doukhub-theme', name);
          document.documentElement.setAttribute('data-theme', name);
          showToast('皮肤已切换: ' + name, 'info');
        }
        initThemeSelect();

        // ===== 侧边栏折叠 + 拖动调宽 =====
        // 折叠态交互(方案B):窄栏只显图标,悬停整栏浮动展开,点击折叠按钮钉住/取消
        function toggleSidebar() {
            const sb = document.querySelector('.sidebar');
            if (sb.classList.contains('sb-collapsed')) {
                // 展开
                sb.classList.remove('sb-collapsed', 'sb-flyout', 'sb-pinned');
                localStorage.setItem('doukhub-sidebar-collapsed', '0');
                restoreSidebarWidth();
            } else {
                // 折叠
                sb.classList.add('sb-collapsed');
                localStorage.setItem('doukhub-sidebar-collapsed', '1');
            }
        }
        function restoreSidebarWidth() {
            const saved = localStorage.getItem('doukhub-sidebar-width');
            if (saved) {
                document.querySelector('.sidebar').style.width = saved + 'px';
                document.getElementById('sidebar-resizer').style.left = saved + 'px';
            }
        }
        // 折叠态:悬停浮动展开,移动鼠标离开收回;点击折叠按钮钉住
        (function initSidebarFlyout() {
            const sb = document.querySelector('.sidebar');
            const btn = document.getElementById('sidebar-collapse-btn');
            let hoverTimer = null;
            sb.addEventListener('mouseenter', () => {
                if (!sb.classList.contains('sb-collapsed') || sb.classList.contains('sb-pinned')) return;
                clearTimeout(hoverTimer);
                sb.classList.add('sb-flyout');
            });
            sb.addEventListener('mouseleave', () => {
                if (!sb.classList.contains('sb-collapsed')) return;
                hoverTimer = setTimeout(() => {
                    if (!sb.classList.contains('sb-pinned')) sb.classList.remove('sb-flyout');
                }, 150);
            });
            // 点击折叠按钮:钉住/取消钉住(仅折叠态)
            btn.addEventListener('click', e => {
                e.stopPropagation();
                if (!sb.classList.contains('sb-collapsed')) return;
                const pinned = sb.classList.toggle('sb-pinned');
                sb.classList.remove('sb-flyout');
                btn.title = pinned ? '取消钉住' : '钉住菜单/取消';
            });
        })();
        // 钉住状态:点击外部区域取消钉住
        document.addEventListener('click', e => {
            const sb = document.querySelector('.sidebar');
            if (!sb || !sb.classList.contains('sb-pinned')) return;
            if (!sb.contains(e.target)) sb.classList.remove('sb-pinned');
        });
        // 拖动调宽
        (function initSidebarResizer() {
            const resizer = document.getElementById('sidebar-resizer');
            const sb = document.querySelector('.sidebar');
            let dragging = false;
            resizer.addEventListener('mousedown', e => {
                dragging = true;
                resizer.classList.add('dragging');
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (!dragging) return;
                const w = Math.max(120, Math.min(480, e.clientX));
                sb.style.width = w + 'px';
                resizer.style.left = w + 'px';
            });
            document.addEventListener('mouseup', () => {
                if (!dragging) return;
                dragging = false;
                resizer.classList.remove('dragging');
                const w = Math.max(120, Math.min(480, sb.offsetWidth));
                localStorage.setItem('doukhub-sidebar-width', w);
            });
            // 恢复折叠状态
            if (localStorage.getItem('doukhub-sidebar-collapsed') === '1') {
                sb.classList.add('sb-collapsed');
            } else {
                restoreSidebarWidth();
            }
        })();

        async function restartSystem() {
            if (!await confirmDialog('服务将重启，正在进行的任务会中断。', { title: '重启确认', confirmText: '重启', danger: false })) return;
            showToast('正在重启...', 'info');
            await apiCall('/api/system/restart', 'POST');
            setTimeout(() => location.reload(), 3000);
        }
        async function exitSystem() {
            if (!await confirmDialog('退出后 DoukHub 将停止运行，可随时重新启动。', { title: '退出确认', confirmText: '退出', danger: false })) return;
            showToast('正在退出...', 'info');
            await apiCall('/api/system/exit', 'POST');
            setTimeout(() => {
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:16px;color:var(--text-muted);">DoukHub 已退出，可以关闭此窗口</div>';
            }, 1500);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
