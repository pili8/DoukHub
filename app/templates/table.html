    window._tblDocKeydown = function(e) {
        if (e.key === 'Escape') closeFilterPopup();
    };
    document.addEventListener('click', window._tblDocClick);
    document.addEventListener('keydown', window._tblDocKeydown);

    // =========================================================================
    // 标签多选编辑器
    // =========================================================================
    var TagMultiSelectEditor = class {
        init(params) {
            this.params = params;
            this.selectedTags = new Set();

            let val = params.value;
            if (val) {
                if (typeof val === 'string') {
                    try {
                        const parsed = JSON.parse(val);
                        if (Array.isArray(parsed)) val = parsed;
                    } catch (e) { val = [val]; }
                }
                if (Array.isArray(val)) {
                    val.forEach(t => this.selectedTags.add(String(t)));
                }
            }

            this.availableTags = new Set();
            if (params.api) {
                params.api.forEachNode(node => {
                    let tags = node.data ? node.data['标签'] : null;
                    if (tags) {
                        if (typeof tags === 'string') {
                            try {
                                const parsed = JSON.parse(tags);
                                if (Array.isArray(parsed)) tags = parsed;
                            } catch (e) { tags = [tags]; }
                        }
                        if (Array.isArray(tags)) {
                            tags.forEach(t => this.availableTags.add(String(t)));
                        }
                    }
                });
            }
            this.selectedTags.forEach(t => this.availableTags.add(t));

            this.gui = document.createElement('div');
            this.gui.style.cssText = 'background: var(--surface-overlay); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 8px; min-width: 200px; max-height: 280px; overflow-y: auto; box-shadow: var(--shadow-lg);';

            const inputRow = document.createElement('div');
            inputRow.style.cssText = 'display: flex; gap: 4px; margin-bottom: 8px;';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = '添加新标签…';
            input.style.cssText = 'flex: 1; padding: 5px 8px; border: 1px solid var(--border-default); border-radius: var(--radius-xs); font-size: 12px; background: var(--bg-input); color: var(--text-primary); font-family: inherit;';
            const addBtn = document.createElement('button');
            addBtn.textContent = '+';
            addBtn.style.cssText = 'padding: 4px 12px; border: none; border-radius: var(--radius-xs); background: var(--accent); color: var(--text-on-accent); cursor: pointer; font-size: 14px; font-weight: 700;';
            addBtn.onclick = (e) => {
                e.stopPropagation();
                const v = input.value.trim();
                if (v) {
                    this.availableTags.add(v);
                    this.selectedTags.add(v);
                    input.value = '';
                    this._renderTags();
                }
            };
            input.onkeydown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
                e.stopPropagation();
            };
            inputRow.appendChild(input);
            inputRow.appendChild(addBtn);
            this.gui.appendChild(inputRow);

            this._tagsBox = document.createElement('div');
            this.gui.appendChild(this._tagsBox);
            this._renderTags();

            setTimeout(() => input.focus(), 0);
        }

        _renderTags() {
            this._tagsBox.innerHTML = '';
            const sorted = Array.from(this.availableTags).sort();
            sorted.forEach(tag => {
                const label = document.createElement('label');
                label.style.cssText = 'display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; border-radius: var(--radius-xs); font-size: 12px; transition: background var(--transition-fast);';
                label.onmouseenter = () => label.style.background = 'var(--bg-hover)';
                label.onmouseleave = () => label.style.background = '';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = this.selectedTags.has(tag);
                cb.style.cssText = 'width: 16px; height: 16px; accent-color: var(--accent);';
                cb.onchange = () => {
                    if (cb.checked) this.selectedTags.add(tag);
                    else this.selectedTags.delete(tag);
                };

                const span = document.createElement('span');
                span.style.color = 'var(--text-primary)';
                span.textContent = tag;

                label.appendChild(cb);
                label.appendChild(span);
                this._tagsBox.appendChild(label);
            });
        }

        getGui() { return this.gui; }
        getValue() {
            const tags = Array.from(this.selectedTags).sort();
            return tags.length ? JSON.stringify(tags) : null;
        }
        isPopup() { return true; }
        destroy() { this.gui = null; }
    };

    // =========================================================================
    // 列定义构建
    // =========================================================================
    function _getSavedWidth(table, colId, defaultWidth) {
        try {
            var raw = localStorage.getItem('doukhub-col-widths-' + table);
            if (raw) {
                var w = JSON.parse(raw);
                if (w[colId]) return w[colId];
            }
        } catch(e) {}
        return defaultWidth;
    }
    function buildColumnDefs(tableName, schema) {
        const editableFields = TABLE_EDITABLE_FIELDS[tableName] || [];
        const hasActions = TABLE_HAS_ACTIONS[tableName] !== false;

        let colDefs = [];

        colDefs.push({
            headerName: '',
            width: 42,
            checkboxSelection: true,
            // infinite 行模型不支持 headerCheckboxSelection，用自定义表头实现"全选已加载行"
            headerComponent: TblSelectAllHeader,
            sortable: false,
            filter: false,
            pinned: 'left',
            resizable: false,
            suppressMovable: true,
        });

        schema.forEach(field => {
            if (HIDDEN_COLS.includes(field.name)) return;
            const isEditable = editableFields.includes(field.name);
            const type = (field.type || '').toUpperCase();
            const isBool = type === 'BOOLEAN';

            let colDef = {
                field: field.name,
                headerName: FIELD_DISPLAY_NAMES[field.name] || field.name,
                sortable: true,
                filter: false,
                floatingFilter: false,
                resizable: true,
                editable: isEditable,
                width: _getSavedWidth(tableName, field.name, FIELD_WIDTHS[field.name] || 120),
                suppressMovable: true,
                headerComponent: DoukHeaderComponent,
                headerClass: (() => { const c = getFieldCategory(tableName, field.name); return c ? 'col-cat-' + c : null; })(),
            };

            const editorCfg = FIELD_EDITORS[field.name];
            if (isEditable && editorCfg) {
                if (editorCfg.editor === 'tagMultiSelect') {
                    colDef.cellEditor = TagMultiSelectEditor;
                } else {
                    colDef.cellEditor = editorCfg.editor;
                    if (editorCfg.params) colDef.cellEditorParams = editorCfg.params;
                }
            }

            // 解析状态/获取状态是 TEXT 枚举，不走 boolean 分支
            if (isEditable && isBool && field.name !== '解析状态' && field.name !== '获取状态') {
                colDef.cellRenderer = editableCheckboxRenderer;
                colDef.editable = false;
            } else if (isEditable && editorCfg) {
                const renderer = FIELD_RENDERERS[field.name];
                if (renderer) colDef.cellRenderer = renderer;
            } else {
                if (isBool) {
                    colDef.cellRenderer = boolDisplayRenderer;
                } else {
                    const renderer = FIELD_RENDERERS[field.name];
                    if (renderer) colDef.cellRenderer = renderer;
                }
            }

            if (field.name === 'record_id') {
                colDef.pinned = null;
            }

            // 分享表的 sec_user_id 用链接渲染器，点击跳转到账号表
            if (tableName === 'share_cache' && field.name === 'sec_user_id') {
                colDef.cellRenderer = secUserIdLinkRenderer;
            }

            // 账号表的 sec_user_id：查看该账号采集作品的入口
            if (tableName === 'account_cache' && field.name === 'sec_user_id') {
                colDef.cellRenderer = accountWorksRenderer;
            }

            colDefs.push(colDef);
        });

        const order = COLUMN_ORDER[tableName];
        if (order) {
            colDefs.sort((a, b) => {
                const ia = order.indexOf(a.field);
                const ib = order.indexOf(b.field);
                if (ia === -1 && ib === -1) return 0;
                if (ia === -1) return 1;
                if (ib === -1) return -1;
                return ia - ib;
            });
        }

        if (hasActions) {
            colDefs.push({
                headerName: '操作',
                cellRenderer: actionsRenderer,
                sortable: false,
                filter: false,
                floatingFilter: false,
                pinned: 'right',
                width: 90,
                editable: false,
                resizable: false,
                suppressMovable: true,
            });
        }

        return colDefs;
    }

    // =========================================================================
    // AG Grid 初始化
    // =========================================================================
    // infinite datasource：自带块缓存 + 空闲预取下一块。
    // 查询条件（表/关键词/排序/筛选/搜索范围）变化时 _dsSeq 自增并创建新数据源，
    // 旧请求回调因 seq 不匹配被丢弃，天然规避竞态。
    var _dsSeq = 0;

    function _buildQueryUrl(tableName, limit, offset) {
        var url = '/api/database/table/' + tableName + '?limit=' + limit + '&offset=' + offset;
        if (currentKeyword) url += '&search=' + encodeURIComponent(currentKeyword);
        if (currentSearchField && currentSearchField !== '__all__') {
            var f = currentSearchField === '__text__'
                ? (TEXT_SEARCH_FIELDS[tableName] || []).join(',')
                : currentSearchField;
            if (f) url += '&search_field=' + encodeURIComponent(f);
        }
        if (currentSortField) url += '&sort_field=' + encodeURIComponent(currentSortField) + '&sort_order=' + encodeURIComponent(currentSortOrder || 'asc');
        var filterKeys = Object.keys(currentFilters).filter(function(k) { return currentFilters[k] && currentFilters[k].length; });
        if (filterKeys.length) {
            var filterArr = filterKeys.map(function(k) { return { field: k, values: currentFilters[k] }; });
            url += '&filters=' + encodeURIComponent(JSON.stringify(filterArr));
        }
        return url;
    }

    function makeDatasource() {
        var seq = ++_dsSeq;
        var cache = { blocks: new Map(), total: null, loaded: 0, prefetching: new Set() };

        function fetchBlock(startRow, endRow) {
            // 精确总数只在第一批要一次；后续块复用，省掉重复 COUNT
            var needTotal = cache.total === null;
            var url = _buildQueryUrl(currentTable, endRow - startRow, startRow) + '&need_total=' + needTotal;
            return apiCall(url, 'GET').then(function(data) {
                if (needTotal) cache.total = (data.total != null && data.total >= 0) ? data.total : 0;
                return { rows: data.records || [], total: cache.total };
            });
        }

        return {
            getRows: function(params) {
                if (seq !== _dsSeq) { params.successCallback([], 0); return; }
                var startRow = params.startRow, endRow = params.endRow;
                var blk = cache.blocks.get(startRow);
                if (blk) {
                    params.successCallback(blk.rows, blk.total);
                    return;
                }
                _setStatusLoading(true);
                fetchBlock(startRow, endRow).then(function(res) {
                    if (seq !== _dsSeq) return;
                    cache.blocks.set(startRow, res);
                    cache.loaded = Math.max(cache.loaded, endRow);
                    params.successCallback(res.rows, res.total);
                    _renderLoadStatus(cache);
                    _setStatusLoading(false);
                    // 预取下一块：滚过去时数据已在本地
                    var nextStart = endRow;
                    var more = res.total < 0 || nextStart < res.total;
                    if (more && !cache.blocks.has(nextStart) && !cache.prefetching.has(nextStart)) {
                        cache.prefetching.add(nextStart);
                        fetchBlock(nextStart, nextStart + BLOCK_SIZE).then(function(r2) {
                            if (seq !== _dsSeq) return;
                            cache.blocks.set(nextStart, r2);
                            cache.prefetching.delete(nextStart);
                            // 预取的块也算进"已加载"，状态条才准确
                            cache.loaded = Math.max(cache.loaded, nextStart + BLOCK_SIZE);
                            _renderLoadStatus(cache);
                        }).catch(function() { cache.prefetching.delete(nextStart); });
                    }
                }).catch(function() {
                    if (seq === _dsSeq) { _setStatusLoading(false); params.failCallback(); }
                });
            },
            destroy: function() { /* 缓存随闭包释放 */ }
        };
    }

    function _renderLoadStatus(cache) {
        var el = document.getElementById('pagination');
        if (!el) return;
        var total = cache.total;
        var hasTotal = total !== null && total !== undefined && total >= 0;
        var totalTxt = hasTotal ? Number(total).toLocaleString('zh-CN') : '…';
        var loaded = Number(cache.loaded || 0);
        if (hasTotal) loaded = Math.min(loaded, total);
        if (hasTotal) currentTotal = total;

        // 顶部计数徽章同步（保留"已筛选 · 清除"等附加元素）
        var countBadge = document.getElementById('table-count-badge');
        if (countBadge) {
            var extras = Array.prototype.slice.call(countBadge.querySelectorAll('span'));
            countBadge.innerHTML = '';
            countBadge.appendChild(document.createTextNode((hasTotal ? totalTxt : '…') + ' 条'));
            extras.forEach(function(x) { countBadge.appendChild(x); });
        }

        el.innerHTML =
            '<div class="tbl-load-status">' +
            '<span>已加载 <span class="ls-total">' + loaded.toLocaleString('zh-CN') + '</span> / 共 <span class="ls-total">' + totalTxt + '</span> 条</span>' +
            '<span class="ls-spinner"><i class="ph ph-circle-notch" style="animation:spin 0.8s linear infinite;"></i> 加载中…</span>' +
            '<span style="color:var(--text-muted);">下滑自动加载</span>' +
            '<button class="ls-top" onclick="backToTop()"><i class="ph ph-arrow-up"></i> 回到顶部</button>' +
            '</div>';
    }

    function _setStatusLoading(on) {
        var el = document.getElementById('pagination');
        if (el) el.classList.toggle('loading', !!on);
    }

    function backToTop() {
        if (gridApi) gridApi.ensureIndexVisible(0, 'top');
        var main = document.querySelector('.main') || document.documentElement;
        main.scrollTop = 0;
    }

    function ensureGrid(colDefs) {
        if (!gridInitialized) {
            const gridDiv = document.getElementById('ag-grid-container');
            if (!gridDiv) {
                console.error('ensureGrid: #ag-grid-container 不存在');
                return;
            }
            gridApi = agGrid.createGrid(gridDiv, {
                columnDefs: colDefs,
                rowModelType: 'infinite',
                datasource: makeDatasource(),
                cacheBlockSize: BLOCK_SIZE,
                maxBlocksInCache: 10,
                blockLoadDebounceMillis: 50,
                rowSelection: 'multiple',
                suppressRowClickSelection: true,
                animateRows: false,
                stopEditingWhenCellsLoseFocus: true,
            defaultColDef: {
                sortable: true,
                resizable: true,
                minWidth: 50,
                floatingFilter: false,
            },
                rowHeight: 40,
                headerHeight: 40,
                overlayLoadingTemplate: '<div style="padding: 20px;"><i class="ph ph-circle-notch" style="font-size: 24px; animation: spin 0.8s linear infinite; display: inline-block; color: var(--accent);"></i> <span style="color:var(--text-muted);font-size:13px;">加载中…</span></div>',
                overlayNoRowsTemplate: '<div style="padding: 40px; text-align: center; color: var(--text-muted);"><i class="ph ph-database" style="font-size: 36px; opacity: 0.3; display: block; margin-bottom: 10px;"></i><span style="font-size:14px;">暂无数据</span></div>',
                getRowId: (params) => {
                    // infinite 模型的"加载中"占位行没有 data，必须先判空，
                    // 否则渲染骨架行时抛异常，行回收被打断（滚动会明显卡顿）
                    if (!params.data) return undefined;
                    return params.data.record_id || ('ID_' + (params.data.ID || ''));
                },
                onCellValueChanged: onCellValueChanged,
                onSelectionChanged: () => { updateBatchToolbar(); syncSelectAllHeader(); },
                onColumnResized: (e) => saveColState(e),
                onColumnMoved: (e) => saveColState(e),
            });
            gridInitialized = true;
            restoreColState();
        } else {
            gridApi.setGridOption('columnDefs', colDefs);
            gridApi.deselectAll();
        }
    }

    var _colSaveTimer = null;
    function saveColState(e) {
        if (!gridApi) return;
        if (_colSaveTimer) clearTimeout(_colSaveTimer);
        _colSaveTimer = setTimeout(function() {
            try {
                var state = gridApi.getColumnState();
                var widths = {};
                state.forEach(function(cs) { if (cs.width) widths[cs.colId] = cs.width; });
                localStorage.setItem('doukhub-col-widths-' + currentTable, JSON.stringify(widths));
            } catch(err) {}
        }, 300);
    }
    function restoreColState() {
        // Widths now read directly in buildColumnDefs, nothing to do here
    }

    async function onCellValueChanged(event) {
        const field = event.colDef.field;
        const newValue = event.newValue;
        const oldValue = event.oldValue;
        if (newValue === oldValue) return;
        const recordId = event.data.record_id || String(event.data.ID || '');
        if (!recordId) return;

        try {
            const result = await apiCall('/api/database/update', 'PUT', {
                table: currentTable,
                record_id: recordId,
                data: { [field]: newValue }
            });
            if (result.success) {
                showToast('已更新「' + field + '」', 'success');
                // Flash the cell with success
                gridApi.refreshCells({ rowNodes: [event.node], columns: [field] });
            } else {
                showToast(result.message || '更新失败', 'error');
                event.data[field] = oldValue;
                gridApi.refreshCells({ rowNodes: [event.node], columns: [field] });
            }
        } catch (e) {
            showToast('更新失败: ' + e.message, 'error');
            event.data[field] = oldValue;
            gridApi.refreshCells({ rowNodes: [event.node], columns: [field] });
        }
    }

    // =========================================================================
    // 数据加载
    // =========================================================================
    // SPA 友好:直接调用(脚本在 body 末尾,DOM 已就绪;SPA 二次进入由 rebindScripts 重执行)
    renderTableTabs();
    // 支持从健康度等入口跳转定位:?tab=account_cache&sec=<sec_user_id>
    (function() {
        var qp = new URLSearchParams(location.search);
        var tab = qp.get('tab');
        var sec = qp.get('sec');
        if (tab && TABLE_NAMES[tab]) {
            if (tab === 'account_cache' && sec) {
                // 目标账号可能不在已加载的块里,直接带 sec_user_id 搜索定位(唯一值)。
                // 注意:默认搜索范围是"文本字段"不含 sec_user_id,这里必须显式切到该字段。
                currentSearchField = 'sec_user_id';
                var kw = document.getElementById('search-keyword');
                if (kw) kw.value = sec;
                var clearBtn = document.getElementById('search-clear-btn');
                if (clearBtn) clearBtn.style.display = 'flex';
                showTable(tab, 1, sec);
                setTimeout(function() {
                    if (gridApi) {
                        gridApi.forEachNode(function(node) {
                            if (node.data && node.data.sec_user_id === sec) {
                                gridApi.ensureNodeVisible(node);
                                var rowEl = document.querySelector('.ag-root-wrapper [row-id="' + CSS.escape(node.id) + '"]');
                                if (rowEl) {
                                    rowEl.classList.add('jump-highlight');
                                    setTimeout(function() { rowEl.classList.remove('jump-highlight'); }, 3000);
                                }
                            }
                        });
                    }
                }, 500);
            } else {
                showTable(tab);
            }
        } else {
            showTable('share_cache');
        }
    })();

    function renderTableTabs() {
        const container = document.getElementById('table-tabs');
        let html = '';
        for (const [key, name] of Object.entries(TABLE_NAMES)) {
            const icon = TABLE_ICONS[key] || 'ph-table';
            const colorCls = TABLE_COLORS[key] || '';
            html += '<button class="tab-btn ' + (key === currentTable ? 'active' : '') + '" onclick="showTable(\'' + key + '\')" id="tab-' + key + '">';
            html += '<i class="ph ' + icon + ' tab-icon ' + colorCls + '"></i> ' + name;
            html += '</button>';
        }
        container.innerHTML = html;
    }

    function updateTabActive() {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById('tab-' + currentTable);
        if (activeBtn) activeBtn.classList.add('active');
    }

    // 从分享表跳转到账号表，搜索定位对应 sec_user_id 的行并高亮
    async function jumpToAccount(secUserId) {
        // 默认搜索范围"文本字段"不含 sec_user_id，跳转定位必须显式切到该字段
        currentSearchField = 'sec_user_id';
        await showTable('account_cache', 1, secUserId);
        // 等数据加载完后查找并高亮
        setTimeout(function() {
            if (!gridApi) return;
            var found = false;
            gridApi.forEachNode(function(node) {
                if (node.data && node.data.sec_user_id === secUserId) {
                    gridApi.ensureNodeVisible(node);
                    // 用 CSS 临时高亮行，不选中
                    var rowEl = document.querySelector('.ag-root-wrapper [row-id="' + CSS.escape(node.id) + '"]');
                    if (rowEl) {
                        rowEl.classList.add('jump-highlight');
                        setTimeout(function() { rowEl.classList.remove('jump-highlight'); }, 3000);
                    }
                    found = true;
                }
            });
            if (!found) showToast('未在账号表中找到 sec_user_id: ' + secUserId, 'warning');
        }, 300);
    }

    async function showTable(tableName, page = 1, keyword = '') {
        currentTable = tableName;
        currentPage = page;
        currentKeyword = keyword;
        // 切换表时重置排序/筛选/搜索范围
        if (typeof currentSortField !== 'undefined' && document.getElementById('table-tabs') &&
            document.getElementById('table-tabs').dataset.lastTable !== tableName) {
            currentSortField = '';
            currentSortOrder = '';
            currentFilters = {};
            currentSearchField = '__text__';
        }
        if (document.getElementById('table-tabs')) {
            document.getElementById('table-tabs').dataset.lastTable = tableName;
        }
        updateTabActive();
        document.getElementById('table-main').style.display = 'flex';
        const validateBtn = document.getElementById('btn-validate-cookie');
        if (validateBtn) validateBtn.style.display = tableName === 'cookie_cache' ? '' : 'none';
        document.getElementById('table-title').textContent = TABLE_NAMES[tableName];
        renderCategoryLegend(tableName);
        document.getElementById('table-count-badge').textContent = '加载中…';
        document.getElementById('pagination').innerHTML = '';
        updateBatchToolbar();

        // schema 缓存：表结构几乎不变，切表不再重复请求
        if (_schemaCache[tableName]) {
            schemaFields = _schemaCache[tableName];
        } else {
            try {
                const sd = await apiCall('/api/database/table/' + tableName + '/schema', 'GET');
                schemaFields = sd.fields || [];
            } catch (e) { schemaFields = []; }
            _schemaCache[tableName] = schemaFields;
        }

        const colDefs = buildColumnDefs(tableName, schemaFields);
        ensureGrid(colDefs);
        restoreColState();
        _renderSearchFieldSelect(tableName, schemaFields);

        const kwSuffix = keyword ? ' · "' + keyword + '"' : '';
        document.getElementById('table-title').textContent = TABLE_NAMES[tableName] + kwSuffix;
        var nFilterConds = Object.keys(currentFilters).filter(function(k) { return currentFilters[k] && currentFilters[k].length; }).length;
        var countBadge = document.getElementById('table-count-badge');
        countBadge.innerHTML = '';
        countBadge.appendChild(document.createTextNode('… 条'));
        if (nFilterConds) {
            var badge = document.createElement('span');
            badge.style.cssText = 'margin-left:8px;font-size:11px;color:var(--accent);cursor:pointer;';
            badge.textContent = '已筛选(' + nFilterConds + ') · 清除';
            badge.addEventListener('click', function() { currentFilters = {}; showTable(currentTable, 1, currentKeyword); });
            countBadge.appendChild(badge);
        }

        // 挂载新数据源：查询条件已变化，旧块缓存随之作废。
        // infinite rowModel 会自动显示 loading / 空数据 overlay，无需手动干预。
        if (gridApi) gridApi.setGridOption('datasource', makeDatasource());
        _renderLoadStatus({ total: null, loaded: 0 });
        updateBatchToolbar();
    }

    // 搜索范围选择器：默认文本字段，按需切到具体字段或全字段
    function _renderSearchFieldSelect(tableName, fields) {
        var sel = document.getElementById('search-field');
        if (!sel) return;
        if (sel.dataset.table !== tableName) {
            var html = '<option value="__text__">文本字段</option>';
            fields.forEach(function(f) {
                if (SYSTEM_FIELDS.includes(f.name)) return;
                var label = FIELD_DISPLAY_NAMES[f.name] || f.name;
                html += '<option value="' + htmlEscape(f.name) + '">' + htmlEscape(label) + '</option>';
            });
            html += '<option value="__all__">全部字段（慢）</option>';
            sel.innerHTML = html;
            sel.dataset.table = tableName;
        }
        sel.value = currentSearchField;
    }

    function onSearchFieldChange(value) {
        currentSearchField = value || '__text__';
        var kw = document.getElementById('search-keyword').value.trim();
        if (kw) showTable(currentTable, 1, kw);
    }

    // =========================================================================
    // 搜索（增强：实时清除按钮 + 防抖）
    // =========================================================================
    function onSearchInput(value) {
        const clearBtn = document.getElementById('search-clear-btn');
        if (clearBtn) clearBtn.style.display = value.trim() ? 'flex' : 'none';

        // Debounced live search
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
            if (value.trim() && value.trim().length >= 2) {
                doSearch(true);
            } else if (!value.trim() && currentKeyword) {
                clearSearch();
            }
        }, 400);
    }

    function doSearch(silent = false) {
        const keyword = document.getElementById('search-keyword').value.trim();
        if (!keyword) { if (!silent) showToast('请输入搜索关键词', 'error'); return; }
        document.getElementById('search-clear-btn').style.display = 'flex';
        showTable(currentTable, 1, keyword);
    }

    function clearSearch() {
        document.getElementById('search-keyword').value = '';
        document.getElementById('search-clear-btn').style.display = 'none';
        if (currentTable && currentKeyword) showTable(currentTable, 1, '');
    }

    // =========================================================================

    async function deleteRecord(tableName, recordId) {
        const ok = await confirmDialog('将永久删除记录 ' + recordId + '，此操作不可撤销。', { title: '删除确认', confirmText: '删除' });
        if (!ok) return;
        try {
            const data = await apiCall('/api/database/table/' + tableName + '/record/' + recordId, 'DELETE');
            if (data.success) { showToast('已删除', 'success'); showTable(tableName, currentPage, currentKeyword); }
            else { showToast(data.message || '删除失败', 'error'); }
        } catch (e) { showToast('删除失败: ' + e.message, 'error'); }

    // 批量操作
    // =========================================================================
    function clearSelection() { if (gridApi) gridApi.deselectAll(); updateBatchToolbar(); }

    /**
     * 将选中的账号行保存为采集方案（弹窗确认：可保存筛选条件或账号列表）。
     */
    var _savePresetSecIds = [];

    function saveSelectionAsPreset() {
        if (!gridApi) return;
        const rows = gridApi.getSelectedRows();
        if (!rows.length) return;
        _savePresetSecIds = rows.map(r => r.sec_user_id).filter(v => v && String(v).trim());
        if (!_savePresetSecIds.length) {
            showToast('选中的行缺少 sec_user_id，无法保存', 'error');
            return;
        }
        openSavePresetModal();
    }

    // 当前表浏览筛选条件 → 采集方案条件的映射（等级/标签/平台）
    function _presetCondition() {
        const fields = Object.keys(currentFilters).filter(function(k) { return currentFilters[k] && currentFilters[k].length; });
        if (!fields.length) return null;
        const field = fields[0];
        const value = String(currentFilters[field][0]).trim();
        if (!value) return null;
        if (field === '等级') {
            const n = parseInt(value);
            if (n >= 1 && n <= 5) return { label: '等级 ≥ ' + n + ' 星', data: { rating_min: n } };
        }
        if (field === '标签') {
            return { label: '标签包含「' + value + '」', data: { tags: value } };
        }
        if (field === '平台') {
            const pmap = { '抖音': 'douyin', 'TikTok': 'tiktok', '小红书': 'xhs', 'tiktok': 'tiktok', 'douyin': 'douyin', 'xhs': 'xhs' };
            const pf = pmap[value];
            if (pf) return { label: '平台 = ' + value, data: { platform: pf } };
        }
        return null;
    }

    function openSavePresetModal() {
        const modal = document.getElementById('save-preset-modal');
        const body = document.getElementById('save-preset-body');
        if (!modal || !body) return;
        const cond = _presetCondition();
        const secCount = _savePresetSecIds.length;
        const defName = cond ? cond.label : ('从表浏览-' + secCount + '个账号');

        let html = '<div class="sp-body">';
        html += '<div class="tbl-form-row"><label class="tbl-form-label">方案名称</label>';
        html += '<input type="text" id="save-preset-name" class="tbl-form-input" value="' + htmlEscape(defName) + '" autocomplete="off"></div>';

        html += '<div class="tbl-form-row" style="align-items:flex-start;"><label class="tbl-form-label" style="padding-top:11px;">保存方式</label>';
        html += '<div style="flex:1;display:flex;flex-direction:column;gap:8px;">';
        if (cond) {
            html += '<label class="save-preset-opt"><input type="radio" name="save-preset-mode" value="condition" checked><span>按筛选条件</span><span class="sp-opt-sub">' + htmlEscape(cond.label) + '</span></label>';
        }
        html += '<label class="save-preset-opt"><input type="radio" name="save-preset-mode" value="accounts"' + (cond ? '' : ' checked') + '><span>按选中账号</span><span class="sp-opt-sub">' + secCount + ' 个</span></label>';
        html += '</div></div>';

        html += '<div class="sp-hint"><i class="ph ph-info"></i><span>' +
            (cond ? '按筛选条件保存更灵活：以后账号有增删会自动适配，不用逐个列举 ID。' : '当前筛选不是等级/标签/平台，无法转成条件，将保存这 ' + secCount + ' 个账号。') +
            '</span></div>';

        html += '<div style="display:flex;gap:8px;justify-content:flex-end;padding-top:2px;">';
        html += '<button class="btn btn-secondary btn-sm" onclick="closeSavePresetModal()">取消</button>';
        html += '<button class="btn btn-primary btn-sm" onclick="confirmSavePreset()">保存方案</button>';
        html += '</div></div>';
        body.innerHTML = html;
        modal.style.display = 'flex';
    }

    function closeSavePresetModal() {
        const modal = document.getElementById('save-preset-modal');
        if (modal) modal.style.display = 'none';
    }

    async function confirmSavePreset() {
        const nameEl = document.getElementById('save-preset-name');
        const name = (nameEl ? nameEl.value : '').trim() || '未命名方案';
        const modeEl = document.querySelector('input[name="save-preset-mode"]:checked');
        const mode = modeEl ? modeEl.value : 'accounts';
        const cond = _presetCondition();

        const payload = {
            name: name,
            rating_min: 1,
            tags: '',
            account_names: '',
            platform: 'douyin',
            mode: 'incremental',
            is_default: false,
        };
        if (mode === 'condition' && cond) {
            Object.assign(payload, cond.data);
        } else {
            payload.account_names = _savePresetSecIds.join(',');
        }

        try {
            const resp = await fetch('/api/collection/presets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await resp.json();
            if (data.success) {
                closeSavePresetModal();
                showToast('已保存方案「' + name + '」', 'success');
            } else {
                showToast('保存失败: ' + (data.message || ''), 'error');
            }
        } catch (e) {
            showToast('网络错误: ' + e.message, 'error');
        }
    }

} else if (field === '解析状态') {

    async function batchDelete() {
        const selectedRows = gridApi.getSelectedRows();
        const ids = selectedRows.map(r => r.record_id || String(r.ID || ''));
        if (!ids.length) return;
        const ok = await confirmDialog('将永久删除选中的 ' + ids.length + ' 条记录，此操作不可撤销。', { title: '删除确认', confirmText: '删除' });
        if (!ok) return;
        try {
            const data = await apiCall('/api/database/batch-delete', 'POST', { table: currentTable, record_ids: ids });
            if (data.success) {
                const d = data.data;
                showToast('删除完成: 成功 ' + d.deleted + ', 失败 ' + d.failed, d.failed ? 'error' : 'success');
                showTable(currentTable, currentPage, currentKeyword);
            } else { showToast(data.data?.errors?.[0] || '删除失败', 'error'); }
        } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
    }

    async function batchUpdate() {
        const selectedRows = gridApi.getSelectedRows();
        const ids = selectedRows.map(r => r.record_id || String(r.ID || ''));
        if (!ids.length) return;
        const field = document.getElementById('batch-field-select').value;
        var value = document.getElementById('batch-value-input').value;
        var field2 = field;
        if (field === '启用') { value = parseInt(value); }
        if (field === '解析状态' || field === '获取状态') { value = value; } // 文本枚举,不需转换
        if (!field) { showToast('请选择字段', 'error'); return; }
        const ok = await confirmDialog('将 ' + ids.length + ' 条记录的「' + field + '」改为「' + value + '」，此操作不可撤销。', { title: '更新确认', confirmText: '更新', danger: false });
        if (!ok) return;
        try {
            const data = await apiCall('/api/database/batch-update', 'POST', { table: currentTable, record_ids: ids, updates: { [field]: value } });
            if (data.success) {
                const d = data.data;
                showToast('更新完成: 成功 ' + d.updated + ', 失败 ' + d.failed, d.failed ? 'error' : 'success');
                document.getElementById('batch-value-input').value = '';
                showTable(currentTable, currentPage, currentKeyword);
            } else { showToast(data.data?.errors?.[0] || '更新失败', 'error'); }
        } catch (e) { showToast('更新失败: ' + e.message, 'error'); }
    }

    // =========================================================================
    // 新增/编辑弹窗
    // =========================================================================
    async function openAddModal(editRecordId = null) {
        if (!currentTable) { showToast('请先选择一张表', 'error'); return; }
        const modal = document.getElementById('add-record-modal');
        const body = document.getElementById('add-modal-body');
        const titleSpan = document.getElementById('add-modal-title');
        titleSpan.textContent = TABLE_NAMES[currentTable] + (editRecordId ? ' · 编辑 ' + editRecordId : '');
        const alwaysReadonly = TABLE_MODAL_ALWAYS_READONLY[currentTable] || [];
        const editReadonly = TABLE_MODAL_READONLY_ON_EDIT[currentTable] || [];
        let html = '<div style="display:flex;flex-direction:column;gap:4px;">';
        schemaFields.forEach(f => {
            if (SYSTEM_FIELDS.includes(f.name)) return;
            const type = (f.type || '').toUpperCase();
            const isBool = type === 'BOOLEAN';
            const isNum = type.includes('INT') || type.includes('REAL') || type.includes('NUM');
            const editor = FIELD_EDITORS[f.name];
            const isReadonly = alwaysReadonly.includes(f.name) || (editRecordId && editReadonly.includes(f.name));
            const disabledAttr = isReadonly ? ' disabled' : '';
            const labelIcon = isReadonly ? ' <i class="ph ph-lock-simple" style="font-size:11px;color:var(--text-muted);"></i>' : '';
            const labelCls = isReadonly ? ' style="color:var(--text-muted);"' : '';
            html += '<div class="tbl-form-row"><label class="tbl-form-label"' + labelCls + '>' + f.name + labelIcon + '</label>';
            if (f.name === 'Cookie') {
                html += '<textarea id="add-field-' + f.name + '" class="tbl-form-input" style="resize: both; min-height: 64px; font-family: var(--font-mono); font-size: 11px;" placeholder="粘贴 Cookie 字符串"' + disabledAttr + '></textarea>';
            } else if (f.name === '标签') {
                html += '<input type="text" id="add-field-' + f.name + '" class="tbl-form-input" placeholder="用逗号分隔，如: 街拍,户外"' + disabledAttr + '>';
            } else if (isBool && f.name !== '解析状态' && f.name !== '获取状态') {
                html += '<input type="checkbox" id="add-field-' + f.name + '" style="flex-shrink:0;width:18px;height:18px;"' + disabledAttr + '>';
            } else if (editor && editor.editor === 'agSelectCellEditor') {
                html += '<select id="add-field-' + f.name + '" class="tbl-form-input"' + disabledAttr + '><option value="">请选择…</option>';
                editor.params.values.forEach(v => { html += '<option value="' + v + '">' + v + '</option>'; });
                html += '</select>';
            } else if (isNum) {
                html += '<input type="number" id="add-field-' + f.name + '" class="tbl-form-input"' + disabledAttr + '>';
            } else {
                html += '<input type="text" id="add-field-' + f.name + '" class="tbl-form-input"' + disabledAttr + '>';
            }
            html += '</div>';
        });
        if (editRecordId) html += '<input type="hidden" id="edit-record-id" value="' + editRecordId + '">';
        html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">';
        html += '<button class="btn btn-secondary btn-sm" onclick="closeAddModal()">取消</button>';
        html += '<button class="btn btn-primary btn-sm" onclick="submitAddRecord()">' + (editRecordId ? '保存修改' : '确认新增') + '</button>';
        html += '</div></div>';
        body.innerHTML = html;
        modal.style.display = 'flex';

        if (editRecordId) {
            const rowNode = gridApi ? gridApi.getRowNode(editRecordId) : null;
            let record = rowNode ? rowNode.data : null;
            if (!record) {
                try {
                    const data = await apiCall('/api/database/table/' + currentTable + '/record/' + editRecordId, 'GET');
                    record = data.record || null;
                } catch (e) { showToast('加载数据失败: ' + e.message, 'error'); }
            }
            if (record) {
                schemaFields.forEach(f => {
                    if (SYSTEM_FIELDS.includes(f.name)) return;
                    const el = document.getElementById('add-field-' + f.name);
                    if (!el) return;
                    const type = (f.type || '').toUpperCase();
                if (type === 'BOOLEAN' && f.name !== '解析状态' && f.name !== '获取状态') el.checked = record[f.name] === true || record[f.name] === 1;
                else if (f.name === '标签') {
                    let tags = record[f.name];
                    if (tags) {
                        if (typeof tags === 'string') { try { tags = JSON.parse(tags); } catch (e) {} }
                        if (Array.isArray(tags)) el.value = tags.join(', ');
                    }
                } else el.value = record[f.name] ?? '';
                });
            }
        }
    }

    function closeAddModal() { document.getElementById('add-record-modal').style.display = 'none'; }

    async function submitAddRecord() {
        const editId = document.getElementById('edit-record-id')?.value;
        const alwaysReadonly = TABLE_MODAL_ALWAYS_READONLY[currentTable] || [];
        const editReadonly = TABLE_MODAL_READONLY_ON_EDIT[currentTable] || [];
        const data = {};
        schemaFields.forEach(f => {
            if (SYSTEM_FIELDS.includes(f.name)) return;
            const el = document.getElementById('add-field-' + f.name);
            if (!el) return;
            if (alwaysReadonly.includes(f.name)) return;
            if (editId && editReadonly.includes(f.name)) return;
            const type = (f.type || '').toUpperCase();
            const editor = FIELD_EDITORS[f.name];
            if (type === 'BOOLEAN' && f.name !== '解析状态' && f.name !== '获取状态') {
                data[f.name] = el.checked ? 1 : 0;
            } else if (f.name === '标签') {
                const tags = el.value.split(',').map(t => t.trim()).filter(Boolean);
                if (tags.length) data[f.name] = JSON.stringify(tags);
            } else if (editor && editor.editor === 'agSelectCellEditor' && f.name === '等级') {
                if (el.value) data[f.name] = parseInt(el.value);
            } else if (el.value.trim()) {
                data[f.name] = el.value.trim();
            }
        });
        if (Object.keys(data).length === 0) { showToast('请至少填写一个字段', 'error'); return; }
        try {
            let result;
            if (editId) result = await apiCall('/api/database/update', 'PUT', { table: currentTable, record_id: editId, data: data });
            else result = await apiCall('/api/database/insert', 'POST', { table: currentTable, data: data });
            if (result.success) {
                showToast(editId ? '保存成功' : '新增成功', 'success');
                closeAddModal();
                showTable(currentTable, currentPage, currentKeyword);
            } else { showToast(result.message || '操作失败', 'error'); }
        } catch (e) { showToast('操作失败: ' + e.message, 'error'); }
    }

    // =========================================================================
    // 查重
    // =========================================================================
    async function checkDuplicates() {
        if (!currentTable) { showToast('请先选择一张表', 'error'); return; }
        const modal = document.getElementById('duplicates-modal');
        const body = document.getElementById('duplicates-modal-body');
        const titleSpan = document.getElementById('dup-modal-table-name');
        titleSpan.textContent = TABLE_NAMES[currentTable];
        body.innerHTML = '<div style="text-align:center;padding:40px;"><i class="ph ph-circle-notch" style="font-size:24px;animation:spin 1s linear infinite;display:inline-block;color:var(--accent);"></i> <span style="color:var(--text-muted);">检测中…</span></div>';
        modal.style.display = 'flex';
        try {
            const data = await apiCall('/api/database/duplicates/' + currentTable, 'GET');
            const dups = data.data || [];
            if (!dups.length) {
                body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--success);font-size:16px;"><i class="ph ph-check-circle" style="font-size:32px;display:block;margin-bottom:8px;"></i>未发现重复记录</div>';
                return;
            }
            let html = '<div style="margin-bottom:12px;padding:12px;background:var(--warning-light);border-radius:var(--radius);font-size:13px;color:var(--warning-text);border:1px solid var(--warning);">';
            html += '发现 <b>' + dups.length + '</b> 组重复, 共 <b>' + dups.reduce((s, d) => s + d.count, 0) + '</b> 条。建议保留最新的一条。</div>';
            const bkl = { share_cache: 'share_code', account_cache: 'sec_user_id', cookie_cache: 'Cookie' }[currentTable] || '业务键';
            dups.forEach((dup, idx) => {
                html += '<div style="margin-bottom:12px;padding:12px;background:var(--bg-muted);border-radius:var(--radius);border-left:4px solid var(--warning);border:1px solid var(--border-default);">';
                html += '<div style="font-weight:600;margin-bottom:8px;font-size:13px;font-family:var(--font-mono);">#' + (idx + 1) + ' ' + bkl + ': ' + dup.business_key + ' (' + dup.count + ' 条)</div>';
                html += '<table class="tbl"><thead><tr><th style="width:40px;">选</th>';
                const cols = Object.keys(dup.records[0]).filter(c => !['is_deleted', 'deleted_at', 'local_created_at', 'local_updated_at'].includes(c));
                cols.forEach(c => html += '<th>' + c + '</th>');
                html += '</tr></thead><tbody>';
                dup.records.forEach(rec => {
                    const rid = rec['record_id'] || rec['ID'] || '';
                    html += '<tr><td style="text-align:center;"><input type="checkbox" value="' + rid + '" class="dup-checkbox"></td>';
                    cols.forEach(c => {
                        let v = rec[c];
                        if (v === null || v === undefined) v = '-';
                        else if (typeof v === 'object') v = JSON.stringify(v);
                        if (String(v).length > 40) v = String(v).substring(0, 40) + '…';
                        html += '<td>' + v + '</td>';
                    });
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
            });
            html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">';
            html += '<button class="btn btn-danger btn-sm" onclick="deleteDuplicateRecords()"><i class="ph ph-trash"></i> 删除选中</button>';
            html += '</div>';
            body.innerHTML = html;
        } catch (e) { body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger);">检测失败: ' + e.message + '</div>'; }
    }

    async function deleteDuplicateRecords() {
        const cbs = document.querySelectorAll('.dup-checkbox:checked');
        const ids = Array.from(cbs).map(cb => cb.value);
        if (!ids.length) { showToast('请选择要删除的记录', 'error'); return; }
        const ok = await confirmDialog('将永久删除选中的 ' + ids.length + ' 条记录，此操作不可撤销。', { title: '删除确认', confirmText: '删除' });
        if (!ok) return;
        try {
            const data = await apiCall('/api/database/batch-delete', 'POST', { table: currentTable, record_ids: ids });
            if (data.success) { showToast('删除完成: 成功 ' + data.data.deleted, 'success'); checkDuplicates(); }
            else { showToast('删除失败', 'error'); }
        } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
    }

    function closeDuplicatesModal() { document.getElementById('duplicates-modal').style.display = 'none'; }

    // =========================================================================
    // 导入/导出
    // =========================================================================
    async function exportCsv(ev) {
        if (!currentTable) { showToast('请先选择一张表', 'error'); return; }
        const btn = ev ? ev.target.closest('button') : null;
        const originalText = btn ? btn.innerHTML : '导出';
        const scope = currentKeyword ? '（"' + currentKeyword + '"）' : '';
        const countInfo = currentTotal > 0 ? '共 ' + currentTotal + ' 条' : '全部数据';
        const ok = await confirmDialog('导出 ' + TABLE_NAMES[currentTable] + ' ' + scope + '？' + countInfo + '，下载为 CSV。', { title: '导出确认', confirmText: '导出', danger: false });
        if (!ok) return;
        let url = '/api/database/table/' + currentTable + '/export';
        var exportParams = [];
        if (currentKeyword) {
            exportParams.push('search=' + encodeURIComponent(currentKeyword));
            if (currentSearchField && currentSearchField !== '__all__') {
                var f = currentSearchField === '__text__'
                    ? (TEXT_SEARCH_FIELDS[currentTable] || []).join(',')
                    : currentSearchField;
                if (f) exportParams.push('search_field=' + encodeURIComponent(f));
            }
        }
        var exportKeys = Object.keys(currentFilters).filter(function(k) { return currentFilters[k] && currentFilters[k].length; });
        if (exportKeys.length) {
            var exportArr = exportKeys.map(function(k) { return { field: k, values: currentFilters[k] }; });
            exportParams.push('filters=' + encodeURIComponent(JSON.stringify(exportArr)));
        }
        if (exportParams.length) url += '?' + exportParams.join('&');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ph ph-circle-notch" style="animation:spin 0.8s linear infinite;"></i>'; }
        try {
            const resp = await fetch(url);
            if (!resp.ok) { let msg = 'HTTP ' + resp.status; try { const e = await resp.json(); msg = e.message || msg; } catch (_) { } throw new Error(msg); }
            const blob = await resp.blob();
            const cd = resp.headers.get('Content-Disposition') || '';
            const m = cd.match(/filename="?([^"]+)"?/);
            const filename = m ? m[1] : currentTable + '.csv';
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            const size = blob.size;
            const sizeText = size > 1024 * 1024 ? (size / 1024 / 1024).toFixed(2) + ' MB' : size > 1024 ? (size / 1024).toFixed(1) + ' KB' : size + ' B';
            showToast('已导出 - ' + sizeText, 'success');
        } catch (e) { showToast('导出失败: ' + e.message, 'error'); }
        finally { if (btn) { btn.disabled = false; btn.innerHTML = originalText; } }
    }

    function importCsv() {
        if (!currentTable) { showToast('请先选择一张表', 'error'); return; }
        const input = document.getElementById('import-file-input');
        input.value = ''; input.onchange = handleImportFile; input.click();
    }

    async function handleImportFile(ev) {
        const file = ev.target.files[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.csv')) { showToast('请上传 CSV 文件', 'error'); return; }
        pendingImportFile = file;
        const fd = new FormData(); fd.append('file', file);
        try {
            const resp = await fetch('/api/database/table/' + currentTable + '/import/preview', { method: 'POST', body: fd });
            const data = await resp.json();
            if (!data.success) { showToast(data.message || '预览失败', 'error'); return; }
            showImportPreview(data);
        } catch (e) { showToast('预览失败: ' + e.message, 'error'); }
    }

    function showImportPreview(data) {
        const body = document.getElementById('import-modal-body');
        const fields = data.fields || [];
        const preview = data.preview || [];
        const errors = data.errors || [];
        let html = '<div style="margin-bottom:16px;padding:12px;background:var(--bg-muted);border-radius:var(--radius);border:1px solid var(--border-default);">';
        html += '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-family:var(--font-mono);">';
        html += '<span>总计 <b style="color:var(--text-primary);">' + data.total + '</b></span><span style="color:var(--success);">新增 <b>' + data.new + '</b></span>';
        html += '<span style="color:var(--text-muted);">跳过 <b>' + data.skipped + '</b></span>';
        if (errors.length) html += '<span style="color:var(--danger);">错误 <b>' + errors.length + '</b></span>';
        html += '</div></div>';
        if (errors.length) {
            html += '<div style="margin-bottom:12px;color:var(--danger);font-size:12px;max-height:120px;overflow-y:auto;border:1px solid var(--danger);background:var(--danger-light);padding:8px;border-radius:var(--radius-sm);font-family:var(--font-mono);">';
            errors.forEach(e => html += '<div>' + e + '</div>');
            html += '</div>';
        }
        if (preview.length) {
            html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">前 ' + preview.length + ' 行预览:</div>';
            html += '<div style="overflow-x:auto;border:1px solid var(--border-default);border-radius:var(--radius-sm);"><table class="tbl"><thead><tr>';
            fields.forEach(f => html += '<th>' + f + '</th>');
            html += '</tr></thead><tbody>';
            preview.forEach(row => {
                html += '<tr>';
                fields.forEach(f => {
                    let v = row[f];
                    if (v === null || v === undefined) v = '';
                    if (typeof v === 'object') v = JSON.stringify(v);
                    const disp = String(v).length > 40 ? String(v).substring(0, 40) + '…' : v;
                    html += '<td>' + disp + '</td>';
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
        }
        html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">';
        html += '<button class="btn btn-secondary btn-sm" onclick="closeImportModal()">取消</button>';
        html += data.new > 0 ? '<button class="btn btn-primary btn-sm" onclick="confirmImport()"><i class="ph ph-check"></i> 确认导入（' + data.new + ' 条）</button>' : '<button class="btn btn-primary btn-sm" disabled>无可导入数据</button>';
        html += '</div>';
        body.innerHTML = html;
        document.getElementById('import-modal').style.display = 'flex';
    }

    function closeImportModal() { document.getElementById('import-modal').style.display = 'none'; pendingImportFile = null; }

    async function confirmImport() {
        if (!pendingImportFile) { showToast('文件已失效', 'error'); closeImportModal(); return; }
        const fd = new FormData(); fd.append('file', pendingImportFile);
        try {
            const resp = await fetch('/api/database/table/' + currentTable + '/import/confirm', { method: 'POST', body: fd });
            const data = await resp.json();
            if (data.success) { showToast('导入完成: 新增 ' + data.created + ', 跳过 ' + data.skipped + ', 失败 ' + data.failed, data.failed ? 'error' : 'success'); closeImportModal(); showTable(currentTable, 1, ''); }
            else { showToast(data.message || '导入失败', 'error'); }
        } catch (e) { showToast('导入失败: ' + e.message, 'error'); }
    }

    // =========================================================================
    // Cookie 验证
    // =========================================================================
    async function validateCookies() {
        const btn = document.getElementById('btn-validate-cookie');
        const resultDiv = document.getElementById('cookie-validate-result');
        const logDiv = document.getElementById('cookie-validate-log');
        const barDiv = document.getElementById('cookie-validate-bar');
        const statsDiv = document.getElementById('cookie-validate-stats');
        btn.disabled = true; btn.innerHTML = '<i class="ph ph-circle-notch" style="animation:spin 0.8s linear infinite;"></i> 验证中…';
        resultDiv.style.display = 'block'; logDiv.innerHTML = ''; barDiv.style.width = '0%'; statsDiv.textContent = '';
        function addLog(text, level) {
            const colors = { ok: 'var(--success)', error: 'var(--danger)', info: 'var(--info)' };
            const div = document.createElement('div');
            div.style.color = colors[level] || 'var(--text-secondary)';
            div.style.padding = '3px 0'; div.textContent = text;
            logDiv.appendChild(div); logDiv.scrollTop = logDiv.scrollHeight;
        }
        try {
            const resp = await fetch('/api/cookies/validate', { method: 'POST' });
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n'); buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    let data; try { data = JSON.parse(line.slice(6)); } catch { continue; }
                    if (data.type === 'start') addLog('开始验证 ' + (data.total || 0) + ' 个 Cookie…', 'info');
                    else if (data.type === 'progress') addLog(data.message, 'info');
                    else if (data.type === 'log') addLog(data.message, data.level);
                    else if (data.type === 'stats') {
                        const pct = data.total > 0 ? ((data.valid + data.invalid) / data.total * 100) : 0;
                        barDiv.style.width = pct + '%';
                        statsDiv.textContent = '有效: ' + data.valid + ' / 失效: ' + data.invalid + ' / 共: ' + data.total;
                    } else if (data.type === 'complete') {
                        barDiv.style.width = '100%';
                        barDiv.style.background = data.success ? 'var(--success)' : 'var(--danger)';
                        statsDiv.textContent = data.message;
                        addLog(data.message, data.success ? 'ok' : 'error');
                        showTable('cookie_cache', currentPage, currentKeyword);
                    }
                }
            }
        } catch (e) { addLog('验证请求失败: ' + e.message, 'error'); }
        finally { btn.disabled = false; btn.innerHTML = '<i class="ph ph-shield-check"></i> 验证Cookie'; }
    }
</script>
