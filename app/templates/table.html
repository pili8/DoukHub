{% extends "base.html" %}
{% block title %}表浏览 - DoukHub{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/vendor/ag-grid/styles/ag-grid.css">
<link rel="stylesheet" href="/static/vendor/ag-grid/styles/ag-theme-quartz.css">

<div class="page-header">
    <h2>表浏览</h2>
    <div class="page-header-actions">
        <button class="btn btn-secondary btn-sm" onclick="showTable(currentTable, currentPage, currentKeyword)"><i class="ph ph-arrow-clockwise"></i> 刷新</button>
    </div>
</div>

<!-- 工具栏：表选择 + 搜索 -->
<div class="card tbl-toolbar-card">
    <div class="tbl-toolbar-row">
        <div id="table-tabs" class="tbl-tabs"></div>
<div class="tbl-search-group">
                <select id="search-field" class="tbl-search-field" onchange="onSearchFieldChange(this.value)" title="搜索范围：默认只搜文本字段，全字段搜索较慢"></select>
                <div class="tbl-search-wrapper">
                    <i class="ph ph-magnifying-glass tbl-search-icon"></i>
                    <input type="text" id="search-keyword" class="tbl-search-input" placeholder="输入以搜索当前表…" oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter')doSearch()">
                    <button class="tbl-search-clear" id="search-clear-btn" onclick="clearSearch()" style="display:none;"><i class="ph ph-x"></i></button>
                </div>
            </div>
    </div>
</div>

<!-- 主内容区 -->
<div id="table-main" class="tbl-main" style="display:none;">
    <!-- 内容工具栏 -->
    <div class="tbl-content-toolbar">
        <div class="tbl-title-group">
            <h4 id="table-title" class="tbl-content-title">-</h4>
            <span id="table-count-badge" class="tbl-count-badge"></span>
            <span id="tbl-cat-legend" class="tbl-cat-legend"></span>
        </div>
        <div class="tbl-action-group">
            <div class="tbl-action-normal" id="action-normal">
                <button class="btn btn-success btn-sm" onclick="openAddModal()" id="btn-add-record"><i class="ph ph-plus"></i> 新增</button>
                <button class="btn btn-secondary btn-sm" onclick="checkDuplicates()" id="btn-duplicates"><i class="ph ph-copy"></i> 查重</button>
                <button class="btn btn-secondary btn-sm" onclick="validateCookies()" id="btn-validate-cookie" style="display:none;"><i class="ph ph-shield-check"></i> 验证Cookie</button>
                <div class="tbl-divider-v"></div>
                <button class="btn btn-secondary btn-sm" onclick="importCsv()"><i class="ph ph-upload-simple"></i> 导入</button>
                <button class="btn btn-secondary btn-sm" onclick="exportCsv()"><i class="ph ph-download-simple"></i> 导出</button>
            </div>
            <div id="batch-toolbar" class="tbl-batch-inline" style="display:none;">
                <span id="batch-count" class="tbl-batch-count"></span>
                <div class="tbl-divider-v"></div>
                <button class="btn btn-danger btn-sm" onclick="batchDelete()"><i class="ph ph-trash"></i> 批量删除</button>
                <div class="tbl-batch-edit">
                    <select id="batch-field-select" class="tbl-batch-select" onchange="updateBatchValueInput()"></select>
                    <span id="batch-value-container"><input type="text" id="batch-value-input" class="tbl-batch-input" placeholder="值…"></span>
                    <button class="btn btn-primary btn-sm" onclick="batchUpdate()"><i class="ph ph-pencil-simple"></i> 应用</button>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="saveSelectionAsPreset()" id="btn-save-preset" style="display:none;"><i class="ph ph-floppy-disk"></i> 存为方案</button>
                <button class="btn btn-secondary btn-sm tbl-batch-close" onclick="clearSelection()"><i class="ph ph-x"></i></button>
            </div>
        </div>
    </div>

    <!-- AG Grid 表格 -->
    <div class="card tbl-data-card">
        <div id="ag-grid-container" class="ag-theme-quartz tbl-grid"></div>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="tbl-pagination"></div>

    <!-- 隐藏文件输入 -->
    <input type="file" id="import-file-input" accept=".csv" style="display:none;">

    <!-- Cookie 验证结果 -->
    <div id="cookie-validate-result" class="tbl-cookie-result">
        <div class="tbl-cookie-header">
            <h4 class="tbl-cookie-title"><i class="ph ph-shield-check"></i> Cookie 验证结果</h4>
            <span id="cookie-validate-stats" class="tbl-cookie-stats"></span>
        </div>
        <div class="progress-bar-container" style="margin-bottom:12px;">
            <div id="cookie-validate-bar" class="progress-bar" style="width:0%;"></div>
        </div>
        <div id="cookie-validate-log" class="tbl-cookie-log"></div>
    </div>
</div>

<!-- 弹窗 -->
<div id="import-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:700px;">
        <div class="modal-header"><h3><i class="ph ph-upload-simple"></i> 导入预览</h3><button onclick="closeImportModal()" class="modal-close"><i class="ph ph-x"></i></button></div>
        <div id="import-modal-body"></div>
    </div>
</div>

<div id="add-record-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:600px;">
        <div class="modal-header"><h3><i class="ph ph-plus-circle"></i> <span id="add-modal-title">新增记录</span></h3><button onclick="closeAddModal()" class="modal-close"><i class="ph ph-x"></i></button></div>
        <div id="add-modal-body"></div>
    </div>
</div>

<div id="duplicates-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:800px;">
        <div class="modal-header"><h3><i class="ph ph-copy"></i> 重复记录检测 - <span id="dup-modal-table-name"></span></h3><button onclick="closeDuplicatesModal()" class="modal-close"><i class="ph ph-x"></i></button></div>
        <div id="duplicates-modal-body"></div>
    </div>
</div>

<div id="save-preset-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:480px;">
        <div class="modal-header"><h3><i class="ph ph-floppy-disk"></i> 保存为采集方案</h3><button onclick="closeSavePresetModal()" class="modal-close"><i class="ph ph-x"></i></button></div>
        <div id="save-preset-body"></div>
    </div>
</div>

<style>
/* =========================================================================
   表浏览页面 — Obsidian 主题增强表格交互
   ========================================================================= */

/* ===== 工具栏卡片 ===== */
.tbl-toolbar-card { padding: 10px 14px !important; }
.tbl-toolbar-row {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}

/* ===== 表选择 Tab ===== */
/* 横向滚动:表多时不再折行堆叠,超出部分滚动查看 */
.tbl-tabs {
    display: flex; gap: 2px; flex-wrap: nowrap;
    overflow-x: auto;
    padding: 3px;
    background: var(--surface-raised);
    border-radius: var(--radius);
    border: 1px solid var(--border-default);
    scrollbar-width: thin;
    scrollbar-color: var(--border-default) transparent;
}
.tbl-tabs::-webkit-scrollbar { height: 6px; }
.tbl-tabs::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
.tbl-tabs::-webkit-scrollbar-track { background: transparent; }
.tab-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    transition: all var(--transition);
    white-space: nowrap;
    font-family: inherit;
}
.tab-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}
.tab-btn.active {
    background: var(--accent);
    color: var(--text-on-accent, #fff);
    box-shadow: var(--shadow-xs);
    font-weight: 600;
}
/* 选中态图标统一用背景高对比色,避免各自颜色在 accent 背景上看不清 */
.tab-btn.active .tab-icon {
    color: var(--text-on-accent, #0A0B0F) !important;
}
.tab-btn .tab-icon { font-size: 15px; transition: transform var(--transition-fast); }
.tab-btn:hover .tab-icon { transform: scale(1.15); }

/* ===== 搜索框 ===== */
.tbl-search-group { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.tbl-search-wrapper { position: relative; display: flex; align-items: center; }
.tbl-search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; color: var(--text-muted);
    pointer-events: none;
    transition: color var(--transition-fast);
}
.tbl-search-input {
    padding: 7px 32px 7px 34px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    min-width: 220px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 13px;
    font-family: inherit;
    transition: all var(--transition);
}
.tbl-search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}
.tbl-search-input:focus + .tbl-search-icon,
.tbl-search-wrapper:focus-within .tbl-search-icon {
    color: var(--accent);
}
.tbl-search-input::placeholder { color: var(--text-muted); }
.tbl-search-clear {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    background: var(--bg-hover); border: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-muted);
    font-size: 11px;
    transition: all var(--transition-fast);
}
.tbl-search-clear:hover { background: var(--danger); color: #fff; }

/* ===== 主内容区 ===== */
/* 页面主容器铺满视口,表格弹性占满剩余空间 */
.main {
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
/* 页头/工具栏固定高度不收缩,只有表格弹性伸缩 */
.main .page-header,
.main .tbl-toolbar-card,
.main .tbl-content-toolbar,
.main #pagination {
    flex-shrink: 0;
}
.tbl-main {
    animation: tbl-fade-in 300ms cubic-bezier(0.16, 1, 0.3, 1);
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
@keyframes tbl-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== 内容工具栏 ===== */
.tbl-content-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
}
.tbl-title-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tbl-content-title {
    margin: 0; font-size: 15px; font-weight: 600;
    font-family: var(--font-display);
    color: var(--text-primary);
    letter-spacing: -0.01em;
}
.tbl-count-badge {
    display: inline-flex; align-items: center;
    font-size: 11px; font-weight: 600;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    background: var(--accent-light);
    color: var(--accent-text);
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
}
.tbl-action-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tbl-divider-v { width: 1px; height: 20px; background: var(--border-default); }

/* ===== 批量操作(并入工具栏) ===== */
.tbl-action-normal,
.tbl-batch-inline {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.tbl-batch-inline {
    padding: 6px 10px;
    background: var(--accent-light);
    border: 1px solid var(--accent);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
}
.tbl-batch-count {
    font-size: 13px; color: var(--accent); font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
}
.tbl-batch-select {
    padding: 5px 10px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xs);
    font-size: 12px;
    background: var(--bg-input);
    color: var(--text-primary);
    cursor: pointer;
    font-family: inherit;
}
.tbl-batch-input {
    padding: 5px 10px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xs);
    font-size: 12px; width: 110px;
    background: var(--bg-input);
    color: var(--text-primary);
    font-family: inherit;
    transition: border-color var(--transition-fast);
}
.tbl-batch-input:focus {
    outline: none;
    border-color: var(--accent);
}
.tbl-batch-edit { display: flex; gap: 6px; align-items: center; }
.tbl-batch-close { margin-left: auto; }

/* ===== AG Grid 容器 ===== */
.tbl-data-card {
    padding: 0 !important;
    overflow: hidden;
    border-radius: var(--radius-lg) !important;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.tbl-grid {
    width: 100%;
    flex: 1;
    min-height: 0;
}

/* ===== AG Grid Obsidian 主题覆盖 ===== */
.ag-theme-quartz {
    --ag-background-color: var(--bg-base);
    --ag-foreground-color: var(--text-primary);
    --ag-header-background-color: var(--surface-raised);
    --ag-header-foreground-color: var(--text-secondary);
    --ag-odd-row-background-color: rgba(31, 27, 23, 0.022);
    --ag-row-hover-color: var(--bg-hover);
    --ag-selected-row-background-color: var(--accent-light);
    --ag-border-color: var(--border-default);
    --ag-row-border-color: var(--border-default);
    --ag-header-column-resize-handle-color: var(--border-default);
    --ag-font-family: var(--font-sans);
    --ag-font-size: 13px;
    --ag-cell-horizontal-padding: 10px;
    --ag-header-height: 42px;
    --ag-row-height: 40px;
    --ag-border-radius: 0;
    --ag-wrapper-border-radius: 0;
    --ag-header-column-separator-display: block;
    --ag-header-column-separator-height: 100%;
    --ag-header-column-separator-width: 1px;
    --ag-header-column-separator-color: var(--border-default);
    --ag-borders: none;
    --ag-cell-widget-spacing: 8px;
    --ag-input-focus-border-color: var(--accent);
    --ag-checkbox-checked-color: var(--accent);
    --ag-range-selection-border-color: var(--accent);
    --ag-active-color: var(--accent);
    --ag-invalid-color: var(--danger);
    --ag-input-border-color: var(--border-default);
    --ag-input-border-color-invalid: var(--danger);
    --ag-modal-overlay-background-color: rgba(0,0,0,0.6);
    --ag-menu-background-color: var(--surface-raised);
    --ag-menu-border-color: var(--border-default);
    --ag-item-active-color: var(--menu-hover);
}

/* ===== 搜索范围选择器 ===== */
.tbl-search-field {
    padding: 7px 8px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    max-width: 150px;
    transition: border-color var(--transition-fast);
}
.tbl-search-field:focus { outline: none; border-color: var(--accent); }

/* ===== 加载状态条（替代分页条） ===== */
.tbl-load-status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 2px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono, monospace);
}
/* 计数做成胶囊，数字用等宽对齐不跳动 */
.tbl-load-status > span:first-child {
    padding: 3px 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-full);
    color: var(--text-secondary);
}
.tbl-load-status .ls-total {
    color: var(--text-primary); font-weight: 700;
    font-variant-numeric: tabular-nums;
}
.tbl-load-status .ls-spinner {
    display: none;
    align-items: center;
    gap: 6px;
    color: var(--accent);
}
.tbl-load-status.loading .ls-spinner,
#pagination.loading .ls-spinner { display: inline-flex; }
.tbl-load-status .ls-top {
    margin-left: auto;
    border: 1px solid var(--border-default);
    background: var(--bg-input);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    transition: all var(--transition-fast);
}
.tbl-load-status .ls-top:hover {
    border-color: var(--accent);
    color: var(--accent);
}

/* AG Grid 头部样式：去全大写（中文无效、英文显吵），走正文同族字号 */
.ag-theme-quartz .ag-header-cell-label {
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.01em;
    color: var(--text-secondary);
}
.ag-theme-quartz .ag-header-cell { padding-left: 2px; padding-right: 2px; }
.ag-theme-quartz .ag-header-row { border-bottom: 1px solid var(--border-default); }

/* ===== 表头筛选按钮：悬浮于列头右侧，不占标题空间 ===== */
.tbl-header-menu-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    pointer-events: auto;
    opacity: 0;
    transition: opacity .12s, color .12s, background-color .12s;
}
.ag-header-cell:hover .tbl-header-menu-btn,
.ag-header-cell:focus-within .tbl-header-menu-btn { opacity: 1; }
.tbl-header-menu-btn:hover {
    background: var(--accent-light);
    color: var(--accent) !important;
}
/* 该列已有排序/筛选：胶囊常驻，一眼可辨 */
.tbl-header-menu-btn.is-active {
    opacity: 1;
    background: var(--accent-light);
    color: var(--accent) !important;
}
/* 已筛选角标：右上角实心小圆点 */
.tbl-header-menu-btn.has-filter::after {
    content: '';
    position: absolute; top: -2px; right: -2px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--bg-surface);
}
.tbl-header-menu-btn svg { display: block; }

/* ===== 筛选弹窗 ===== */
.tbl-filter-popup {
    position: fixed;
    z-index: 20000;
    width: 252px;
    padding: 0;
    background: var(--bg-surface);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    color: var(--text-primary);
    font-size: 13px;
    overflow: hidden;
    animation: tbl-menu-in 130ms cubic-bezier(0.2, 0, 0, 1);
    user-select: none;
}
/* 头部：字段名 + 关闭 */
.tbl-filter-popup .fp-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 8px 8px 12px;
}
.tbl-filter-popup .fp-title {
    flex: 1; min-width: 0;
    font-size: 12px; font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: .01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tbl-filter-popup .fp-close {
    width: 22px; height: 22px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; border-radius: var(--radius-xs);
    color: var(--text-muted); cursor: pointer; font-size: 14px;
    font-family: inherit; line-height: 1;
    transition: background .12s, color .12s;
}
.tbl-filter-popup .fp-close:hover { background: var(--danger-light); color: var(--danger-text); }
/* 排序：分段控件（与页面 tabs / task-tabs 同一套视觉） */
.tbl-filter-popup .fp-seg {
    display: flex; gap: 3px;
    margin: 0 10px 10px;
    padding: 3px;
    background: var(--bg-muted);
    border-radius: var(--radius-sm);
}
.tbl-filter-popup .fp-seg-btn {
    flex: 1; height: 26px;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    border: none; border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px; font-weight: 500; font-family: inherit;
    cursor: pointer;
    transition: background .12s, color .12s, box-shadow .12s;
}
.tbl-filter-popup .fp-seg-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.tbl-filter-popup .fp-seg-btn.active {
    background: var(--accent); color: var(--text-on-accent);
    font-weight: 600; box-shadow: var(--shadow-xs);
}
.tbl-filter-popup .fp-seg-btn .fp-arrow { font-weight: 700; }
/* 值检索 */
.tbl-filter-popup .fp-search-wrap {
    position: relative;
    display: flex; align-items: center;
    margin: 0 10px 8px;
}
.tbl-filter-popup .fp-search-wrap > i {
    position: absolute; left: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px; color: var(--text-muted); pointer-events: none;
}
.tbl-filter-popup .fp-search {
    width: 100%; box-sizing: border-box;
    padding: 6px 8px 6px 26px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    font-size: 12px; background: var(--bg-input); color: var(--text-primary);
    font-family: inherit; outline: none;
    transition: border-color .12s, box-shadow .12s;
}
.tbl-filter-popup .fp-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}
.tbl-filter-popup .fp-search::placeholder { color: var(--text-muted); }
/* 全选 + 已选计数 */
.tbl-filter-popup .fp-meta {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 6px;
    padding: 0 12px 6px;
    border-bottom: 1px solid var(--border-default);
}
.tbl-filter-popup .fp-all {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--text-secondary);
    cursor: pointer;
}
.tbl-filter-popup .fp-all:hover { color: var(--accent); }
.tbl-filter-popup .fp-count {
    margin-left: auto;
    font-size: 11px; font-weight: 600;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
}
/* 值列表 */
.tbl-filter-popup .fp-list {
    max-height: 216px; overflow-y: auto;
    padding: 0 6px 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
}
.tbl-filter-popup .fp-list::-webkit-scrollbar { width: 8px; }
.tbl-filter-popup .fp-list::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 4px;
    border: 2px solid var(--bg-surface);
}
.tbl-filter-popup .fp-list::-webkit-scrollbar-track { background: transparent; }
.tbl-filter-popup .fp-opt {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; cursor: pointer;
    border-radius: var(--radius-sm); font-size: 12.5px;
    color: var(--text-primary);
    transition: background .1s, color .1s;
}
.tbl-filter-popup .fp-opt:hover { background: var(--bg-hover); }
.tbl-filter-popup .fp-opt:has(input:checked) {
    background: var(--accent-light);
    color: var(--accent-text);
    font-weight: 600;
}
/* 自绘复选框：蓝底白勾，跟随主题 */
.tbl-filter-popup .fp-opt input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    position: relative;
    width: 15px; height: 15px; flex-shrink: 0; margin: 0;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px;
    background: var(--bg-input);
    cursor: pointer;
    transition: background .12s, border-color .12s;
}
.tbl-filter-popup .fp-opt input[type="checkbox"]:hover { border-color: var(--accent); }
.tbl-filter-popup .fp-opt input[type="checkbox"]:checked {
    background: var(--accent); border-color: var(--accent);
}
.tbl-filter-popup .fp-opt input[type="checkbox"]:checked::after {
    content: '';
    position: absolute; left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid var(--text-on-accent);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
}
.tbl-filter-popup .fp-opt input[type="checkbox"]:focus-visible {
    box-shadow: 0 0 0 3px var(--accent-light);
}
.tbl-filter-popup .fp-opt span {
    flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}
/* 底部操作：清除靠左，取消/确定靠右 */
.tbl-filter-popup .fp-footer {
    display: flex; gap: 6px; align-items: center;
    padding: 8px 10px;
    border-top: 1px solid var(--border-default);
    background: var(--bg-muted);
}
.tbl-filter-popup .fp-footer .fp-clear {
    margin-right: auto;
    border-color: transparent;
    background: transparent;
    color: var(--danger-text);
}
.tbl-filter-popup .fp-footer .fp-clear:hover { background: var(--danger-light); }
.tbl-filter-popup .fp-footer .btn { padding: 5px 14px; font-size: 12px; }
.fp-empty-hint {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
    padding: 20px 8px; text-align: center;
}
.fp-empty-hint i { font-size: 18px; opacity: .45; }

/* 条件式筛选面板（金山多维表风格） */
.tbl-filter-popup .fp-mode-row {
    display: flex; align-items: center; gap: 6px;
    margin: 8px 0 8px;
}
.tbl-filter-popup .fp-mode-label { font-size: 12px; color: var(--text-muted); }
.tbl-filter-popup .fp-mode-btn {
    border: 1px solid var(--border-default); background: var(--bg-input);
    color: var(--text-primary); font-size: 12px; padding: 2px 12px;
    border-radius: var(--radius-xs); cursor: pointer;
}
.tbl-filter-popup .fp-mode-btn.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
}
.tbl-filter-popup .fp-conds {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px;
}
.tbl-filter-popup .fp-cond {
    border: 1px solid var(--border-default); border-radius: var(--radius-xs);
    padding: 6px; background: var(--bg-base);
}
.tbl-filter-popup .fp-cond-l1 { display: flex; align-items: center; gap: 6px; }
.tbl-filter-popup .fp-fsel { flex: 1.1; min-width: 0; }
.tbl-filter-popup .fp-opsel { flex: 1; min-width: 0; }
.tbl-filter-popup .fp-del {
    border: none; background: transparent; color: var(--text-muted);
    font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
}
.tbl-filter-popup .fp-del:hover { color: var(--danger); }
.tbl-filter-popup .fp-cond-l2 { margin-top: 6px; }
.tbl-filter-popup .fp-sel {
    padding: 4px 6px; border: 1px solid var(--border-default); border-radius: var(--radius-xs);
    font-size: 12px; background: var(--bg-input); color: var(--text-primary);
}
.tbl-filter-popup .fp-range { display: flex; align-items: center; gap: 6px; }
.tbl-filter-popup .fp-tilde { color: var(--text-muted); }
.tbl-filter-popup .fp-text-inp {
    flex: 1; min-width: 0; padding: 4px 8px;
    border: 1px solid var(--border-default); border-radius: var(--radius-xs);
    font-size: 12px; background: var(--bg-input); color: var(--text-primary);
    font-family: inherit; outline: none;
}
.tbl-filter-popup .fp-text-inp:focus { border-color: var(--accent); }
.tbl-filter-popup .fp-noval { font-size: 12px; color: var(--text-muted); }
.tbl-filter-popup .fp-add-cond {
    width: 100%; border: 1px dashed var(--border-default); background: transparent;
    color: var(--text-secondary); font-size: 12px; padding: 6px;
    border-radius: var(--radius-xs); cursor: pointer; margin-bottom: 8px;
}
.tbl-filter-popup .fp-add-cond:hover { border-color: var(--accent); color: var(--accent); }
.tbl-filter-popup .fp-val-btn {
    width: 100%; text-align: left; padding: 4px 8px;
    border: 1px solid var(--border-default); border-radius: var(--radius-xs);
    background: var(--bg-input); color: var(--text-primary);
    font-size: 12px; cursor: pointer;
}
.tbl-filter-popup .fp-val-btn:hover { border-color: var(--accent); }
.tbl-filter-popup .fp-countlist {
    border: 1px solid var(--border-default); border-radius: var(--radius-xs);
    margin-top: 6px; background: var(--bg-input); padding: 6px;
}
.tbl-filter-popup .fp-cnt {
    margin-left: auto; font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
}
@keyframes tbl-menu-in {
    from { opacity: 0; transform: translateY(-6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* AG Grid 行悬停增强 */
.ag-theme-quartz .ag-row:hover {
    box-shadow: inset 3px 0 0 var(--accent);
}

/* AG Grid 选中行 */
.ag-theme-quartz .ag-row-selected {
    color: var(--text-primary);
    box-shadow: inset 3px 0 0 var(--accent);
}

/* 跳转高亮：临时闪烁背景 */
.ag-theme-quartz .ag-row.jump-highlight {
    background: var(--accent-light) !important;
    animation: jump-flash 0.5s ease-out 3;
}
@keyframes jump-flash {
    0%, 100% { background: transparent; }
    50% { background: var(--accent-light); }
}

/* AG Grid 复选框 */
.ag-theme-quartz .ag-checkbox-input-wrapper {
    --ag-checkbox-checked-color: var(--accent);
    accent-color: var(--accent);
}

/* AG Grid 编辑器弹出层修复 */
.ag-theme-quartz .ag-popup-editor {
    background: var(--surface-overlay) !important;
    box-shadow: var(--shadow-lg) !important;
    border: 1px solid var(--accent) !important;
    border-radius: var(--radius-sm) !important;
    z-index: 10000 !important;
    padding: 4px !important;
    opacity: 1 !important;
}
.ag-theme-quartz .ag-popup-child { z-index: 10000 !important; }
.ag-theme-quartz .ag-popup-editor .ag-select,
.ag-theme-quartz .ag-popup-editor .ag-rich-select,
.ag-theme-quartz .ag-popup-editor .ag-select-cell-editor {
    background: var(--surface-overlay) !important;
}
.ag-theme-quartz .ag-popup-editor .ag-picker-field-wrapper,
.ag-theme-quartz .ag-popup-editor .ag-rich-select-list {
    background: var(--surface-overlay) !important;
}
.ag-theme-quartz .ag-popup-editor .ag-list-item,
.ag-theme-quartz .ag-popup-editor .ag-rich-select-row {
    background: transparent !important;
    color: var(--text-primary) !important;
    padding: 6px 10px !important;
    border-radius: var(--radius-xs) !important;
    cursor: pointer;
    transition: background var(--transition-fast);
}
.ag-theme-quartz .ag-popup-editor .ag-list-item:hover,
.ag-theme-quartz .ag-popup-editor .ag-rich-select-row:hover {
    background: var(--bg-hover) !important;
}
.ag-theme-quartz .ag-popup-editor .ag-list-item.ag-selected,
.ag-theme-quartz .ag-popup-editor .ag-rich-select-row.ag-selected {
    background: var(--accent) !important;
    color: var(--text-on-accent) !important;
}
.ag-theme-quartz .ag-cell-edit-input,
.ag-theme-quartz .ag-cell-editor {
    background: var(--bg-input) !important;
    color: var(--text-primary) !important;
    border: 1px solid var(--accent) !important;
    border-radius: var(--radius-xs) !important;
    padding: 4px 8px !important;
    z-index: 10000 !important;
    box-shadow: 0 0 0 3px var(--accent-light);
}
.ag-theme-quartz .ag-popup { z-index: 10000 !important; }

/* AG Grid 浮动过滤 */
.ag-theme-quartz .ag-floating-filter-input {
    background: transparent !important;
    color: var(--text-muted) !important;
    font-size: 11px !important;
}
.ag-theme-quartz .ag-floating-filter {
    border-top: 1px solid var(--border-default) !important;
}

/* AG Grid 排序图标 */
.ag-theme-quartz .ag-header-cell-sortable:hover {
    background: var(--surface-overlay) !important;
}
.ag-theme-quartz .ag-header-icon {
    color: var(--accent) !important;
}

/* AG Grid 滚动条 */
.ag-theme-quartz .ag-body-vertical-scroll::-webkit-scrollbar,
.ag-theme-quartz .ag-body-horizontal-scroll::-webkit-scrollbar {
    width: 6px; height: 6px;
}

/* ===== 单元格内状态胶囊 / 标签片（halo 浅底风格，全站统一） ===== */
.tbl-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 10px;
    border-radius: var(--radius-full);
    font-size: 11px; font-weight: 600;
    line-height: 18px;
    white-space: nowrap;
    user-select: none;
}
.tbl-pill::before {
    content: '';
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: .7;
    flex-shrink: 0;
}
.tbl-tag {
    display: inline-block;
    padding: 0 6px;
    border-radius: var(--radius-xs);
    font-size: 10.5px; line-height: 17px;
    margin-right: 3px;
    white-space: nowrap;
}
.tbl-tag.mapped { background: var(--success-light); color: var(--success-text); }
.tbl-tag.unmapped { background: var(--warning-light); color: var(--warning-text); }

/* ===== 行内操作按钮 ===== */
.tbl-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 26px;
    padding: 0 8px;
    border: none;
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    transition: all var(--transition-fast);
    white-space: nowrap;
    opacity: 0.7;
}
.ag-row:hover .tbl-action-btn { opacity: 1; }
/* 触摸设备无 hover:操作按钮常显,避免不可见 */
@media (hover: none) {
    .ag-row .tbl-action-btn { opacity: 1; }
}
.tbl-action-btn i { font-size: 13px; }
.tbl-action-edit {
    background: var(--menu-hover);
    color: var(--accent-text);
}
.tbl-action-edit:hover {
    box-shadow: var(--shadow-xs), var(--glow-primary);
    transform: scale(1.05);
}
.tbl-action-delete {
    background: var(--danger-light);
    color: var(--danger-text);
    padding: 0 7px;
}
.tbl-action-delete:hover {
    box-shadow: var(--shadow-xs), var(--glow-danger);
    transform: scale(1.05);
}

/* ===== 分页 ===== */
.tbl-pagination { margin-top: 12px; }
.pg-size {
    padding: 6px 8px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xs);
    background: var(--bg-input);
    color: var(--text-secondary);
    font-size: 12px;
    font-family: var(--font-mono);
    cursor: pointer;
    outline: none;
    margin-right: 8px;
}
.pg-size:hover { border-color: var(--accent); color: var(--accent); }
.pg-wrap {
    display: flex; justify-content: center; align-items: center;
    gap: 4px; flex-wrap: wrap;
}
.pg-btn {
    min-width: 32px; height: 32px;
    padding: 0 8px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border-default);
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: 13px;
    font-family: var(--font-mono);
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition-fast);
}
.pg-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--menu-hover);
    box-shadow: var(--glow-primary);
}
.pg-btn.active {
    background: var(--accent);
    color: var(--text-on-accent);
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: var(--glow-primary);
}
.pg-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.pg-info { font-size: 12px; color: var(--text-muted); margin-left: 8px; font-family: var(--font-mono); }

/* ===== Cookie 验证结果 ===== */
.tbl-cookie-result {
    display: none;
    margin-top: 16px; padding: 16px;
    background: var(--bg-muted);
    border-radius: var(--radius);
    border: 1px solid var(--border-default);
}
.tbl-cookie-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
}
.tbl-cookie-title {
    margin: 0; font-size: 14px; font-weight: 600;
    font-family: var(--font-display);
    display: flex; align-items: center; gap: 6px;
}
.tbl-cookie-stats { font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); }
.tbl-cookie-log {
    max-height: 300px; overflow-y: auto;
    font-size: 12px; font-family: var(--font-mono);
    background: var(--bg-base);
    border-radius: var(--radius-sm);
    padding: 12px;
    border: 1px solid var(--border-default);
}

/* ===== 字段分类表头着色：极淡同色底 + 顶部实色条（明暗两主题通用） ===== */
.ag-theme-quartz .ag-header-cell.col-cat-original {
    background: rgba(0, 97, 164, 0.05) !important;
    border-top: 2px solid var(--accent);
}
.ag-theme-quartz .ag-header-cell.col-cat-edit {
    background: rgba(180, 83, 9, 0.05) !important;
    border-top: 2px solid var(--warning);
}
.ag-theme-quartz .ag-header-cell.col-cat-fetched {
    background: rgba(22, 163, 74, 0.05) !important;
    border-top: 2px solid var(--success);
}
.ag-theme-quartz .ag-header-cell.col-cat-control {
    background: rgba(107, 87, 120, 0.05) !important;
    border-top: 2px solid var(--md-tertiary);
}
.ag-theme-quartz .ag-header-cell.col-cat-system {
    background: rgba(148, 163, 184, 0.08) !important;
    border-top: 2px solid var(--text-muted);
}
.ag-theme-quartz .ag-header-cell.col-cat-credential {
    background: rgba(180, 83, 9, 0.05) !important;
    border-top: 2px solid var(--warning);
}
.ag-theme-quartz .ag-header-cell.col-cat-status {
    background: rgba(107, 87, 120, 0.05) !important;
    border-top: 2px solid var(--md-tertiary);
}

/* ===== 分类图例 ===== */
.tbl-cat-legend {
    display: inline-flex; align-items: center; gap: 8px;
    margin-left: 8px;
}
/* 图例：浅底小胶囊 + 同色圆点，去掉旧主题的霓虹发光 */
.tbl-cat-item {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px;
    border-radius: var(--radius-full);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.02em;
    background: rgba(148, 163, 184, 0.10);
    color: var(--text-secondary);
}
.tbl-cat-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
    background: currentColor;
}
.tbl-cat-item.col-cat-original { background: rgba(0, 97, 164, 0.08); color: var(--accent); }
.tbl-cat-item.col-cat-edit { background: rgba(180, 83, 9, 0.10); color: var(--warning); }
.tbl-cat-item.col-cat-fetched { background: rgba(22, 163, 74, 0.10); color: var(--success); }
.tbl-cat-item.col-cat-control { background: rgba(107, 87, 120, 0.10); color: var(--md-tertiary); }
.tbl-cat-item.col-cat-system { background: rgba(148, 163, 184, 0.14); color: var(--text-secondary); }
.tbl-cat-item.col-cat-credential { background: rgba(180, 83, 9, 0.10); color: var(--warning); }
.tbl-cat-item.col-cat-status { background: rgba(107, 87, 120, 0.10); color: var(--md-tertiary); }

/* ===== 表图标颜色 ===== */
.tab-icon.coll { color: var(--accent); }
.tab-icon.acc { color: var(--success); }
.tab-icon.ck { color: var(--warning); }
.tab-icon.hist { color: var(--info); }
.tab-icon.task { color: var(--info); }

/* ===== 弹窗 ===== */
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 11, 15, 0.7); z-index: 1000;
    align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.modal-overlay[style*="display: flex"], .modal-overlay[style*="display:flex"] { display: flex !important; }
.modal-box {
    background: var(--bg-muted);
    border-radius: var(--radius-xl);
    padding: 24px;
    width: 90%; max-height: 80vh; overflow-y: auto;
    border: 1px solid var(--border-default);
    box-shadow: var(--shadow-xl);
    animation: modal-in 300ms cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes modal-in {
    from { transform: translateY(16px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}
.modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-default);
}
.modal-header h3 {
    margin: 0; font-size: 16px; font-weight: 600;
    font-family: var(--font-display);
    display: flex; align-items: center; gap: 8px;
    color: var(--text-primary);
}
.modal-header h3 i { color: var(--accent); font-size: 20px; }
.modal-close {
    background: none; border: none;
    font-size: 18px; cursor: pointer;
    color: var(--text-muted);
    padding: 4px; border-radius: var(--radius-xs);
    transition: all var(--transition-fast);
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
}
.modal-close:hover { background: var(--danger-light); color: var(--danger-text); }

/* ===== 表单字段 (弹窗内) ===== */
.tbl-form-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
}
.tbl-form-label {
    width: 120px; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); flex-shrink: 0;
    letter-spacing: 0.02em;
    text-transform: uppercase;
}
.tbl-form-input {
    flex: 1; padding: 8px 12px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit;
    background: var(--bg-input);
    color: var(--text-primary);
    transition: all var(--transition-fast);
}
.tbl-form-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}
.tbl-form-input:disabled {
    opacity: 0.5;
    background: var(--bg-muted);
    cursor: not-allowed;
}
input[type="checkbox"]:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

/* ===== 加载动画 ===== */
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
    .tbl-search-input { min-width: 140px; }
    .tbl-content-toolbar { flex-direction: column; align-items: stretch; }
    .tbl-action-group { justify-content: flex-end; }
    .tbl-grid { height: calc(100vh - 380px); }
}
/* 存为方案弹窗：整体容器 */
.sp-body { display: flex; flex-direction: column; gap: 14px; }
/* 存为方案弹窗：保存方式选项 */
.save-preset-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border: 1px solid var(--border-default);
  border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
  background: var(--bg-input);
  transition: border-color .12s, background .12s, box-shadow .12s;
}
.save-preset-opt:hover { border-color: var(--accent); }
.save-preset-opt:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-light);

function statusPillHtml(text, tone) {
    var pair = TONE_VARS[tone] || TONE_VARS.muted;
    return '<span class="tbl-pill" style="background:' + pair[0] + ';color:' + pair[1] + ';">' + htmlEscape(text) + '</span>';
}

// 获取状态渲染器（枚举：待获取 / 已获取 / 获取失败）
function fetchStatusRenderer(params) {
    var val = params.value || '待获取';
    return statusPillHtml(val, STATUS_TONES[val] || 'muted');
}

    // 解析状态渲染器（枚举：待解析 / 已就绪 / 已生成 / 已删除 / 解析失败）
    function parseStatusRenderer(params) {
        var val = params.value || '待解析';
        return statusPillHtml(val, STATUS_TONES[val] || 'muted');
    }

    function tagsRenderer(params) {
        let val = params.value;
        if (!val) return '<span style="color: var(--text-muted);">-</span>';
        let tags = [];
        if (typeof val === 'string') {
            try {
                const parsed = JSON.parse(val);
                if (Array.isArray(parsed)) tags = parsed;
            } catch (e) { }
            if (tags.length === 0 && val.includes(',')) {
                tags = val.split(',').map(t => t.trim()).filter(Boolean);
            }
        }
        if (tags.length > 0) {
            return tags.slice(0, 5).map(function(t) {
                var _tagLower = String(t).toLowerCase();
                var isMapped = TAGS_MAPPING && Object.keys(TAGS_MAPPING).some(function(k) {
                    return TAGS_MAPPING[k].toLowerCase() === _tagLower || k.toLowerCase() === _tagLower;
                });
                var cls = isMapped ? 'tbl-tag mapped' : 'tbl-tag unmapped';
                var raw = String(t);
                var display = raw.length > 12 ? raw.substring(0, 12) + '...' : raw;
                return '<span class="' + cls + '" title="' + (isMapped ? htmlEscape(raw) : '未匹配映射') + '">' + htmlEscape(display) + '</span>';
            }).join('') + (tags.length > 5 ? '<span style="font-size:11px;color:var(--text-muted);">+' + (tags.length - 5) + '</span>' : '');
        }
        let display = String(val);
        if (display.length > 30) display = display.substring(0, 30) + '…';
        return '<span title="' + String(val).replace(/"/g, '&quot;') + '">' + display + '</span>';
    }

        html += '</div>';
        return html;
    }

async function copyCookieValue(recordId) {
    let val = '';
    if (gridApi) {
        gridApi.forEachNode(function(node) {
            if (!node.data) return;
            if ((node.data.record_id || String(node.data.ID || '')) === recordId) {
                val = node.data.Cookie || '';
            }
        });
    }
    if (!val) { showToast('未找到 Cookie', 'error'); return; }
    try {
        await navigator.clipboard.writeText(val);
        showToast('Cookie 已复制', 'success');
    } catch (e) {
        showToast('复制失败，请手动复制', 'error');
    }
}

    function htmlEscape(str) {
        return String(str).replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

    function syncSelectAllHeader() {
        if (!gridApi) return;

        cb.checked = total > 0 && selected === total;

    // =========================================================================
    // 表头排序 + 多选筛选弹窗

    var filterPopupEl = null;

    async function openFilterPopup(event, field) {
        closeFilterPopup();
        const btn = event.target.closest('button') || event.target;
        const rect = btn.getBoundingClientRect();
        const popup = document.createElement('div');
        popup.className = 'tbl-filter-popup';
        popup.style.cssText =
            'position:fixed;z-index:20000;width:225px;background:var(--surface-overlay);' +
            'border:1px solid var(--border-default);border-radius:var(--radius-sm);' +
            'box-shadow:var(--shadow-lg);padding:10px;font-size:13px;color:var(--text-primary);';
        let left = rect.left - 100;
        let top = rect.bottom + 6;
        if (left < 8) left = 8;
        if (left + 225 > window.innerWidth) left = window.innerWidth - 233;
        popup.style.left = left + 'px';
        popup.style.top = top + 'px';

        // 排序按钮行
        const sortRow = document.createElement('div');
        sortRow.className = 'fp-sort-row';
        const curSort = currentSortField === field ? currentSortOrder : '';
        [['升序', 'asc', '↑'], ['降序', 'desc', '↓']].forEach(function(pair) {
            const sb = document.createElement('button');
            sb.className = 'fp-sort-btn' + (curSort === pair[1] ? ' active' : '');
            sb.innerHTML = '<span style="font-weight:700;">' + pair[2] + '</span> ' + pair[0];
            sb.addEventListener('click', function(e) {
                e.stopPropagation();
                applyColSort(field, curSort === pair[1] ? '' : pair[1]);
            });
            sortRow.appendChild(sb);
        });
        popup.appendChild(sortRow);

        // 搜索框
        const searchInput = document.createElement('input');
        searchInput.className = 'fp-search';
        searchInput.type = 'text';
        searchInput.placeholder = '搜索…';
        popup.appendChild(searchInput);

        // 值列表容器
        const listBox = document.createElement('div');
        listBox.className = 'fp-list';
        popup.appendChild(listBox);

        // 底部按钮
        const footer = document.createElement('div');
        footer.className = 'fp-footer';
        const confirmBtn = document.createElement('button');
        confirmBtn.textContent = '确定';
        confirmBtn.className = 'btn btn-primary btn-sm';
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = '取消';
        cancelBtn.className = 'btn btn-secondary btn-sm';
        const clearBtn = document.createElement('button');
        clearBtn.textContent = '清除';
        clearBtn.className = 'btn btn-secondary btn-sm';
        footer.appendChild(clearBtn);
        footer.appendChild(cancelBtn);
        footer.appendChild(confirmBtn);
        popup.appendChild(footer);

        document.body.appendChild(popup);
        filterPopupEl = popup;

        // 选中状态（临时副本）
        const checked = new Set(currentFilters[field] || []);

        // 异步加载去重值 + 每个值的记录数（value-counts 接口：标签字段已拆项计数）
        var allValues = [];
        var valueCounts = {};   // { value: count }
        try {
            // 传入其他字段的筛选条件：计数随其他筛选联动收窄（本字段自身条件由后端排除）
            var otherKeys = Object.keys(currentFilters).filter(function(k) { return k !== field && currentFilters[k] && currentFilters[k].length; });
            var q = otherKeys.map(function(k) { return { field: k, values: currentFilters[k] }; });
            var cntUrl = '/api/database/table/' + currentTable + '/value-counts/' + encodeURIComponent(field);
            if (q.length) cntUrl += '?filters=' + encodeURIComponent(JSON.stringify(q));
            const resp = await apiCall(cntUrl, 'GET');
            (resp.values || []).forEach(function(it) {
                allValues.push(it.value);
                valueCounts[String(it.value)] = it.count;
            });
        } catch (e) {
            allValues = collectDistinctValues(field);
        }
        if (filterPopupEl !== popup) return;

        function renderList(filterText) {
            listBox.innerHTML = '';
            const lower = (filterText || '').toLowerCase();
            const filtered = allValues.filter(function(v) { return !lower || String(v).toLowerCase().includes(lower); });
            if (!filtered.length) {
                listBox.innerHTML = '<div class="fp-empty-hint">无匹配项</div>';
                return;
            }
            filtered.forEach(function(v) {
                const opt = document.createElement('label');
                opt.className = 'fp-opt';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = checked.has(v);
                cb.addEventListener('change', function() {
                    if (cb.checked) checked.add(v);
                    else checked.delete(v);
                });
                const span = document.createElement('span');
                span.textContent = v;
                opt.appendChild(cb);
                opt.appendChild(span);
                if (valueCounts[v] != null) {
                    const cnt = document.createElement('span');
                    cnt.className = 'fp-count';
                    cnt.textContent = String(valueCounts[v]);
                    opt.appendChild(cnt);
                }
                listBox.appendChild(opt);
            });
        }
        renderList('');
        searchInput.addEventListener('input', function() { renderList(searchInput.value.trim()); });

        confirmBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            applyFieldFilter(field, Array.from(checked));
        });
        cancelBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeFilterPopup();
        });
        clearBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            applyFieldFilter(field, []);
        });
        setTimeout(function() { searchInput.focus(); }, 0);
    }

    function closeFilterPopup() {
        if (filterPopupEl) { filterPopupEl.remove(); filterPopupEl = null; }
    }

    // 收集当前表某字段的去重值（兜底用：仅当前页数据）
    function collectDistinctValues(field) {
        const vals = new Set();
        if (gridApi) {
            gridApi.forEachNode(function(node) {
                if (!node.data || node.data[field] == null) return;
                let v = node.data[field];
                if (field === '标签') {
                    if (typeof v === 'string') {
                        try { const p = JSON.parse(v); if (Array.isArray(p)) v = p; } catch (e) {}
                    }
                    if (Array.isArray(v)) { v.forEach(function(t) { vals.add(String(t)); }); }
                    else if (v) { vals.add(String(v)); }
                } else {
                    vals.add(String(v));
                }
            });
        }
        return Array.from(vals).sort();
    }

    function applyColSort(field, order) {
        closeFilterPopup();
        if (order) {
            currentSortField = field;
            currentSortOrder = order;
        } else {
            currentSortField = '';
            currentSortOrder = '';
        }
        showTable(currentTable, 1, currentKeyword);
    }

    function applyFieldFilter(field, values) {
        closeFilterPopup();
        if (values && values.length) currentFilters[field] = values;
        else delete currentFilters[field];
        showTable(currentTable, 1, currentKeyword);
    }

    window._tblDocClick = function(e) {
