{% extends "base.html" %}
{% block title %}服务状态 - DoukHub{% endblock %}
{% block content %}
<style>
.status-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: var(--bg-muted);
    border-radius: var(--radius);
    margin-bottom: 10px;
    border: 1px solid var(--border-default);
    transition: all var(--transition);
}
.status-card:hover {
    border-color: var(--border-strong);
}
.status-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    font-weight: 600;
}
.status-icon.connected {
    background: var(--success-light);
    color: var(--success);
}
.status-icon.disconnected {
    background: var(--danger-light);
    color: var(--danger);
}
.status-icon.unknown {
    background: var(--warning-light);
    color: var(--warning);
}
.status-icon.missing {
    background: var(--bg-hover);
    color: var(--text-muted);
}
.status-info { flex: 1; min-width: 0; }
.status-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.status-message { font-size: 13px; color: var(--text-muted); }
.status-actions { display: flex; gap: 8px; flex-shrink: 0; }
</style>

<div class="page-head">
    <div>
        <h1 class="page-title">服务状态</h1>
        <div class="page-sub">TTD、XHS 与后台任务健康状态</div>
    </div>
    <div class="page-actions">
        <button class="btn btn-secondary" onclick="refreshStatus()"><i data-lucide="rotate-cw"></i> 刷新状态</button>
    </div>
</div>

<div class="card">
    <h3><i data-lucide="package"></i> 内核检测</h3>
    <div id="kernel-section">
        <div id="kernel-ttd" class="status-card">
            <div class="status-icon missing" id="kernel-ttd-icon"><i data-lucide="help-circle"></i></div>
            <div class="status-info">
                <div class="status-name">TikTokDownloader 内核</div>
                <div class="status-message" id="kernel-ttd-msg">检测中...</div>
            </div>
            <div class="status-actions">
                <button class="btn btn-primary btn-sm" id="kernel-ttd-btn" onclick="installKernel('TikTokDownloader')"><i data-lucide="download"></i> 从 GitHub 下载</button>
            </div>
        </div>
        <div id="kernel-xhs" class="status-card">
            <div class="status-icon missing" id="kernel-xhs-icon"><i data-lucide="help-circle"></i></div>
            <div class="status-info">
                <div class="status-name">XHS-Downloader 内核</div>
                <div class="status-message" id="kernel-xhs-msg">检测中...</div>
            </div>
            <div class="status-actions">
                <button class="btn btn-primary btn-sm" id="kernel-xhs-btn" onclick="installKernel('XHS-Downloader')"><i data-lucide="download"></i> 从 GitHub 下载</button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <h3><i data-lucide="plug"></i> 服务连接</h3>

    <div class="status-card" id="feishu-card">
        <div class="status-icon unknown" id="feishu-icon"><i data-lucide="help-circle"></i></div>
        <div class="status-info">
            <div class="status-name">云端 API</div>
            <div class="status-message" id="feishu-message">检测中...</div>
        </div>
        <div class="status-actions">
            <button class="btn btn-secondary btn-sm" onclick="testFeishu()"><i data-lucide="plug-zap"></i> 测试连接</button>
        </div>
    </div>

    <div class="status-card" id="ttd-card">
        <div class="status-icon unknown" id="ttd-icon"><i data-lucide="help-circle"></i></div>
        <div class="status-info">
            <div class="status-name">TikTokDownloader</div>
            <div class="status-message" id="ttd-message">检测中...</div>
        </div>
        <div class="status-actions">
            <button class="btn btn-success btn-sm" onclick="controlService('TikTokDownloader', 'start')"><i data-lucide="play"></i> 启动</button>
            <button class="btn btn-danger btn-sm" onclick="controlService('TikTokDownloader', 'stop')"><i data-lucide="square"></i> 停止</button>
            <button class="btn btn-secondary btn-sm" onclick="testTTD()"><i data-lucide="plug-zap"></i> 测试</button>
        </div>
    </div>

    <div class="status-card" id="xhs-card">
        <div class="status-icon unknown" id="xhs-icon"><i data-lucide="help-circle"></i></div>
        <div class="status-info">
            <div class="status-name">XHS-Downloader</div>
            <div class="status-message" id="xhs-message">检测中...</div>
        </div>
        <div class="status-actions">
            <button class="btn btn-success btn-sm" onclick="controlService('XHS-Downloader', 'start')"><i data-lucide="play"></i> 启动</button>
            <button class="btn btn-danger btn-sm" onclick="controlService('XHS-Downloader', 'stop')"><i data-lucide="square"></i> 停止</button>
            <button class="btn btn-secondary btn-sm" onclick="testXHS()"><i data-lucide="plug-zap"></i> 测试</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // SPA 友好:直接调用(脚本在 body 末尾,DOM 已就绪;SPA 二次进入由 rebindScripts 重执行)
    refreshStatus();

    async function refreshStatus() {
        try {
            const data = await apiCall('/api/status', 'GET');
            updateStatusCard('feishu', data.feishu);
            updateStatusCard('ttd', data.ttd);
            updateStatusCard('xhs', data.xhs);
            if (data.kernels) {
                updateKernelCard('ttd', data.kernels.ttd);
                updateKernelCard('xhs', data.kernels.xhs);
            }
        } catch (e) {
            console.error('获取状态失败:', e);
        }
    }

    function updateStatusCard(name, status) {
        if (!status) return;
        const icon = document.getElementById(`${name}-icon`);
        const message = document.getElementById(`${name}-message`);
        if (!icon || !message) return;

        if (status.connected) {
            icon.className = 'status-icon connected';
            icon.innerHTML = '<i data-lucide="check"></i>';
            message.textContent = status.message;
        } else {
            icon.className = 'status-icon disconnected';
            icon.innerHTML = '<i data-lucide="x"></i>';
            message.textContent = status.message;
        }
        if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
    }

    function updateKernelCard(name, kernel) {
        const icon = document.getElementById(`kernel-${name}-icon`);
        const msg = document.getElementById(`kernel-${name}-msg`);
        const btn = document.getElementById(`kernel-${name}-btn`);
        if (!icon || !msg) return;

        if (kernel.installed) {
            icon.className = 'status-icon connected';
            icon.innerHTML = '<i data-lucide="check"></i>';
            msg.textContent = '已安装: ' + kernel.path;
            if (btn) btn.style.display = 'none';
        } else {
            icon.className = 'status-icon missing';
            icon.innerHTML = '<i data-lucide="triangle-alert"></i>';
            msg.textContent = '未安装, 请点击右侧按钮从 GitHub 下载';
            if (btn) btn.style.display = '';
        }
        if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
    }

    async function installKernel(name) {
        const prefix = name.startsWith('TikTok') ? 'ttd' : 'xhs';
        const msg = document.getElementById(`kernel-${prefix}-msg`);
        const btnEl = document.getElementById(`kernel-${prefix}-btn`);

        if (!await confirmDialog('将从 GitHub 下载 ' + name + ' 内核源码，需要已安装 git。', { title: '下载确认', confirmText: '下载', danger: false })) return;

        if (btnEl) {
            btnEl.disabled = true;
            btnEl.innerHTML = '<i data-lucide="loader-circle"></i> 下载中...';
            if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
        }
        if (msg) msg.textContent = '正在从 GitHub 克隆源码, 请耐心等待...';
        showToast('正在下载内核源码...', 'info');

        try {
            const data = await apiCall(`/api/kernels/${name}/install`, 'POST');
            if (data.success) {
                showToast(data.message, 'success');
                setTimeout(() => refreshStatus(), 1000);
            } else {
                showToast(data.message, 'error');
                if (msg) msg.textContent = data.message;
            }
        } catch (e) {
            showToast('下载失败: ' + e.message, 'error');
            if (msg) msg.textContent = '下载失败: ' + e.message;
        } finally {
            if (btnEl) {
                btnEl.disabled = false;
                btnEl.innerHTML = '<i data-lucide="download"></i> 从 GitHub 下载';
                if (window._doukhubRefreshIcons) window._doukhubRefreshIcons();
            }
        }
    }

    async function testFeishu() {
        const message = document.getElementById('feishu-message');
        message.textContent = '测试中...';
        try {
            const data = await apiCall('/api/status/test/feishu', 'POST');
            message.textContent = data.message;
            updateStatusCard('feishu', {connected: data.success, message: data.message});
        } catch (e) {
            message.textContent = '测试失败: ' + e.message;
        }
    }

    async function testTTD() {
        const message = document.getElementById('ttd-message');
        message.textContent = '测试中...';
        try {
            const data = await apiCall('/api/status/test/ttd', 'POST');
            message.textContent = data.message;
            updateStatusCard('ttd', {connected: data.success, message: data.message});
        } catch (e) {
            message.textContent = '测试失败: ' + e.message;
        }
    }

    async function testXHS() {
        const message = document.getElementById('xhs-message');
        message.textContent = '测试中...';
        try {
            const data = await apiCall('/api/status/test/xhs', 'POST');
            message.textContent = data.message;
            updateStatusCard('xhs', {connected: data.success, message: data.message});
        } catch (e) {
            message.textContent = '测试失败: ' + e.message;
        }
    }

    async function controlService(name, action) {
        const data = await apiCall(`/api/services/${name}/${action}`, 'POST');
        showToast(data.message, data.success ? 'success' : 'error');
        if (data.success) {
            setTimeout(() => refreshStatus(), 2000);
        }
    }
</script>
{% endblock %}
