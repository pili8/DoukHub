{% extends "base.html" %}
{% block title %}采集 - DoukHub{% endblock %}
{% block content %}
<div class="page-header">
    <h2>采集任务</h2>
</div>

<div class="card">
    <h3>📥 整号采集</h3>
    <form id="account-form" onsubmit="submitAccountCollect(event)">
        <div class="form-group">
            <label>评级筛选（只采集选中星级以上）</label>
            <div style="display: flex; gap: 12px;">
                <label><input type="checkbox" name="rating" value="5" checked> ⭐⭐⭐⭐⭐</label>
                <label><input type="checkbox" name="rating" value="4" checked> ⭐⭐⭐⭐</label>
                <label><input type="checkbox" name="rating" value="3" checked> ⭐⭐⭐</label>
                <label><input type="checkbox" name="rating" value="2"> ⭐⭐</label>
                <label><input type="checkbox" name="rating" value="1"> ⭐</label>
            </div>
        </div>
        <div class="form-group">
            <label>指定账号（留空=采集所有符合条件的账号）</label>
            <input type="text" name="account_names" placeholder="输入账号名称，多个用逗号分隔">
        </div>
        <button type="submit" class="btn btn-primary">开始整号采集</button>
    </form>
</div>

<div class="card">
    <h3>🔗 单品采集</h3>
    <form id="detail-form" onsubmit="submitDetailCollect(event)">
        <div class="form-group">
            <label>粘贴作品链接（支持多个，一行一个，自动识别平台）</label>
            <textarea name="links" rows="6" placeholder="https://www.douyin.com/video/...&#10;https://www.xiaohongshu.com/explore/..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">开始单品采集</button>
    </form>
</div>

<div class="card" id="result-card" style="display: none;">
    <h3>执行结果</h3>
    <div id="result-content"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    async function submitAccountCollect(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        // 获取最小评级
        const ratings = form.getAll('rating');
        const minRating = ratings.length ? Math.min(...ratings.map(Number)) : 3;
        const body = new FormData();
        body.append('account_names', form.get('account_names') || '');
        body.append('rating_min', minRating);

        showToast('开始采集...');
        const data = await apiCall('/api/collect/account', 'POST', body);
        showResults(data);
    }
    async function submitDetailCollect(e) {
        e.preventDefault();
        const form = new FormData(e.target);
        const body = new FormData();
        body.append('links', form.get('links'));

        showToast('开始采集...');
        const data = await apiCall('/api/collect/detail', 'POST', body);
        showResults(data);
    }
    function showResults(data) {
        const card = document.getElementById('result-card');
        const content = document.getElementById('result-content');
        card.style.display = 'block';

        if (data.results) {
            let html = '<table><tr><th>名称/链接</th><th>平台</th><th>状态</th><th>作品数</th><th>耗时</th><th>信息</th></tr>';
            for (const r of data.results) {
                const status = r.status === 'success' ? '✅' : '❌';
                html += `<tr>
                    <td>${r.name || r.link || '-'}</td>
                    <td>${r.platform || '-'}</td>
                    <td>${status}</td>
                    <td>${r.works_count || 0}</td>
                    <td>${r.duration || '-'}</td>
                    <td>${r.message || ''}</td>
                </tr>`;
            }
            html += '</table>';
            content.innerHTML = html;
        } else {
            content.innerHTML = `<p>${data.message || '未知错误'}</p>`;
        }
        showToast(data.message || '完成', data.success ? 'success' : 'error');
    }
</script>
{% endblock %}
